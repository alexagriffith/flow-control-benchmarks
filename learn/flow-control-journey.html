<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-d flow control explainer</title>
<style>
/* ============ INFERRA TOKENS ============ */
:root{
  --canvas:#08090B;--base:#0e1014;--raised:#14171d;--inset:#05060a;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.10);--b3:rgba(255,255,255,.16);
  --txt:#e8eaf0;--txt2:#9aa0ad;--txt3:#5f6673;
  --brand:#5B6CF0;--brand-soft:rgba(91,108,240,.12);
  --teal:#159a9a;--amber:#c98500;--danger:#e5534b;--ok:#3fa66a;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html[data-mode="light"]{
  --canvas:#f7f8fa;--base:#ffffff;--raised:#f1f2f6;--inset:#e9eaef;
  --b1:rgba(10,12,20,.08);--b2:rgba(10,12,20,.13);--b3:rgba(10,12,20,.22);
  --txt:#14161c;--txt2:#4c5260;--txt3:#8a8f9c;
  --brand:#4353d8;--brand-soft:rgba(67,83,216,.10);
  --teal:#0e7f7f;--amber:#9a6a00;--danger:#c43d36;--ok:#2b8653;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--txt);font-size:14px;
  font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;transition:background .3s,color .3s}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
#app{max-width:1120px;margin:0 auto;padding:18px 20px 30px;display:flex;flex-direction:column;min-height:100vh}
/* header */
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px;border-bottom:1px solid var(--b1)}
header .t{font-size:15px;font-weight:600}
header .t span{font-weight:400;color:var(--txt3);font-size:12.5px;margin-left:10px}
.ctl{display:flex;gap:8px}
.pill{border:1px solid var(--b2);border-radius:999px;background:var(--base);color:var(--txt2);
  font-size:11.5px;padding:5px 12px;cursor:pointer;transition:all .18s var(--ease)}
.pill:hover{border-color:var(--b3);color:var(--txt)}
.pill.on{border-color:var(--brand);color:var(--txt);background:var(--brand-soft)}
/* timeline */
#timeline{display:flex;align-items:center;padding:13px 2px;border-bottom:1px solid var(--b1)}
.stop{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt3);cursor:pointer;white-space:nowrap}
.stop .n{width:20px;height:20px;border-radius:99px;border:1px solid var(--b2);display:grid;place-items:center;font-size:10px;position:relative}
.stop.done .n{background:var(--brand);border-color:var(--brand);color:#fff}
.stop.act{color:var(--txt)}
.stop.act .n{border-color:var(--brand);color:var(--brand)}
.stop.act .n svg{position:absolute;inset:-3px}
.tl-line{flex:1;height:1px;background:var(--b1);margin:0 9px}
/* stage */
#stage{flex:1;position:relative;min-height:430px}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);display:flex;flex-direction:column;padding-top:22px}
.page.act{opacity:1;pointer-events:auto}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
h2{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px;line-height:1.1}
.point{font-size:13.5px;color:var(--txt2);margin:0 0 18px;max-width:640px}
.viz{flex:0 1 auto;background:var(--base);border:1px solid var(--b1);border-radius:12px;padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:340px;max-height:520px}
.footnote{font-size:11px;color:var(--txt3);margin-top:10px}
.provenance{position:absolute;top:14px;right:16px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);border:1px solid var(--b1);border-radius:999px;padding:3px 9px}
/* nav */
#nav{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.navbtn{border:1px solid var(--b2);border-radius:8px;background:var(--base);color:var(--txt);font-size:12.5px;padding:7px 16px;cursor:pointer;transition:all .18s var(--ease)}
.navbtn:hover{border-color:var(--brand)}
.navbtn[disabled]{opacity:.35;cursor:default}
#pgno{font-size:11px;color:var(--txt3)}
/* shared viz pieces */
.node{background:var(--raised);border:1px solid var(--b2);border-radius:8px;padding:9px 13px;font-size:12px;text-align:center;transition:all .3s var(--ease)}
.node.hot{border-color:var(--brand);box-shadow:0 0 16px var(--brand-soft)}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:-1px}
.lab{font-size:10.5px;color:var(--txt3)}
.legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--txt2)}
svg text{font-family:Inter,-apple-system,"Segoe UI",sans-serif}
svg .mono-t{font-family:"Geist Mono",ui-monospace,monospace}
/* playground */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--b2);border-radius:8px;background:var(--raised);font-size:11px;color:var(--txt2);padding:6px 6px;text-align:center;cursor:pointer;transition:all .18s var(--ease)}
.chip:hover{border-color:var(--b3);color:var(--txt)}
.chip.on{border-color:var(--brand);color:var(--txt);background:var(--brand-soft)}
.pg-grid{display:flex;gap:12px;flex:1;min-height:0}
.knobs{flex:0 0 200px;display:flex;flex-direction:column;gap:8px}
.knob{background:var(--raised);border:1px solid var(--b1);border-radius:8px;padding:9px 11px}
.kk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.krow{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:6px}
.krow input[type=range]{flex:1;accent-color:var(--brand);height:3px}
.krow .val{width:24px;text-align:right}
.seg{display:flex;border:1px solid var(--b2);border-radius:8px;overflow:hidden;font-size:11px}
.seg div{flex:1;text-align:center;padding:5px 4px;cursor:pointer;color:var(--txt2)}
.seg div.on{background:var(--brand-soft);color:var(--txt)}
.counters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.counter{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;background:var(--inset);border:1px solid var(--b1);border-radius:8px;padding:6px 9px;color:var(--txt2)}
.narr{font-size:12px;color:var(--txt2);margin-top:10px;min-height:32px}
@media (max-width:840px){.chips{grid-template-columns:repeat(2,1fr)}.pg-grid{flex-direction:column}.knobs{flex:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="t">llm-d flow control explainer<span id="subtitle"></span></div>
  <div class="ctl">
    <button class="pill on" id="autoBtn">▶ auto · 20s</button>
    <button class="pill" id="modeBtn">☾ dark</button>
    <button class="pill" id="skipBtn">Skip to playground</button>
  </div>
</header>
<div id="timeline"></div>
<div id="stage"></div>
<div id="nav">
  <button class="navbtn" id="prevBtn">← Back</button>
  <span id="pgno" class="mono"></span>
  <button class="navbtn" id="nextBtn">Next →</button>
</div>
</div>

<script>
/* =====================================================================
   llm-d flow control explainer · single file
   Edit any page's text in PAGES below. Charts and animations draw from
   the same definitions. No build step.
   ===================================================================== */
const $=s=>document.querySelector(s);
const COLORS={premium:'var(--brand)',standard:'var(--amber)',batch:'var(--teal)'};

/* ---------- page definitions: title, point line, viz builder ---------- */
const ACTS=[
  {name:'Why',pages:[1,2]},
  {name:'Where',pages:[3]},
  {name:'How',pages:[4,5,6,7]},
  {name:'Behavior',pages:[8,9,10]},
  {name:'The trade',pages:[11]},
  {name:'Play',pages:[12]},
];

const PAGES=[
/* ---- PAGE 0 · TITLE ---- */
{sub:'',build:p=>{p.innerHTML=`
  <div style="flex:1;display:grid;place-items:center;text-align:center">
    <div>
      <div class="eyebrow">llm-d · Endpoint Picker</div>
      <div style="font-size:clamp(30px,5vw,44px);font-weight:650;letter-spacing:-.03em;line-height:1.1">
        Flow control makes shared<br>inference predictable.</div>
      <p class="point" style="margin:16px auto 22px">Six stops, then play with it yourself.</p>
      <button class="navbtn" style="border-color:var(--brand);background:var(--brand-soft)" onclick="go(1)">Start the journey</button>
    </div>
  </div>`;}},

/* ---- PAGE 1 · THE COST PROBLEM ---- */
{sub:'Why',title:'The cost problem',point:'Every tenant gets a dedicated GPU. Traffic arrives in bursts, so most of that silicon sits idle between them.',
 provenance:'illustrative',
 build:p=>{vizHTML(p,`
  <div style="display:flex;gap:18px;justify-content:center;align-items:center;height:100%;padding:10px 0">
    <div style="display:flex;gap:22px" id="p1gpus"></div>
    <div style="max-width:160px;text-align:center;margin-left:18px">
      <div class="mono" style="font-size:28px;font-weight:650;letter-spacing:-.02em" id="p1avg">0%</div>
      <div class="lab" style="margin-top:4px">average utilization across three dedicated GPUs</div>
      <div class="lab" style="margin-top:8px;color:var(--danger);font-size:10px">paid for 100%, using ~30%</div>
    </div>
  </div>`);
  const gpus=p.querySelector('#p1gpus');
  const tenants=[['Tenant A','premium',1.0,0],['Tenant B','standard',0.6,1.2],['Tenant C','batch',1.8,0.7]];
  gpus.innerHTML=tenants.map(([n,c])=>`
    <div style="text-align:center;width:120px">
      <div class="lab" style="margin-bottom:6px">${n}</div>
      <div style="position:relative;height:200px">
        <div style="position:absolute;inset:0;overflow:hidden" class="p1lane"></div>
        <div style="position:absolute;bottom:0;left:8px;right:8px;height:190px;border:1px solid var(--b2);border-radius:10px;background:var(--raised);overflow:hidden">
          <div class="p1fill" style="position:absolute;bottom:0;left:0;right:0;height:0;background:${COLORS[c]};opacity:.7;transition:height .3s var(--ease)"></div>
          <div style="position:absolute;top:8px;left:0;right:0;text-align:center" class="lab">GPU</div>
        </div>
      </div>
      <div class="mono" style="font-size:12px;margin-top:6px"><span class="p1pct">0</span>%</div>
    </div>`).join('');},
 enter:p=>{const lanes=p.querySelectorAll('.p1lane');const fills=p.querySelectorAll('.p1fill');
  const pcts=p.querySelectorAll('.p1pct');const avg=p.querySelector('#p1avg');
  const tenants=[['premium',1.0,0],['standard',0.6,1.2],['batch',1.8,0.7]];
  const dots=[[],[],[]];
  tenants.forEach((_,i)=>{const lane=lanes[i];
    for(let d=0;d<6;d++){const el=document.createElement('div');
      el.style.cssText='position:absolute;width:8px;height:8px;border-radius:99px;opacity:0;background:'+
        (i===0?'var(--brand)':i===1?'var(--amber)':'var(--teal)');
      lane.appendChild(el);dots[i].push({el,y:-20-d*18,active:false});}});
  let t0=performance.now();
  animLoop(p,now=>{const t=(now-t0)/1000;
    const vals=tenants.map(([c,freq,phase],i)=>{
      const burst=Math.max(0,Math.sin(t*freq+phase))**3;
      const util=5+burst*60;
      fills[i].style.height=util+'%';
      pcts[i].textContent=Math.round(util);
      dots[i].forEach((d,j)=>{
        if(burst>0.3&&!d.active&&Math.random()<0.08){d.active=true;d.y=-10;d.el.style.left=(20+Math.random()*60)+'%';}
        if(d.active){d.y+=2.2;d.el.style.top=d.y+'px';d.el.style.opacity=d.y<160?1:0;
          if(d.y>190){d.active=false;d.y=-20;d.el.style.opacity=0;}}});
      return util;});
    avg.textContent=Math.round(vals.reduce((a,b)=>a+b,0)/3)+'%';});}},

/* ---- PAGE 2 · THE BURST PROBLEM ---- */
{sub:'Why',title:'The burst problem',point:'LLM traffic arrives in bursts, so capping at the average clips your peaks and wastes throughput, while letting bursts through breaks your SLAs. Flow control does not remove that trade. It decides who absorbs it, and moves the waiting to where policy can see it.',
 build:p=>{vizHTML(p,`
  <svg viewBox="0 0 900 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <line x1="60" y1="250" x2="860" y2="250" stroke="var(--b2)"/>
    <line x1="60" y1="130" x2="860" y2="130" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8"/>
    <text x="855" y="122" font-size="11" fill="var(--danger)" text-anchor="end">capacity</text>
    <path id="burstwave" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
    <path id="burstfill" fill="var(--danger)" opacity=".18" stroke="none"/>
    <text x="60" y="285" font-size="11" fill="var(--txt3)">time</text>
    <text id="p2msg" x="460" y="60" font-size="13" fill="var(--txt2)" text-anchor="middle"></text>
  </svg>`);},
 enter:p=>{const w=p.querySelector('#burstwave'),f=p.querySelector('#burstfill'),m=p.querySelector('#p2msg');
  let t0=performance.now();
  animLoop(p,now=>{const t=(now-t0)/1000;
    let d='',dOver='M';
    let over=false;
    for(let x=0;x<=800;x+=8){
      const tt=t*1.1+x/80;
      const y=250-60-42*Math.max(0,Math.sin(tt))**3*2 - 12*Math.sin(tt*2.7);
      d+=(x?'L':'M')+(60+x)+' '+y+' ';
      const yc=Math.min(y,130);
      dOver+=(60+x)+' '+Math.min(y,130)+' L';
    }
    w.setAttribute('d',d);
    // overflow area between wave and cap where wave above cap
    let fa='';
    for(let x=0;x<=800;x+=8){const tt=t*1.1+x/80;
      const y=250-60-42*Math.max(0,Math.sin(tt))**3*2 - 12*Math.sin(tt*2.7);
      fa+=(x?'L':'M')+(60+x)+' '+Math.min(y,130)+' ';}
    for(let x=800;x>=0;x-=8){fa+='L'+(60+x)+' 130 ';}
    f.setAttribute('d',fa+'Z');
    m.textContent = (Math.floor(t/3)%2==0)?'the peaks above the line are broken latency':'cap at the average and those peaks are lost throughput';
  });}},

/* ---- PAGE 3 · WHERE YOU ARE ---- */
{sub:'Where',title:'Where you are',point:'llm-d serves large language models on Kubernetes. Zoom in twice and flow control is a layer inside the Endpoint Picker.',
 build:p=>{vizHTML(p,`
  <div id="zoomwrap" style="height:100%;display:grid;place-items:center">
   <div style="position:relative;width:min(860px,100%);height:100%">
    <div class="zf" id="z1" style="position:absolute;inset:0;border:1px solid var(--b2);border-radius:12px;padding:12px 16px;transition:all .8s var(--ease)">
      <div class="lab">Kubernetes cluster</div>
      <div style="display:flex;gap:10px;margin-top:8px;height:calc(100% - 34px)">
        <div class="node" style="align-self:center">clients</div>
        <div style="align-self:center;color:var(--txt3)">→</div>
        <div class="zf" id="z2" style="flex:1;border:1px solid var(--b2);border-radius:10px;padding:10px 14px;transition:all .8s var(--ease)">
          <div class="lab">llm-d, the serving stack</div>
          <div style="display:flex;gap:10px;margin-top:8px;align-items:center;height:calc(100% - 34px)">
            <div class="node">inference<br>gateway</div>
            <div style="color:var(--txt3)">→</div>
            <div class="zf" id="z3" style="flex:1;border:1px solid var(--b2);border-radius:10px;padding:10px 12px;transition:all .8s var(--ease)">
              <div class="lab">Endpoint Picker</div>
              <div style="display:flex;flex-direction:column;gap:6px;margin-top:8px">
                <div class="node" id="fcnode">flow control · queues, priority, fairness, the gate</div>
                <div class="node">scheduler · scores and picks the server</div>
              </div>
            </div>
          </div>
        </div>
        <div style="color:var(--txt3);align-self:center">→</div>
        <div class="node" style="align-self:center">vLLM<br>pods</div>
      </div>
    </div>
   </div>
  </div>`);},
 enter:p=>{const seq=[['#z1',0],['#z2',900],['#z3',1800]];
  seq.forEach(([sel,dt])=>setTimeout(()=>{const e=p.querySelector(sel);if(e)e.style.borderColor='var(--brand)';
    if(sel==='#z3')setTimeout(()=>{const f=p.querySelector('#fcnode');if(f)f.classList.add('hot');},700);},dt));},
 exit:p=>{p.querySelectorAll('.zf').forEach(e=>e.style.borderColor='var(--b2)');const f=p.querySelector('#fcnode');if(f)f.classList.remove('hot');}},

/* ---- PAGE 4 · FIND THE KNEE ---- */
{sub:'How',title:'Find the knee',point:'Sweep concurrency until the pool starts queueing. Below the knee, every request clears fast and flow control is invisible. Past it, the queue grows and the policy decides who waits.',
 provenance:'measured · 512 in / 128 out',
 build:p=>{vizHTML(p,`
  <svg viewBox="0 0 560 280" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <line x1="60" y1="240" x2="530" y2="240" stroke="var(--b2)"/>
    <text x="295" y="272" font-size="11" fill="var(--txt3)" text-anchor="middle">concurrency</text>
    <text x="14" y="20" font-size="11" fill="var(--txt3)" transform="rotate(-90 14 130)">p95 TTFT ms</text>
    ${[0,500,1000,1500,2000].map(v=>{const y=240-(v/2100)*200;
      return `<line x1="56" y1="${y}" x2="530" y2="${y}" stroke="var(--b1)"/>
      <text x="52" y="${y+4}" font-size="9" fill="var(--txt3)" text-anchor="end">${v}</text>`;}).join('')}
    <line id="p4knee" x1="0" y1="30" x2="0" y2="240" stroke="var(--danger)" stroke-dasharray="5 4" opacity="0"/>
    <text id="p4kneetxt" x="0" y="25" font-size="11" fill="var(--danger)" text-anchor="middle" opacity="0">the knee</text>
    <polyline id="p4line" fill="none" stroke-width="2.8" stroke-linejoin="round" stroke-linecap="round" points=""/>
    <g id="p4dots"></g>
    <text id="p4left" x="130" y="70" font-size="10.5" fill="var(--ok)" opacity="0">flow control is invisible here</text>
    <text id="p4right" x="400" y="70" font-size="10.5" fill="var(--danger)" text-anchor="middle" opacity="0">policy decides who waits</text>
  </svg>`);},
 enter:p=>{
  const data=[[32,261],[64,744],[96,948],[128,967],[160,1455],[200,1814]];
  const xScale=v=>60+(v-32)/(200-32)*470;
  const yScale=v=>240-(v/2100)*200;
  const kneeIdx=3;
  const line=p.querySelector('#p4line');
  const dotsG=p.querySelector('#p4dots');
  const kneeLine=p.querySelector('#p4knee');
  const kneeTxt=p.querySelector('#p4kneetxt');
  const leftTxt=p.querySelector('#p4left');
  const rightTxt=p.querySelector('#p4right');
  dotsG.innerHTML=data.map(([c,v],i)=>`<circle cx="${xScale(c)}" cy="${yScale(v)}" r="4.5" fill="${i<kneeIdx?'var(--ok)':i===kneeIdx?'var(--amber)':'var(--danger)'}" opacity="0"/>
    <text x="${xScale(c)}" y="${yScale(v)-10}" font-size="9" fill="var(--txt2)" text-anchor="middle" opacity="0">${v} ms</text>
    <text x="${xScale(c)}" y="254" font-size="9" fill="var(--txt3)" text-anchor="middle">${c}</text>`).join('');
  const circles=dotsG.querySelectorAll('circle');
  const labels=dotsG.querySelectorAll('text:not(:last-child)');
  const valLabels=Array.from(dotsG.querySelectorAll('text')).filter((_,i)=>i%2===0);
  let t0=performance.now(),drawn=false;
  animLoop(p,now=>{
    if(drawn)return;
    const elapsed=(now-t0)/1000;
    const totalDur=2.5;
    const prog=Math.min(1,elapsed/totalDur);
    let pts='';
    const revealCount=Math.min(data.length,Math.floor(prog*data.length*1.5)+1);
    for(let i=0;i<Math.min(revealCount,data.length);i++){
      const [c,v]=data[i];
      const x=xScale(c),y=yScale(v);
      pts+=(i===0?'':' ')+x+','+y;
      circles[i].setAttribute('opacity','1');
      valLabels[i].setAttribute('opacity','1');
      if(i<kneeIdx)line.setAttribute('stroke','var(--ok)');
      else if(i===kneeIdx)line.setAttribute('stroke','var(--amber)');
      else line.setAttribute('stroke','var(--danger)');
    }
    line.setAttribute('points',pts);
    if(prog>0.6){
      const kx=xScale(data[kneeIdx][0]);
      kneeLine.setAttribute('x1',kx);kneeLine.setAttribute('x2',kx);
      kneeLine.setAttribute('opacity','1');
      kneeTxt.setAttribute('x',kx);kneeTxt.setAttribute('opacity','1');
      leftTxt.setAttribute('opacity','1');
      rightTxt.setAttribute('opacity','1');
    }
    if(prog>=1)drawn=true;
  });},
 exit:p=>{}},

/* ---- PAGE 5 (was 4) · MOVE THE QUEUE UPSTREAM ---- */
{sub:'How',title:'Move the queue upstream',point:'Three layers absorb a burst. The engine limit protects token speed, a small buffer keeps it fed, and the excess waits where policy can act.',
 build:p=>{vizHTML(p,`
  <svg viewBox="0 0 900 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <rect x="560" y="70" width="150" height="160" rx="10" fill="none" stroke="var(--b2)"/>
    <text x="635" y="60" font-size="11" fill="var(--txt3)" text-anchor="middle">engine active batch, protects token speed</text>
    <rect x="470" y="100" width="60" height="100" rx="8" fill="none" stroke="var(--b2)"/>
    <text x="500" y="90" font-size="11" fill="var(--txt3)" text-anchor="middle">buffer</text>
    <rect x="120" y="100" width="300" height="100" rx="8" fill="none" stroke="var(--brand)"/>
    <text x="270" y="90" font-size="11" fill="var(--brand)" text-anchor="middle">burst queue, where policy lives</text>
    <g id="p5qdots"></g>

function scenarioSVG(id){return `
  <div style="display:flex;gap:22px;height:100%;align-items:center">
    <div style="flex:1.4"><svg id="${id}svg" viewBox="0 0 520 260" width="100%">
      <line x1="46" y1="220" x2="500" y2="220" stroke="var(--b2)"/>

    <div style="flex:1">
      <div class="lab" id="${id}btitle" style="margin-bottom:10px"></div>
      <div id="${id}bars"></div>
      <div style="font-size:12px;color:var(--txt2);margin-top:14px" id="${id}note"></div>
    </div>
  </div>`;}
function scenarioAnim(p,id,cfg){
  const g=p.querySelector('#'+id+'lines');g.innerHTML='';
  const win=p.querySelector('#'+id+'win');
  win.setAttribute('x',46+cfg.window[0]*454);win.setAttribute('width',(cfg.window[1]-cfg.window[0])*454);
  const els=cfg.lines.map(l=>{const pl=document.createElementNS('http://www.w3.org/2000/svg','polyline');
    pl.setAttribute('fill','none');pl.setAttribute('stroke',l.c);pl.setAttribute('stroke-width',2.4);
    pl.setAttribute('stroke-linejoin','round');g.appendChild(pl);return pl;});
  p.querySelector('#'+id+'leg').innerHTML=cfg.lines.map(l=>`<span><span class="dot" style="background:${l.c}"></span>${l.label}</span>`).join('');
  p.querySelector('#'+id+'btitle').textContent=cfg.barTitle;
  p.querySelector('#'+id+'bars').innerHTML=cfg.bars.map(([n,v,c])=>`
    <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
      <span class="lab" style="width:104px">${n}</span>
      <div style="flex:1;height:14px;border-radius:7px;background:var(--inset);overflow:hidden">
        <div class="scf" data-w="${v/cfg.barMax*100}" style="height:100%;width:0;border-radius:7px;background:${c};transition:width 1.4s var(--ease) .6s"></div></div>
      <span class="mono" style="font-size:11px;width:44px">${v}</span></div>`).join('');
  p.querySelector('#'+id+'note').textContent=cfg.note;
  requestAnimationFrame(()=>p.querySelectorAll('.scf').forEach(b=>b.style.width=b.dataset.w+'%'));
  let t0=performance.now();
  animLoop(p,now=>{const prog=Math.min(1,(now-t0)/3500);
    els.forEach((pl,i)=>{const l=cfg.lines[i];let d='';
      const n=Math.floor(90*prog);
      for(let k=0;k<=n;k++){const f=k/90;
        const inWin=f>cfg.window[0]&&f<cfg.window[1];
        const ramp=inWin?Math.min(1,(f-cfg.window[0])/0.08)*Math.min(1,(cfg.window[1]-f)/0.08):0;
        const v=l.base+(l.peak-l.base)*ramp+(cfg.jitter||8)*Math.sin(k*1.7+i*9)*(0.4+0.6*ramp);
        const y=220-(v/cfg.ymax)*185;
        d+=(46+f*454)+','+y+' ';}
      pl.setAttribute('points',d);});});}
/* counter + loop helpers */
function animCount(el,to,ms){let t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms);el.textContent=Math.round(to*(1-(1-k)**3));
    if(k<1&&el.isConnected)requestAnimationFrame(step);};requestAnimationFrame(step);}
const loops=new Map();
function animLoop(page,fn){let last=performance.now();
  const tick=now=>{if(!page.classList.contains('act')){loops.delete(page);return;}
    fn(now,now-last);last=now;loops.set(page,requestAnimationFrame(tick));};
  loops.set(page,requestAnimationFrame(tick));}

        <div class="seg" id="pgshape"><div data-s="0" class="on">short</div><div data-s="1">long generation</div></div></div>
      <div class="knob"><div class="kk">Flow control</div>
        <div class="seg" id="pgfc"><div data-f="1" class="on">on</div><div data-f="0">off</div></div></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;min-width:0">
      <div class="viz" style="flex:1;padding:14px 16px">
        <svg id="pgsvg" viewBox="0 0 640 250" width="100%" height="100%" preserveAspectRatio="xMidYMid meet"></svg>
      </div>
      <div class="counters" id="pgcnt"></div>
      <div class="narr" id="pgnarr"></div>
    </div>
  </div>`;
  const chips=p.querySelector('#pgchips');
  chips.innerHTML=PG.presets.map((pr,i)=>`<div class="chip" data-i="${i}">${pr[0]}</div>`).join('');
  chips.addEventListener('click',e=>{const c=e.target.closest('.chip');if(!c)return;
    chips.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');
    const [name,cfg,narr]=PG.presets[+c.dataset.i];
    PG.load={premium:cfg.premium,standard:cfg.standard,batch:cfg.batch};
    PG.mode=cfg.mode;PG.fc=cfg.fc;PG.shape=cfg.shape||0;PG.twin=!!cfg.twin;
    p.querySelectorAll('input[type=range]').forEach(r=>{r.value=PG.load[r.dataset.k];
      p.querySelector('#pgv_'+r.dataset.k).textContent=r.value;});
    p.querySelectorAll('#pgmode div').forEach(d=>d.classList.toggle('on',+d.dataset.m===PG.mode));
    p.querySelectorAll('#pgshape div').forEach(d=>d.classList.toggle('on',+d.dataset.s===PG.shape));
    p.querySelectorAll('#pgfc div').forEach(d=>d.classList.toggle('on',(+d.dataset.f===1)===PG.fc));
    p.querySelector('#pgnarr').textContent=narr;});
  p.addEventListener('input',e=>{if(e.target.dataset.k){PG.load[e.target.dataset.k]=+e.target.value;
    p.querySelector('#pgv_'+e.target.dataset.k).textContent=e.target.value;PG.twin=false;}});
  p.querySelector('#pgmode').addEventListener('click',e=>{if(e.target.dataset.m){PG.mode=+e.target.dataset.m;
    e.currentTarget.querySelectorAll('div').forEach(d=>d.classList.toggle('on',d===e.target));}});
  p.querySelector('#pgshape').addEventListener('click',e=>{if(e.target.dataset.s){PG.shape=+e.target.dataset.s;
    e.currentTarget.querySelectorAll('div').forEach(d=>d.classList.toggle('on',d===e.target));}});
  p.querySelector('#pgfc').addEventListener('click',e=>{if(e.target.dataset.f!==undefined){PG.fc=e.target.dataset.f==='1';
    e.currentTarget.querySelectorAll('div').forEach(d=>d.classList.toggle('on',d===e.target));}});
  /* sim loop */
  const svg=p.querySelector('#pgsvg'),cnt=p.querySelector('#pgcnt');
  const hist={premium:[],standard:[],batch:[]};
  animLoop(p,(now)=>{
    /* tiny analytic model, illustrative only */
    const cap=PG.shape?40:128;
    const L=PG.load, total=L.premium+L.standard+L.batch;
    const running=Math.min(total,cap);
    const excess=Math.max(0,total-cap*(PG.mode===1?0.85:1.0));
    const base=PG.shape?120:45;
    const batchPenalty= (running/cap)*(PG.shape?900:320);
    let t={},q={premium:0,standard:0,batch:0},shed=0,ttl=0;
    if(!PG.fc){
      const share=excess>0? excess/Math.max(1,total):0;
      ['premium','standard','batch'].forEach(k=>{t[k]=base+batchPenalty+share*1400*(L[k]?1:0);q[k]=0;});
      if(excess>0&&L.batch){shed=Math.round(L.batch*0.8);}
    } else {
      /* excess assigned bottom band up */
      let rem=excess;
      ['batch','standard','premium'].forEach(k=>{const take=Math.min(rem, L[k]); q[k]= L[k]? (take/Math.max(1,L[k]))*(PG.mode===1?520:260):0; rem-=take;});
      ['premium','standard','batch'].forEach(k=>{t[k]= L[k]? base+ (PG.mode===1&&excess>0? (k==='premium'?0.25:1)*batchPenalty*0.5 : batchPenalty) + q[k] :0;});
      if(L.batch>70){shed=Math.round((L.batch-70)*1.8);}
      if(excess>40){ttl=Math.round((excess-40)*0.7);}
    }
    ['premium','standard','batch'].forEach(k=>{const h=hist[k];h.push(L[k]?t[k]:null);if(h.length>120)h.shift();});
    /* draw */
    let s='<line x1="40" y1="210" x2="620" y2="210" stroke="var(--b2)"/>';
    [[0,'0'],[400,'400'],[800,'800 ms']].forEach(([v,lb])=>{const y=210-v/900*180;
      s+=`<line x1="40" y1="${y}" x2="620" y2="${y}" stroke="var(--b1)"/><text x="36" y="${y+3}" font-size="9" fill="var(--txt3)" text-anchor="end">${lb}</text>`;});
    ['premium','standard','batch'].forEach(k=>{const h=hist[k];let d='';
      h.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+(40+i/119*580)+' '+(210-Math.min(880,v)/900*180)+' ';});
      if(d)s+=`<path d="${d}" fill="none" stroke="${COLORS[k]}" stroke-width="2.2" stroke-linejoin="round"/>`;});
    s+='<text x="40" y="18" font-size="10" fill="var(--txt3)">time to first token, rolling</text>';
    svg.innerHTML=s;
    const thr=Math.round(Math.min(total,cap)*(PG.shape?0.9:2.4)*(PG.fc&&PG.mode===1?0.82:1));
    cnt.innerHTML=['premium','standard','batch'].map(k=>L[k]?`<div class="counter"><span class="dot" style="background:${COLORS[k]}"></span>${k} ${Math.round(t[k])} ms · q ${Math.round(q[k])}</div>`:'').join('')
      +`<div class="counter">${thr} req/s</div><div class="counter" style="${shed||ttl?'color:var(--danger)':''}">429 ${shed} · 503 ${ttl}</div>`;
  });
  chips.querySelector('.chip').click();
}

/* ---------- shell: nav, autoplay, timeline, mode ---------- */
let cur=0,auto=true,autoT0=performance.now();
const stage=$('#stage');
PAGES.forEach((d,i)=>{const el=document.createElement('div');el.className='page';el.id='pg'+i;stage.appendChild(el);});
function buildTimeline(){
  const tl=$('#timeline');tl.innerHTML='';
  ACTS.forEach((a,i)=>{
    const done=a.pages[a.pages.length-1]<cur, act=a.pages.includes(cur)|| (cur===0&&i===0);
    const s=document.createElement('div');s.className='stop'+(done?' done':'')+(act&&cur>0?' act':'');
    s.innerHTML=`<span class="n">${done?'✓':i+1}${act&&cur>0&&auto?`<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--brand)" stroke-width="2" stroke-dasharray="72.2" stroke-dashoffset="${72.2*(1-autoProg())}" transform="rotate(-90 13 13)"/></svg>`:''}</span>${a.name}`;
    s.onclick=()=>go(a.pages[0]);
    tl.appendChild(s);
    if(i<ACTS.length-1){const l=document.createElement('div');l.className='tl-line';tl.appendChild(l);}
  });
}
function autoProg(){return Math.min(1,(performance.now()-autoT0)/20000);}
function go(n){
  n=Math.max(0,Math.min(PAGES.length-1,n));
  const old=$('#pg'+cur);
  if(PAGES[cur].exit)PAGES[cur].exit(old);
  old.classList.remove('act');
  cur=n;autoT0=performance.now();
  location.hash='page-'+n;
  const el=$('#pg'+n);
  PAGES[n].build(el);
  el.classList.add('act');
  if(PAGES[n].enter)PAGES[n].enter(el);
  $('#subtitle').textContent=PAGES[n].title||'';
  $('#pgno').textContent=(n+1)+' / '+PAGES.length;
  $('#prevBtn').disabled=n===0;
  $('#nextBtn').disabled=n===PAGES.length-1;
  buildTimeline();
}
$('#prevBtn').onclick=()=>go(cur-1);
$('#nextBtn').onclick=()=>go(cur+1);
$('#skipBtn').onclick=()=>go(PAGES.length-1);
$('#autoBtn').onclick=()=>{auto=!auto;autoT0=performance.now();
  $('#autoBtn').classList.toggle('on',auto);$('#autoBtn').textContent=auto?'▶ auto · 20s':'⏸ auto off';};
$('#modeBtn').onclick=()=>{const l=document.documentElement.dataset.mode==='light';
  document.documentElement.dataset.mode=l?'':'light';
  $('#modeBtn').textContent=l?'☾ dark':'☀ light';};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
setInterval(()=>{if(auto&&cur<PAGES.length-1&&autoProg()>=1)go(cur+1);else if(auto)buildTimeline();},500);
window.addEventListener('hashchange',()=>{const m=location.hash.match(/page-(\d+)/);const n=m?+m[1]:0;if(n!==cur)go(n);});
const h=location.hash.match(/page-(\d+)/);
go(h?+h[1]:0);
</script>
