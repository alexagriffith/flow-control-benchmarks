<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>llm-d flow control explainer</title>
<style>
/* ============ INFERRA TOKENS ============ */
:root{
  --canvas:#08090B;--base:#0e1014;--raised:#14171d;--inset:#05060a;
  --b1:rgba(255,255,255,.06);--b2:rgba(255,255,255,.10);--b3:rgba(255,255,255,.16);
  --txt:#e8eaf0;--txt2:#9aa0ad;--txt3:#5f6673;
  --brand:#5B6CF0;--brand-soft:rgba(91,108,240,.12);
  --teal:#159a9a;--amber:#c98500;--danger:#e5534b;--ok:#3fa66a;
  --ease:cubic-bezier(0.16,1,0.3,1);
}
html[data-mode="light"]{
  --canvas:#f7f8fa;--base:#ffffff;--raised:#f1f2f6;--inset:#e9eaef;
  --b1:rgba(10,12,20,.08);--b2:rgba(10,12,20,.13);--b3:rgba(10,12,20,.22);
  --txt:#14161c;--txt2:#4c5260;--txt3:#8a8f9c;
  --brand:#4353d8;--brand-soft:rgba(67,83,216,.10);
  --teal:#0e7f7f;--amber:#9a6a00;--danger:#c43d36;--ok:#2b8653;
}
*{box-sizing:border-box}
body{margin:0;background:var(--canvas);color:var(--txt);font-size:14px;
  font-family:Inter,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;transition:background .3s,color .3s}
.mono{font-family:"Geist Mono",ui-monospace,Menlo,monospace}
#app{max-width:1120px;margin:0 auto;padding:18px 20px 30px;display:flex;flex-direction:column;min-height:100vh}
/* header */
header{display:flex;justify-content:space-between;align-items:center;padding:6px 2px 14px;border-bottom:1px solid var(--b1)}
header .t{font-size:15px;font-weight:600}
header .t span{font-weight:400;color:var(--txt3);font-size:12.5px;margin-left:10px}
.ctl{display:flex;gap:8px}
.pill{border:1px solid var(--b2);border-radius:999px;background:var(--base);color:var(--txt2);
  font-size:11.5px;padding:5px 12px;cursor:pointer;transition:all .18s var(--ease)}
.pill:hover{border-color:var(--b3);color:var(--txt)}
.pill.on{border-color:var(--brand);color:var(--txt);background:var(--brand-soft)}
/* timeline */
#timeline{display:flex;align-items:center;padding:13px 2px;border-bottom:1px solid var(--b1)}
.stop{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--txt3);cursor:pointer;white-space:nowrap}
.stop .n{width:20px;height:20px;border-radius:99px;border:1px solid var(--b2);display:grid;place-items:center;font-size:10px;position:relative}
.stop.done .n{background:var(--brand);border-color:var(--brand);color:#fff}
.stop.act{color:var(--txt)}
.stop.act .n{border-color:var(--brand);color:var(--brand)}
.stop.act .n svg{position:absolute;inset:-3px}
.tl-line{flex:1;height:1px;background:var(--b1);margin:0 9px}
/* stage */
#stage{flex:1;position:relative;min-height:430px}
.page{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);display:flex;flex-direction:column;padding-top:22px}
.page.act{opacity:1;pointer-events:auto}
.eyebrow{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
h2{font-size:26px;font-weight:650;letter-spacing:-.02em;margin:0 0 6px;line-height:1.1}
.point{font-size:13.5px;color:var(--txt2);margin:0 0 18px;max-width:640px}
.viz{flex:0 1 auto;background:var(--base);border:1px solid var(--b1);border-radius:12px;padding:22px;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:center;min-height:340px;max-height:520px}
.footnote{font-size:11px;color:var(--txt3);margin-top:10px}
.provenance{position:absolute;top:14px;right:16px;font-size:10px;letter-spacing:.05em;text-transform:uppercase;color:var(--txt3);border:1px solid var(--b1);border-radius:999px;padding:3px 9px}
/* nav */
#nav{display:flex;justify-content:space-between;align-items:center;padding-top:14px}
.navbtn{border:1px solid var(--b2);border-radius:8px;background:var(--base);color:var(--txt);font-size:12.5px;padding:7px 16px;cursor:pointer;transition:all .18s var(--ease)}
.navbtn:hover{border-color:var(--brand)}
.navbtn[disabled]{opacity:.35;cursor:default}
#pgno{font-size:11px;color:var(--txt3)}
/* shared viz pieces */
.node{background:var(--raised);border:1px solid var(--b2);border-radius:8px;padding:9px 13px;font-size:12px;text-align:center;transition:all .3s var(--ease)}
.node.hot{border-color:var(--brand);box-shadow:0 0 16px var(--brand-soft)}
.dot{width:8px;height:8px;border-radius:99px;display:inline-block;margin-right:6px;vertical-align:-1px}
.lab{font-size:10.5px;color:var(--txt3)}
.legend{display:flex;gap:16px;margin-top:12px;font-size:11px;color:var(--txt2)}
svg text{font-family:Inter,-apple-system,"Segoe UI",sans-serif}
svg .mono-t{font-family:"Geist Mono",ui-monospace,monospace}
/* playground */
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:12px}
.chip{border:1px solid var(--b2);border-radius:8px;background:var(--raised);font-size:11px;color:var(--txt2);padding:6px 6px;text-align:center;cursor:pointer;transition:all .18s var(--ease)}
.chip:hover{border-color:var(--b3);color:var(--txt)}
.chip.on{border-color:var(--brand);color:var(--txt);background:var(--brand-soft)}
.pg-grid{display:flex;gap:12px;flex:1;min-height:0}
.knobs{flex:0 0 200px;display:flex;flex-direction:column;gap:8px}
.knob{background:var(--raised);border:1px solid var(--b1);border-radius:8px;padding:9px 11px}
.kk{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3);margin-bottom:6px}
.krow{display:flex;align-items:center;gap:7px;font-size:11px;margin-bottom:6px}
.krow input[type=range]{flex:1;accent-color:var(--brand);height:3px}
.krow .val{width:24px;text-align:right}
.seg{display:flex;border:1px solid var(--b2);border-radius:8px;overflow:hidden;font-size:11px}
.seg div{flex:1;text-align:center;padding:5px 4px;cursor:pointer;color:var(--txt2)}
.seg div.on{background:var(--brand-soft);color:var(--txt)}
.counters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.counter{font-family:"Geist Mono",ui-monospace,monospace;font-size:11px;background:var(--inset);border:1px solid var(--b1);border-radius:8px;padding:6px 9px;color:var(--txt2)}
.narr{font-size:12px;color:var(--txt2);margin-top:10px;min-height:32px}
@media (max-width:840px){.chips{grid-template-columns:repeat(2,1fr)}.pg-grid{flex-direction:column}.knobs{flex:none}}
</style>
</head>
<body>
<div id="app">
<header>
  <div class="t">llm-d flow control explainer<span id="subtitle"></span></div>
  <div class="ctl">
    <button class="pill on" id="autoBtn">❚❚ pause</button>
    <button class="pill" id="modeBtn">☾ dark</button>
    <button class="pill" id="skipBtn">Skip to playground</button>
  </div>
</header>
<div id="timeline"></div>
<div id="stage"></div>
<div id="nav">
  <button class="navbtn" id="prevBtn">← Back</button>
  <span id="pgno" class="mono"></span>
  <button class="navbtn" id="nextBtn">Next →</button>
</div>
</div>

<script>
/* =====================================================================
   llm-d flow control explainer · single file
   Edit any page's text in PAGES below. Charts and animations draw from
   the same definitions. No build step.
   ===================================================================== */
const $=s=>document.querySelector(s);
const COLORS={premium:'var(--brand)',standard:'var(--amber)',batch:'var(--teal)'};

/* ---------- page definitions: title, point line, viz builder ---------- */
const ACTS=[
  {name:'Why',pages:[1,2]},
  {name:'Where',pages:[3]},
  {name:'How',pages:[4,5,6,7,8,9]},
  {name:'Proof',pages:[10,11,12,13]},
  {name:'The trade',pages:[14]},
  {name:'Play',pages:[15]},
];

const PAGES=[
/* ---- PAGE 0 · TITLE ---- */
{sub:'',dwell:2800,build:p=>{p.innerHTML=`
  <div style="flex:1;display:grid;place-items:center;text-align:center">
    <div>
      <div style="font-size:clamp(30px,5vw,44px);font-weight:650;letter-spacing:-.03em;line-height:1.1">
        Flow control makes shared<br>inference predictable.</div>
      <p class="point" style="margin:16px auto 22px">Six stops, playing now. Pause or jump any time.</p>
      <button class="navbtn" style="border-color:var(--brand);background:var(--brand-soft)" onclick="go(1)">Skip the intro</button>
    </div>
  </div>`;}},

/* ---- PAGE 1 · THE COST PROBLEM ---- */
{sub:'Why',title:'The cost problem',point:'Give every tenant its own GPU and each one hits a hard 128-slot ceiling on its own. Traffic arrives in bursts, so the silicon you paid for sits mostly idle between them.',
 provenance:'illustrative',dwell:9000,
 build:p=>{vizHTML(p,`
  <svg viewBox="0 0 900 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <!-- tenants / traffic on the left -->
    <text x="120" y="34" font-size="11" fill="var(--txt3)" text-anchor="middle">tenants, each with its own traffic</text>
    <g id="p1srcs"></g>
    <!-- three dedicated GPU racks on the right -->
    <text x="640" y="34" font-size="11" fill="var(--txt3)" text-anchor="middle">one dedicated GPU per tenant · 128-slot ceiling each</text>
    <g id="p1racks"></g>
    <text x="450" y="332" font-size="12" class="mono-t" fill="var(--danger)" text-anchor="middle" id="p1foot">paid for 3 × 128 slots · ~30% average fill</text>
  </svg>`);
  const svg=p.querySelector('svg');
  const rows=[['Tenant A','premium','var(--brand)',66],['Tenant B','standard','var(--amber)',80],['Tenant C','batch','var(--teal)',188]];
  const srcs=p.querySelector('#p1srcs');
  srcs.innerHTML=rows.map(([n,,c],i)=>{const y=66+i*82;
    return `<rect x="40" y="${y}" width="160" height="52" rx="9" fill="var(--raised)" stroke="${c}"/>
      <text x="120" y="${y+22}" font-size="12" fill="var(--txt)" text-anchor="middle">${n}</text>
      <text x="120" y="${y+40}" font-size="10" fill="var(--txt3)" text-anchor="middle" class="mono-t">bursty arrivals</text>
      <line x1="200" y1="${y+26}" x2="470" y2="${y+26}" stroke="${c}" stroke-width="1.5" opacity=".5" marker-end="url(#p1arr)"/>`;}).join('')
    +`<defs><marker id="p1arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--b3)"/></marker></defs>`;
  const racks=p.querySelector('#p1racks');
  racks.innerHTML=rows.map(([n,,c],i)=>{const y=66+i*82,x=490;
    return `<rect x="${x}" y="${y}" width="360" height="52" rx="9" fill="var(--inset)" stroke="var(--b2)"/>
      <text x="${x+14}" y="${y+20}" font-size="10.5" class="mono-t" fill="var(--txt3)">GPU · 128 slots</text>
      <g id="p1slots${i}"></g>
      <text x="${x+346}" y="${y+20}" font-size="11" class="mono-t" fill="${c}" text-anchor="end" id="p1pct${i}">0%</text>`;}).join('');},
 enter:p=>{
  const cfg=[['var(--brand)',1.0,0],['var(--amber)',0.6,1.2],['var(--teal)',1.8,0.7]];
  const cols=18,x=490;
  cfg.forEach((_,i)=>{const g=p.querySelector('#p1slots'+i);const y=66+i*82;let s='';
    for(let k=0;k<cols;k++){s+=`<rect x="${x+16+k*18.6}" y="${y+28}" width="14" height="16" rx="2" fill="var(--base)" stroke="var(--b1)" class="p1slot"/>`;}
    g.innerHTML=s;});
  const slotSets=cfg.map((_,i)=>p.querySelector('#p1slots'+i).querySelectorAll('.p1slot'));
  const pcts=cfg.map((_,i)=>p.querySelector('#p1pct'+i));
  const foot=p.querySelector('#p1foot');
  let t0=performance.now();
  animLoop(p,now=>{const t=(now-t0)/1000;
    const vals=cfg.map(([c,freq,phase],i)=>{
      const burst=Math.max(0,Math.sin(t*freq+phase))**3;
      const util=6+burst*88;
      const lit=Math.round(util/100*cols);
      slotSets[i].forEach((r,k)=>{r.setAttribute('fill',k<lit?c:'var(--base)');r.setAttribute('opacity',k<lit?'.85':'1');});
      pcts[i].textContent=Math.round(util)+'%';
      return util;});
    foot.textContent='paid for 3 × 128 slots · ~'+Math.round(vals.reduce((a,b)=>a+b,0)/3)+'% average fill';});}},

/* ---- PAGE 2 · THE BURST PROBLEM ---- */
{sub:'Why',title:'The burst problem',point:'Large language model traffic arrives in bursts, so capping at the average wastes throughput while letting bursts through breaks your service levels. Flow control moves the waiting to where policy can see it, so you decide who absorbs the burst instead of arrival order.',
 build:p=>{vizHTML(p,`
  <div style="display:flex;height:100%;gap:14px;align-items:stretch">
    <div style="flex:1.5;min-width:0">
      <svg viewBox="0 0 640 300" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
        <text x="20" y="20" font-size="11" fill="var(--txt3)">arrival rate over time</text>
        <line x1="40" y1="250" x2="620" y2="250" stroke="var(--b2)"/>
        <line x1="40" y1="130" x2="620" y2="130" stroke="var(--danger)" stroke-width="1.5" stroke-dasharray="5 5" opacity=".8"/>
        <text x="615" y="122" font-size="11" fill="var(--danger)" text-anchor="end">capacity</text>
        <path id="burstfill" fill="var(--danger)" opacity=".18" stroke="none"/>
        <path id="burstwave" fill="none" stroke="var(--brand)" stroke-width="2.5"/>
        <circle id="p2spike" r="0" fill="var(--danger)" opacity="0"/>
        <text id="p2spiketxt" font-size="10" fill="var(--danger)" text-anchor="middle" opacity="0">burst</text>
        <text x="40" y="285" font-size="11" fill="var(--txt3)">time</text>
        <text id="p2msg" x="330" y="52" font-size="12.5" fill="var(--txt2)" text-anchor="middle"></text>
      </svg>
    </div>
    <div style="flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:12px">
      <div class="lab">the pool during a burst</div>
      <svg viewBox="0 0 300 210" width="100%" preserveAspectRatio="xMidYMid meet">
        <rect x="20" y="20" width="260" height="120" rx="10" fill="var(--inset)" stroke="var(--b2)"/>
        <text x="30" y="16" font-size="10" fill="var(--txt3)">128 slots</text>
        <g id="p2slots"></g>
        <text x="150" y="168" font-size="11" fill="var(--danger)" text-anchor="middle" id="p2stuck" opacity="0">arrivals past capacity get stuck</text>
        <g id="p2queue"></g>
      </svg>
    </div>
  </div>`);},
 enter:p=>{const w=p.querySelector('#burstwave'),f=p.querySelector('#burstfill'),m=p.querySelector('#p2msg');
  const spike=p.querySelector('#p2spike'),spiketxt=p.querySelector('#p2spiketxt');
  const stuck=p.querySelector('#p2stuck');
  // slot grid, 8 x 4 = 32 representing the 128-slot pool
  const cols=16,rows=4,sg=p.querySelector('#p2slots');let ss='';
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    ss+=`<rect x="${28+c*15.5}" y="${30+r*26}" width="11" height="20" rx="2" fill="var(--base)" stroke="var(--b1)" class="p2slot"/>`;}
  sg.innerHTML=ss;
  const slots=sg.querySelectorAll('.p2slot');
  // stuck queue dots below the pool
  const qg=p.querySelector('#p2queue');let qs='';
  for(let i=0;i<10;i++)qs+=`<circle cx="${44+i*24}" cy="192" r="5" fill="var(--danger)" opacity="0" class="p2q"/>`;
  qg.innerHTML=qs;
  const qdots=qg.querySelectorAll('.p2q');
  const wave=x=>{const tt=x;return 250-60-42*Math.max(0,Math.sin(tt))**3*2 - 12*Math.sin(tt*2.7);};
  let t0=performance.now();
  animLoop(p,now=>{const t=(now-t0)/1000;
    let d='';
    for(let x=0;x<=580;x+=8){const y=wave(t*1.1+x/60);d+=(x?'L':'M')+(40+x)+' '+y+' ';}
    w.setAttribute('d',d);
    let fa='';
    for(let x=0;x<=580;x+=8){const y=wave(t*1.1+x/60);fa+=(x?'L':'M')+(40+x)+' '+Math.min(y,130)+' ';}
    for(let x=580;x>=0;x-=8){fa+='L'+(40+x)+' 130 ';}
    f.setAttribute('d',fa+'Z');
    // arrival spike marker riding the crest of the current wave near the right edge
    const yNow=wave(t*1.1+560/60);const above=yNow<130;
    spike.setAttribute('cx',600);spike.setAttribute('cy',yNow);
    spike.setAttribute('r',above?6:0);spike.setAttribute('opacity',above?1:0);
    spiketxt.setAttribute('x',600);spiketxt.setAttribute('y',yNow-12);spiketxt.setAttribute('opacity',above?1:0);
    // pool fill tracks how far the current arrival level sits above capacity
    const level=Math.max(0,(130-yNow)/70);           // 0 at cap, ~1 well above
    const demand=Math.round((cols*rows)*(0.35+level*1.2));
    slots.forEach((s,i)=>{const on=i<Math.min(cols*rows,demand);
      s.setAttribute('fill',on?'var(--brand)':'var(--base)');s.setAttribute('opacity',on?'.85':'1');});
    const overflow=Math.max(0,demand-cols*rows);
    stuck.setAttribute('opacity',overflow>0?1:0);
    qdots.forEach((c,i)=>c.setAttribute('opacity',i<Math.min(qdots.length,overflow)?1:0));
    m.textContent = above?'this burst is above capacity, and arrival order decides who is stuck':'below the line the pool clears, the peaks are what break';
  });}},

/* ---- PAGE 3 · WHERE YOU ARE ---- */
{sub:'Where',title:'Where you are',point:'A request hits the inference gateway, an Envoy proxy, which calls the Endpoint Picker over the ext_proc gRPC protocol and waits for a decision. Flow control is that decision, and it ends where the picked vLLM replica begins.',
 provenance:'ext_proc · gRPC',dwell:13000,
 build:p=>{vizHTML(p,`
  <svg viewBox="0 0 900 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
    <defs><marker id="p3arr" markerWidth="9" markerHeight="9" refX="5" refY="4.5" orient="auto"><path d="M0 0 L9 4.5 L0 9 z" fill="var(--b3)"/></marker></defs>
    <!-- client -->
    <g id="z1"><rect x="24" y="140" width="96" height="56" rx="9" fill="var(--raised)" stroke="var(--b2)"/>
    <text x="72" y="172" font-size="12" fill="var(--txt)" text-anchor="middle">client</text></g>
    <line id="p3a1" class="p3arrow" x1="120" y1="168" x2="164" y2="168" stroke="var(--b3)" stroke-width="1.5" marker-end="url(#p3arr)"/>
    <!-- gateway (Envoy) -->
    <g id="z2"><rect x="164" y="130" width="150" height="76" rx="10" fill="var(--raised)" stroke="var(--b2)"/>
    <text x="239" y="160" font-size="13" fill="var(--txt)" text-anchor="middle">inference gateway</text>
    <text x="239" y="180" font-size="11" fill="var(--txt3)" text-anchor="middle">Envoy proxy</text>
    <text x="239" y="196" font-size="10" class="mono-t" fill="var(--txt3)" text-anchor="middle">ext_proc client</text></g>
    <!-- ext_proc gRPC call out and decision back -->
    <line id="p3a2" class="p3arrow" x1="314" y1="156" x2="404" y2="156" stroke="var(--b3)" stroke-width="1.5" marker-end="url(#p3arr)"/>
    <text x="359" y="146" font-size="10" class="mono-t" fill="var(--brand)" text-anchor="middle">ext_proc gRPC</text>
    <line id="p3a3" class="p3arrow" x1="404" y1="182" x2="314" y2="182" stroke="var(--b3)" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#p3arr)"/>
    <text x="359" y="200" font-size="10" fill="var(--txt3)" text-anchor="middle">decision</text>
    <!-- Endpoint Picker with the flow-control box inside -->
    <rect x="404" y="42" width="330" height="256" rx="12" fill="var(--base)" stroke="var(--b2)"/>
    <text x="418" y="62" font-size="11" fill="var(--txt3)">Endpoint Picker (EPP)</text>
    <rect id="fcnode" x="420" y="74" width="298" height="208" rx="10" fill="var(--brand-soft)" stroke="var(--brand)"/>
    <text x="434" y="94" font-size="11" fill="var(--brand)">flow control · the decision logic</text>
    <g font-size="11" class="mono-t" fill="var(--txt)">
      <rect class="p3step" x="436" y="106" width="266" height="34" rx="7" fill="var(--inset)" stroke="var(--b1)"/><text x="448" y="127">1 · classify: objective header → priority</text>
      <rect class="p3step" x="436" y="146" width="266" height="34" rx="7" fill="var(--inset)" stroke="var(--b1)"/><text x="448" y="167">2 · queue by band, premium first</text>
      <rect class="p3step" x="436" y="186" width="266" height="34" rx="7" fill="var(--inset)" stroke="var(--b1)"/><text x="448" y="207">3 · saturation gate: hold or release</text>
      <rect class="p3step" x="436" y="226" width="266" height="34" rx="7" fill="var(--inset)" stroke="var(--b1)"/><text x="448" y="247">4 · pick the endpoint</text>
    </g>
    <!-- forward to vLLM replica -->
    <line id="p3a4" class="p3arrow" x1="734" y1="168" x2="792" y2="168" stroke="var(--b3)" stroke-width="1.5" marker-end="url(#p3arr)"/>
    <text x="763" y="158" font-size="9" fill="var(--txt3)" text-anchor="middle">gateway forwards</text>
    <g id="z3"><rect x="792" y="130" width="84" height="76" rx="10" fill="var(--raised)" stroke="var(--b2)"/>
    <text x="834" y="162" font-size="12" fill="var(--txt)" text-anchor="middle">vLLM</text>
    <text x="834" y="180" font-size="11" fill="var(--txt3)" text-anchor="middle">replica</text></g>
    <text x="834" y="286" font-size="10" fill="var(--txt3)" text-anchor="middle">outside flow control</text>
    <circle id="p3dot" r="5.5" fill="var(--brand)" stroke="var(--base)" stroke-width="1.5" opacity="0"/>
  </svg>`);},
 enter:p=>{

    [2300,()=>steps[0]&&steps[0].setAttribute('stroke','var(--brand)')],
    [3000,()=>steps[1]&&steps[1].setAttribute('stroke','var(--brand)')],
    [3700,()=>steps[2]&&steps[2].setAttribute('stroke','var(--brand)')],
    [4400,()=>steps[3]&&steps[3].setAttribute('stroke','var(--brand)')],
    [5100,()=>lightArrow('#p3a3')],
    [5800,()=>{lightArrow('#p3a4');lightBox('#z3');}],
  ];
  seq.forEach(([dt,fn])=>setTimeout(fn,dt));
  /* a request dot loops the full path continuously so motion never stalls */
  const dot=p.querySelector('#p3dot');
  const wp=[[72,168],[239,168],[359,156],[569,123],[569,163],[569,203],[569,243],[734,168],[834,168]];
  const segDur=520,total=segDur*(wp.length-1)+700;
  const T0=performance.now();

    const e=k<.5?2*k*k:1-((-2*k+2)**2)/2;
    const a=wp[si],b=wp[si+1];
    dot.setAttribute('cx',a[0]+(b[0]-a[0])*e);
    dot.setAttribute('cy',a[1]+(b[1]-a[1])*e);

 enter:p=>{
  const data=[[32,261],[64,744],[96,948],[128,967],[160,1455],[200,1814]];

  const kneeLine=p.querySelector('#p4knee');

  dotsG.innerHTML=data.map(([c,v],i)=>`<circle cx="${xScale(c)}" cy="${yScale(v)}" r="4.5" fill="${i<kneeIdx?'var(--ok)':i===kneeIdx?'var(--amber)':'var(--danger)'}" opacity="0"/>

  const circles=dotsG.querySelectorAll('circle');
  const labels=dotsG.querySelectorAll('text:not(:last-child)');
  const valLabels=Array.from(dotsG.querySelectorAll('text')).filter((_,i)=>i%2===0);
  let t0=performance.now(),drawn=false;
  animLoop(p,now=>{
    if(drawn){/* gentle pulse on the knee point keeps the slide alive, no path churn */
      const k=circles[kneeIdx];if(k)k.setAttribute('r',(4.5+1.3*Math.abs(Math.sin(now/500))).toFixed(2));
      return;}
    const elapsed=(now-t0)/1000;
    const totalDur=2.5;
    const prog=Math.min(1,elapsed/totalDur);
    let pts='';
    const revealCount=Math.min(data.length,Math.floor(prog*data.length*1.5)+1);
    for(let i=0;i<Math.min(revealCount,data.length);i++){
      const [c,v]=data[i];
      const x=xScale(c),y=yScale(v);
      pts+=(i===0?'':' ')+x+','+y;
      circles[i].setAttribute('opacity','1');
      valLabels[i].setAttribute('opacity','1');
      if(i<kneeIdx)line.setAttribute('stroke','var(--ok)');
      else if(i===kneeIdx)line.setAttribute('stroke','var(--amber)');
      else line.setAttribute('stroke','var(--danger)');
    }
    line.setAttribute('points',pts);
    if(prog>0.6){
      const kx=xScale(data[kneeIdx][0]);
      kneeLine.setAttribute('x1',kx);kneeLine.setAttribute('x2',kx);
      kneeLine.setAttribute('opacity','1');
      kneeTxt.setAttribute('x',kx);kneeTxt.setAttribute('opacity','1');
      leftTxt.setAttribute('opacity','1');
      rightTxt.setAttribute('opacity','1');
    }
    if(prog>=1)drawn=true;
  });
  /* second chart: throughput flattens while latency + queue climb past the knee */
  const good=p.querySelector('#p4good'),lat=p.querySelector('#p4lat'),queue=p.querySelector('#p4queue');
  const bkx=xScale(128);
  const bkneeT=p.querySelector('#p4bknee'),bkneeL=p.querySelector('#p4bkneel');
  const glab=p.querySelector('#p4gl'),llab=p.querySelector('#p4ll');
  // throughput rises to the knee then plateaus; latency+queue rises then accelerates
  const gAt=c=>{const k=128;return c<=k? (c/k) : 1+ (c-k)/400*0.04;};   // ~flat past knee
  const lAt=c=>{const k=128;return c<=k? 0.12+ (c/k)*0.22 : 0.34 + ((c-k)/72)**1.35*0.55;};
  const yb=f=>Math.round((220-Math.min(1,f)*185)*10)/10;
  const bwrap=p.querySelector('#p4bwrap');
  // chart 2 waits for chart 1 to land, then fades in before it animates
  let t1=performance.now(),drawn2=false,revealed=false;

  animLoop(p,now=>{if(drawn2)return;

    const prog=Math.min(1,(now-t1-revealDelay-500)/2600);if(prog<=0)return;
    const cmax=32+prog*168;let dg='',dl='';
    for(let c=32;c<=cmax;c+=6){const x=xScale(c);
      dg+=(dg?'L':'M')+x+' '+yb(gAt(c))+' ';
      dl+=(dl?'L':'M')+x+' '+yb(lAt(c))+' ';}
    good.setAttribute('d',dg);lat.setAttribute('d',dl);
    if(prog>0.45){bkneeL.setAttribute('x1',bkx);bkneeL.setAttribute('x2',bkx);bkneeL.setAttribute('opacity','1');
      bkneeT.setAttribute('x',bkx);bkneeT.setAttribute('opacity','1');
      glab.setAttribute('opacity','1');llab.setAttribute('opacity','1');}
    if(prog>=1){drawn2=true;
      // queue area = gap between latency and throughput past the knee.
      // Built ONCE after the lines land, then faded in — never rebuilt per frame.
      let dq='';
      for(let c=128;c<=200;c+=6){const x=xScale(c);dq+=(dq?'L':'M')+x+' '+yb(lAt(c))+' ';}
      for(let c=200;c>=128;c-=6){const x=xScale(c);dq+='L'+x+' '+yb(gAt(c))+' ';}
      queue.setAttribute('d',dq+'Z');
      requestAnimationFrame(()=>queue.style.opacity='.14');}
  });},

 enter:p=>{const g=p.querySelector('#p5qdots');const dots=[];
  for(let i=0;i<26;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r',5);c.setAttribute('fill',i%5==0?'var(--amber)':(i%7==0?'var(--teal)':'var(--brand)'));
    g.appendChild(c);dots.push({el:c,t:-i*0.55});}
  animLoop(p,(now,dt)=>{dots.forEach(d=>{d.t+=dt/1000*.55;
    let x,y;const t=d.t%4;
    if(t<0){x=-20;y=76}
    else if(t<1.6){x=130+ (t/1.6)*280; y=52+((d.el.getAttribute('r')*7)%48)}      /* crossing burst queue slowly */
    else if(t<2.1){x=470+((t-1.6)/0.5)*60; y=76}
    else if(t<3.4){x=575+((t-2.1)/1.3)*120; y=40+((d.el.getAttribute('r')*11)%64)}

    d.el.setAttribute('cx',x);d.el.setAttribute('cy',y);
    d.el.setAttribute('opacity', t>3.9?0:(t<0?0:1));});});
  /* progressive depth: reveal the multi-band detail a beat later, then let
     arrivals be SEEN entering their lanes before the serving rules play */
  const detail=p.querySelector('#p5detail');
  setTimeout(()=>{if(detail)detail.style.opacity='1';},2600);
  // three-step selection ladder: 1 priority picks the band, 2 fairness picks the flow, 3 ordering picks the head
  const bands=[{name:'premium',c:'var(--brand)',flows:[{n:'a',q:2},{n:'b',q:1}]},
               {name:'standard',c:'var(--amber)',flows:[{n:'a',q:4},{n:'b',q:3},{n:'c',q:2}]},
               {name:'batch',c:'var(--teal)',flows:[{n:'a',q:5}]}];
  const serve=p.querySelector('#p5serve'),cursorG=p.querySelector('#p5cursor'),flyG=p.querySelector('#p5fly'),inG=p.querySelector('#p5in');
  const stepEls=[p.querySelector('#p5st0'),p.querySelector('#p5st1'),p.querySelector('#p5st2')];
  const rr=[0,0,0];let flights=[],inbound=[];
  const T0=performance.now();
  const detailAt=T0+2600, serveAt=detailAt+5200;   /* intake-only phase first */

      if(bands[bi].flows[fi].q<7)inbound.push({bi,fi,c:bands[bi].c,t0:now});}
    inbound=inbound.filter(a=>{
      if(now-a.t0>=inDur){if(bands[a.bi].flows[a.fi].q<7)bands[a.bi].flows[a.fi].q++;return false;}
      return true;});
    inG.innerHTML=inbound.map(a=>{const k=smooth((now-a.t0)/inDur);
      const y1=14+a.bi*62+34, x1=170+a.fi*150+8+bands[a.bi].flows[a.fi].q*15;
      const x0=96, y0=105;   /* shared entry point on the left */
      const xm=x0+(x1-x0)*k, ym=y0+(y1-y0)*(k<0.55?smooth(k/0.55):1);
      return `<circle cx="${xm}" cy="${ym}" r="5" fill="${a.c}" opacity="${0.35+0.65*k}"/>`;}).join('');
    const serving=now>=serveAt;
    if(!serving){
      if(serve)serve.textContent='requests arrive and sort into their band lanes';
      stepEls.forEach(e=>e&&e.setAttribute('fill','var(--txt3)'));

    let ph=serving?(now-tickStart)/cyc:0;
    if(serving&&ph>=1){tickStart=now;ph=0;
      const bi=bands.findIndex(b=>b.flows.some(f=>f.q>0));
      if(bi>=0){let fi=-1;const n=bands[bi].flows.length;
        for(let s=0;s<n;s++){const c=(rr[bi]+s)%n;if(bands[bi].flows[c].q>0){fi=c;break;}}

    if(serving&&pick&&!popped&&ph>=0.6){popped=true;bands[pick.bi].flows[pick.fi].q--;
      flights.push({bi:pick.bi,fi:pick.fi,c:bands[pick.bi].c,t0:now});}
    const step=ph<0.3?0:ph<0.6?1:2;
    if(serving)stepEls.forEach((e,i)=>e&&e.setAttribute('fill',i===step?'var(--brand)':'var(--txt3)'));

        step===1?`2 fairness → tenant ${b.flows[pick.fi].n}`:
        `3 ordering → head of queue, first come first served`;}
  });},

{sub:'How',title:'The dispatch cycle',point:'Dispatch moves one request per cycle, always from the highest-priority band with work waiting. At the ceiling the whole loop halts, so lower bands never worsen the pressure.',
 provenance:'controller/internal/processor.go',dwell:19000,
 build:p=>{vizHTML(p,`
  <svg viewBox="0 0 900 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">

 enter:p=>{
  const fill=p.querySelector('#dcFill'),val=p.querySelector('#dcVal'),state=p.querySelector('#dcState');
  const bandsG=p.querySelector('#dcBands'),flyG=p.querySelector('#dcFly'),live=p.querySelector('#dcLive'),haltCap=p.querySelector('#dcHalt');
  const cfg=[{lab:'priority 100',c:'var(--brand)'},{lab:'priority 0',c:'var(--amber)'},{lab:'priority −10',c:'var(--teal)'}];
  const q=[2,4,6];
  let flights=[];
  const T0=performance.now();
  let tickStart=T0,chosen=-1,dispatched=true,lastArr=T0;
  const smooth=k=>k<=0?0:k>=1?1:k*k*(3-2*k);
  const satAt=t=>{const s=t%16;
    const w=0.6+0.2*Math.sin(t*1.3)+0.06*Math.sin(t*3.7);
    const bump=0.72*(s<9?0:s<10?smooth(s-9):s<13?1:s<14?smooth(14-s):0);
    return Math.min(1.27,w+bump);};
  const tickDur=680;
  animLoop(p,now=>{
    const t=(now-T0)/1000;
    const sat=satAt(t);
    const halted=sat>=1.0;
    fill.setAttribute('width',Math.min(300,sat/1.3*300));
    fill.setAttribute('fill',sat<0.7?'var(--ok)':sat<1.0?'var(--amber)':'var(--danger)');
    val.textContent=sat.toFixed(2);
    state.textContent=halted?'saturation at the ceiling · the cycle halts':'saturation under the ceiling · the loop runs';
    state.setAttribute('fill',halted?'var(--danger)':'var(--txt2)');
    live.setAttribute('opacity',halted?0.35:1);
    haltCap.setAttribute('opacity',halted?1:0);
    /* arrivals keep coming, queues grow while the loop is halted */
    if(now-lastArr>520){lastArr=now;const r=Math.random();const i=r<0.18?0:r<0.5?1:2;if(q[i]<9)q[i]++;}
    /* cycle tick: pick the highest non-empty band, dispatch exactly one */
    let phase=(now-tickStart)/tickDur;
    if(!halted&&phase>=1){tickStart=now;phase=0;chosen=q.findIndex(v=>v>0);dispatched=false;}
    if(halted){tickStart=now;phase=0;}
    const scanIdx=chosen<0?-1:Math.min(chosen,Math.floor(phase/0.13));
    if(!halted&&!dispatched&&chosen>=0&&phase>0.13*(chosen+1)){
      q[chosen]--;flights.push({i:chosen,t0:now});dispatched=true;}
    /* draw the bands */
    let s='';
    cfg.forEach((b,i)=>{const y=50+i*84;
      const hl=!halted&&scanIdx===i;
      s+=`<rect x="380" y="${y}" width="310" height="60" rx="9" fill="${hl?'var(--brand-soft)':'var(--inset)'}" stroke="${b.c}" stroke-width="${hl?2.5:1}" opacity=".95"/>
        <text x="372" y="${y+30}" font-size="11" fill="${b.c}" text-anchor="end">${b.lab}</text>
        <text x="372" y="${y+44}" font-size="9" fill="var(--txt3)" text-anchor="end">band</text>`;
      if(!halted&&chosen>i&&scanIdx>=i)s+=`<text x="678" y="${y+18}" font-size="9" fill="var(--txt3)" text-anchor="end">empty · skip</text>`;
      for(let k=0;k<q[i];k++)s+=`<circle cx="${672-k*19}" cy="${y+36}" r="6" fill="${b.c}" opacity="${k===0?1:.6}"/>`;
      if(q[i]===0)s+=`<text x="392" y="${y+40}" font-size="9.5" fill="var(--txt3)">no work waiting</text>`;});
    bandsG.innerHTML=s;
    /* flying dispatch dots */
    flights=flights.filter(f=>(now-f.t0)<500);
    flyG.innerHTML=flights.map(f=>{const k=smooth((now-f.t0)/500);
      const y0=50+f.i*84+36;
      return `<circle cx="${676+(806-676)*k}" cy="${y0+(170-y0)*k}" r="6" fill="${cfg[f.i].c}"/>`;}).join('');
  });}},

function scenarioAnim(p,id,cfg){

  p.querySelector('#'+id+'leg').innerHTML=cfg.lines.map(l=>`<span><span class="dot" style="background:${l.c}"></span>${l.label}</span>`).join('');
  p.querySelector('#'+id+'btitle').textContent=cfg.barTitle;
  p.querySelector('#'+id+'bars').innerHTML=cfg.bars.map(([n,v,c])=>`

      <span class="mono" style="font-size:11px;width:44px">${v}</span></div>`).join('');
  p.querySelector('#'+id+'note').textContent=cfg.note;
  requestAnimationFrame(()=>p.querySelectorAll('.scf').forEach(b=>b.style.width=b.dataset.w+'%'));
  let t0=performance.now();
  animLoop(p,now=>{const prog=Math.min(1,((now-t0)%7500)/3500);   /* sweep loops so the slide never stalls */
    els.forEach((pl,i)=>{const l=cfg.lines[i];let d='';
      const n=Math.floor(90*prog);
      for(let k=0;k<=n;k++){const f=k/90;
        const inWin=f>cfg.window[0]&&f<cfg.window[1];
        const ramp=inWin?Math.min(1,(f-cfg.window[0])/0.08)*Math.min(1,(cfg.window[1]-f)/0.08):0;
        const v=l.base+(l.peak-l.base)*ramp+(cfg.jitter||8)*Math.sin(k*1.7+i*9)*(0.4+0.6*ramp);
        const y=220-(v/cfg.ymax)*185;
        d+=(46+f*454)+','+y+' ';}
      pl.setAttribute('points',d);});});}
/* counter + loop helpers */
function animCount(el,to,ms){let t0=performance.now();
  const step=now=>{const k=Math.min(1,(now-t0)/ms);el.textContent=Math.round(to*(1-(1-k)**3));
    if(k<1&&el.isConnected)requestAnimationFrame(step);};requestAnimationFrame(step);}
const loops=new Map();
function animLoop(page,fn){let last=performance.now();
  const tick=now=>{if(!page.classList.contains('act')){loops.delete(page);return;}
    fn(now,now-last);last=now;loops.set(page,requestAnimationFrame(tick));};
  loops.set(page,requestAnimationFrame(tick));}

         and stays flat near baseline while standard then batch absorb the wait */
      let rem=excess;
      ['batch','standard','premium'].forEach(k=>{const take=Math.min(rem, L[k]); q[k]= L[k]? (take/Math.max(1,L[k]))*(PG.mode===1?520:300):0; rem-=take;});
      /* premium barely feels queue time; it only carries its shared engine time */
      t.premium = L.premium? base + batchPenalty*0.9 + q.premium*0.12 : 0;
      t.standard= L.standard? base + batchPenalty + q.standard : 0;
      t.batch   = L.batch? base + batchPenalty + q.batch : 0;
      if(PG.mode===1&&excess>0){/* isolation: more excess held upstream, engine time eases */
        t.premium*=0.7;t.standard*=0.85;t.batch*=0.85;}
      if(L.batch>70){shed=Math.round((L.batch-70)*1.8);}
      if(excess>40){ttl=Math.round((excess-40)*0.7);}
    }
    ['premium','standard','batch'].forEach(k=>{const h=hist[k];h.push(L[k]?t[k]:null);if(h.length>120)h.shift();});
    /* draw */
    let s='<line x1="40" y1="210" x2="620" y2="210" stroke="var(--b2)"/>';
    [[0,'0'],[400,'400'],[800,'800 ms']].forEach(([v,lb])=>{const y=210-v/900*180;
      s+=`<line x1="40" y1="${y}" x2="620" y2="${y}" stroke="var(--b1)"/><text x="36" y="${y+3}" font-size="9" fill="var(--txt3)" text-anchor="end">${lb}</text>`;});
    ['premium','standard','batch'].forEach(k=>{const h=hist[k];let d='';
      h.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+(40+i/119*580)+' '+(210-Math.min(880,v)/900*180)+' ';});
      if(d)s+=`<path d="${d}" fill="none" stroke="${COLORS[k]}" stroke-width="2.2" stroke-linejoin="round"/>`;});
    s+='<text x="40" y="18" font-size="10" fill="var(--txt3)">time to first token, rolling</text>';
    svg.innerHTML=s;
    const thr=Math.round(Math.min(total,cap)*(PG.shape?0.9:2.4)*(PG.fc&&PG.mode===1?0.82:1));
    cnt.innerHTML=['premium','standard','batch'].map(k=>L[k]?`<div class="counter"><span class="dot" style="background:${COLORS[k]}"></span>${k} ${Math.round(t[k])} ms · q ${Math.round(q[k])}</div>`:'').join('')
      +`<div class="counter">${thr} req/s</div><div class="counter" style="${shed||ttl?'color:var(--danger)':''}">429 ${shed} · 503 ${ttl}</div>`;
  });
  chips.querySelector('.chip').click();
}

/* ---------- shell: nav, autoplay, timeline, mode ---------- */
let cur=0,auto=true,autoT0=performance.now();
const stage=$('#stage');
PAGES.forEach((d,i)=>{const el=document.createElement('div');el.className='page';el.id='pg'+i;stage.appendChild(el);});
function buildTimeline(){
  const tl=$('#timeline');tl.innerHTML='';
  ACTS.forEach((a,i)=>{
    const done=a.pages[a.pages.length-1]<cur, act=a.pages.includes(cur)|| (cur===0&&i===0);
    const s=document.createElement('div');s.className='stop'+(done?' done':'')+(act&&cur>0?' act':'');
    s.innerHTML=`<span class="n">${done?'✓':i+1}${act&&cur>0&&auto?`<svg viewBox="0 0 26 26"><circle cx="13" cy="13" r="11.5" fill="none" stroke="var(--brand)" stroke-width="2" stroke-dasharray="72.2" stroke-dashoffset="${72.2*(1-autoProg())}" transform="rotate(-90 13 13)"/></svg>`:''}</span>${a.name}`;
    s.onclick=()=>go(a.pages[0]);
    tl.appendChild(s);
    if(i<ACTS.length-1){const l=document.createElement('div');l.className='tl-line';tl.appendChild(l);}
  });
}
function autoDwell(){return (PAGES[cur]&&PAGES[cur].dwell)||14000;}
function autoProg(){return Math.min(1,(performance.now()-autoT0)/autoDwell());}
function go(n){
  n=Math.max(0,Math.min(PAGES.length-1,n));
  const old=$('#pg'+cur);
  if(PAGES[cur].exit)PAGES[cur].exit(old);
  old.classList.remove('act');
  cur=n;autoT0=performance.now();
  location.hash='page-'+n;
  const el=$('#pg'+n);
  PAGES[n].build(el);
  el.classList.add('act');
  if(PAGES[n].enter)PAGES[n].enter(el);
  $('#subtitle').textContent=PAGES[n].title||'';
  $('#pgno').textContent=(n+1)+' / '+PAGES.length;
  $('#prevBtn').disabled=n===0;
  $('#nextBtn').disabled=n===PAGES.length-1;
  buildTimeline();
}
$('#prevBtn').onclick=()=>go(cur-1);
$('#nextBtn').onclick=()=>go(cur+1);
$('#skipBtn').onclick=()=>go(PAGES.length-1);
$('#autoBtn').onclick=()=>{auto=!auto;autoT0=performance.now();
  $('#autoBtn').classList.toggle('on',auto);$('#autoBtn').textContent=auto?'❚❚ pause':'▶ play';};
$('#modeBtn').onclick=()=>{const l=document.documentElement.dataset.mode==='light';
  document.documentElement.dataset.mode=l?'':'light';
  $('#modeBtn').textContent=l?'☾ dark':'☀ light';};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
setInterval(()=>{if(auto&&cur<PAGES.length-1&&autoProg()>=1)go(cur+1);else if(auto)buildTimeline();},500);
window.addEventListener('hashchange',()=>{const m=location.hash.match(/page-(\d+)/);const n=m?+m[1]:0;if(n!==cur)go(n);});
const h=location.hash.match(/page-(\d+)/);
go(h?+h[1]:0);
</script>
