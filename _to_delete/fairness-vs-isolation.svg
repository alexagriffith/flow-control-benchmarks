<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 586" role="img" aria-label="Same band fairness gives equal treatment while separate bands give insulation"><rect width="1200" height="586" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start">What each mechanism controls</text><text x="20" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">One tenant bursts. On the left it shares a priority band with its peers. On the right the bursting workload sits in a lower band.</text><rect x="20" y="72" width="560" height="440" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="620" y="72" width="560" height="440" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><text x="40" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515" text-anchor="start">One band, three tenants</text><text x="40" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Round-robin splits dispatch turns across the three tenants.</text><text x="40" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">All at priority 100 &#183; queue depth threshold 1 &#183; max_num_seqs 128 &#183; output 64</text><text x="640" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515" text-anchor="start">Two bands, same burst</text><text x="640" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Strict priority runs before fairness, so the lower band waits first.</text><text x="640" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">Priority 100 / 0 / -10 &#183; queue depth threshold 4 &#183; max_num_seqs 128 &#183; output 128</text><text x="40" y="170" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">p95 time to first token during the burst</text><text x="40" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant A</text><rect x="170" y="191" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="170" y="191" width="298" height="16" rx="8" fill="#1c78d8"/><text x="512" y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">271 ms</text><text x="40" y="218" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">82 requests/s, the burster</text><text x="40" y="249" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant B</text><rect x="170" y="237" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="170" y="237" width="244" height="16" rx="8" fill="#1f8a5f"/><text x="512" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">222 ms</text><text x="40" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">6 requests/s</text><text x="40" y="295" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant C</text><rect x="170" y="283" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="170" y="283" width="256" height="16" rx="8" fill="#d59a00"/><text x="512" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">233 ms</text><text x="40" y="310" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">6 requests/s</text><text x="40" y="340" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">Mean queue duration</text><text x="40" y="373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant A</text><rect x="170" y="361" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="170" y="361" width="71" height="16" rx="8" fill="#1c78d8"/><text x="512" y="374" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">45 ms</text><text x="40" y="407" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant B</text><rect x="170" y="395" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="170" y="395" width="28" height="16" rx="8" fill="#1f8a5f"/><text x="512" y="408" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">17.5 ms</text><text x="40" y="441" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant C</text><rect x="170" y="429" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="170" y="429" width="27" height="16" rx="8" fill="#d59a00"/><text x="512" y="442" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">17.3 ms</text><text x="40" y="466" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">A brought 14x the traffic and paid 2.6x the queue. Its peers landed</text><text x="40" y="482" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">within 11 ms of each other, and 40 ms behind A. Everyone slowed together.</text><text x="640" y="170" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">Mean queue duration during the batch surge</text><text x="640" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Premium</text><rect x="770" y="191" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="770" y="191" width="97" height="16" rx="8" fill="#1f8a5f"/><text x="1112" y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">62 ms</text><text x="640" y="218" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">interactive band</text><text x="640" y="249" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Standard</text><rect x="770" y="237" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="770" y="237" width="101" height="16" rx="8" fill="#d59a00"/><text x="1112" y="250" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">64 ms</text><text x="640" y="264" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">interactive band</text><text x="640" y="295" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Batch</text><rect x="770" y="283" width="330" height="16" rx="8" fill="#eeeeee"/><rect x="770" y="283" width="311" height="16" rx="8" fill="#1c78d8"/><text x="1112" y="296" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">198 ms</text><text x="640" y="310" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">lower band, the burster</text><text x="640" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">Batch ramped to three times the interactive arrival rate and absorbed</text><text x="640" y="348" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">roughly three times the queue. The interactive lanes stayed where they were.</text><text x="640" y="370" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">Separating the bands is what holds one workload steady while another surges.</text><line x1="20" y1="544" x2="1180" y2="544" stroke="#e6e6e6"/><text x="20" y="556" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Left: one 90 s exploratory window, 1 repeat, seed 42. Right: three counted 300 s repeats, seed 42. Both on one GPU serving GPT-OSS 20B.</text><text x="20" y="572" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">The two panels come from different campaigns, so gate setting and output length differ as well as band layout. A matched pair on identical traffic is scheduled.</text></svg>