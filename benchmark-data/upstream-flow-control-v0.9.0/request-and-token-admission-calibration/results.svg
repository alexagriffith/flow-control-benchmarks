<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="898" viewBox="0 0 1200 898" role="img" aria-labelledby="title desc"><title id="title">Request and token admission benchmark results</title><desc id="desc">In this calibration, 128 requests preserved lower TTFT; token admission changed the tradeoff for mixed sizes. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="1200" height="898" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Request and token admission</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">In this calibration, 128 requests preserved lower TTFT; token admission changed the tradeoff for mixed sizes.</tspan></text><rect x="40" y="112" width="550" height="360" fill="#ffffff" stroke="#cdd5df"/><rect x="40" y="112" width="550" height="4" fill="#2d6cdf"/><text x="62.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="62.0" dy="0.0">First-token latency as the request cap</tspan><tspan x="62.0" dy="23.4">increased</tspan></text><text x="62.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">p95 TTFT (ms)</text><line x1="106" y1="417.0" x2="556" y2="417.0" stroke="#e1e7ed"/><text x="98.0" y="421.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">0.0 ms</text><line x1="106" y1="317.5" x2="556" y2="317.5" stroke="#e1e7ed"/><text x="98.0" y="321.5" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">1,366 ms</text><line x1="106" y1="218.0" x2="556" y2="218.0" stroke="#e1e7ed"/><text x="98.0" y="222.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">2,731 ms</text><text x="106.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">128</text><text x="556.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">160</text><pol