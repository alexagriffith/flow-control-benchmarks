<svg xmlns="http://www.w3.org/2000/svg" width="650" height="1240" viewBox="0 0 650 1240" role="img" aria-labelledby="title desc"><title id="title">Prefix-cache routing benchmark results</title><desc id="desc">Prefix-aware routing changed latency by workload while cache hit rate stayed flat. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="1240" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Prefix-cache routing</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Prefix-aware routing changed latency by workload while cache hit</tspan><tspan x="40.0" dy="19.5">rate stayed flat.</tspan></text><rect x="50" y="112" width="550" height="362" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">How prefix-aware routing changed latency</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><circle cx="78.0" cy="210" r="6" fill="#2d6cdf"/><text x="90.0" y="214.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Random</text><circle cx="318.0" cy="210" r="6" fill="#087f72"/><text x="330.0" y="214.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Prefix aware</text><text x="72.0" y="252.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime Chat</tspan></text><line x1="230" y1="248.0" x2="510" y2="248.0" stroke="#e1e7ed"/><line x1="244.7" y1="248.0" x2="260.8" y2="248.0" stroke="#cdd5df" stroke-width="3"/><circle cx="260.8" cy="248.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="260.8" y="236.0" fill="#2d6cdf" font-size="9" font-weight="750" text-anchor="middle">1,