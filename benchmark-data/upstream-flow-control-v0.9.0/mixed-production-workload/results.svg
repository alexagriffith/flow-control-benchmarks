<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1010" viewBox="0 0 1200 1010" role="img" aria-labelledby="title desc"><title id="title">Mixed production workload benchmark results</title><desc id="desc">Request-count admission protected realtime latency by holding more work before vLLM. Input-token admission spread latency more evenly across the four workloads. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="1200" height="1010" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Mixed production workload</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Request-count admission protected realtime latency by holding more work before vLLM. Input-token admission spread latency more</tspan><tspan x="40.0" dy="19.5">evenly across the four workloads.</tspan></text><rect x="40" y="112" width="550" height="406" fill="#ffffff" stroke="#cdd5df"/><rect x="40" y="112" width="550" height="4" fill="#2d6cdf"/><text x="62.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="62.0" dy="0.0">Surge p95 TTFT by workload</tspan></text><text x="62.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">Median time to first token (ms), log scale</text><text x="62.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="62.0" dy="0.0">Request count gave realtime chat the lower TTFT; input tokens gave</tspan><tspan x="62.0" dy="14.3">long-context and batch the lower TTFT.</tspan></text><rect x="62.0" y="225" width="12" height="12" fill="#2d6cdf"/><text x="80.0" y="235.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Request count</text><rect x="302.0" y="225" width="12" height="12" fill="#087f72"/><text x="320.0" y="235.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Input tokens</text><text x="62.0" y="270.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Premium</tspan></text><rect x="210" y="256.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="256.0" width="246.4" height="12.0" fill="#2d6cdf"/><text x="572.0" y="268.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">1,994 ms</text><rect x="210" y="273.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="273.0" width="258.7" height="12.0" fill="#087f72"/><text x="572.0" y="285.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">2,914 ms</text><text x="62.0" y="328.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Gold</tspan></text><rect x="210" y="314.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="314.0" width="256.8" height="12.0" fill="#2d6cdf"/><text x="572.0" y="326.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">2,745 ms</text><rect x="210" y="331.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="331.0" width="257.8" height="12.0" fill="#087f72"/><text x="572.0" y="343.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">2,836 ms</text><text x="62.0" y="386.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Standard</tspan></text><rect x="210" y="372.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="372.0" width="277.2" height="12.0" fill="#2d6cdf"/><text x="572.0" y="384.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">5,150 ms</text><rect x="210" y="389.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="389.0" width="260.5" height="12.0" fill="#087f72"/><text x="572.0" y="401.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">3,076 ms</text><text x="62.0" y="444.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Batch</tspan></text><rect x="210" y="430.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="210" y="430.0" w