="134.0" y="987.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">HTTP 429 responses</text><text x="40.0" y="1274.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
