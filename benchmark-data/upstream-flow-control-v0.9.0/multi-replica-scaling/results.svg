<svg xmlns="http://www.w3.org/2000/svg" width="650" height="1298" viewBox="0 0 650 1298" role="img" aria-labelledby="title desc"><title id="title">Model pool scaling benchmark results</title><desc id="desc">Per-GPU throughput held as the pool grew. Smaller pools reached the rejection boundary. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="1298" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Model pool scaling</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Per-GPU throughput held as the pool grew. Smaller pools reached</tspan><tspan x="40.0" dy="19.5">the rejection boundary.</tspan></text><rect x="50" y="112" width="550" height="360" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Per-GPU throughput as the model pool grew</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">served requests/s/GPU</text><line x1="116" y1="417.0" x2="566" y2="417.0" stroke="#e1e7ed"/><text x="108.0" y="421.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">0.000</text><line x1="116" y1="317.5" x2="566" y2="317.5" stroke="#e1e7ed"/><text x="108.0" y="321.5" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">2.418</text><line x1="116" y1="218.0" x2="566" y2="218.0" stroke="#e1e7ed"/><text x="108.0" y="222.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">4.835</text><text x="116.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">1 model replica</text><text x="341.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">2 model replicas</text><text x="566.0" y="439.0" fill="#5f6c7b" fon