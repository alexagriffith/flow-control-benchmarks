<svg xmlns="http://www.w3.org/2000/svg" width="650" height="1238" viewBox="0 0 650 1238" role="img" aria-labelledby="title desc"><title id="title">Batch interference benchmark results</title><desc id="desc">Running batch severely delayed newly arriving realtime requests. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="1238" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Batch interference</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Running batch severely delayed newly arriving realtime requests.</tspan></text><rect x="40" y="101" width="570" height="4" fill="#c56a00"/><rect x="50" y="112" width="550" height="340" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Realtime p95 TTFT was 115 times the reference</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><circle cx="78.0" cy="210" r="6" fill="#2d6cdf"/><text x="90.0" y="214.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Realtime only</text><circle cx="318.0" cy="210" r="6" fill="#087f72"/><text x="330.0" y="214.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Batch already running</text><text x="72.0" y="252.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime</tspan></text><line x1="230" y1="248.0" x2="510" y2="248.0" stroke="#e1e7ed"/><line x1="242.4" y1="248.0" x2="507.3" y2="248.0" stroke="#cdd5df" stroke-width="3"/><circle cx="242.4" cy="248.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="242.4" y="236.0" fill="#2d6cdf" font-size="9" font-weight="750" text-anchor="middle">133 ms</text><circle cx="507.3" cy="248.0" r="7" fill="#087f72" stroke="#ffffff" stroke-width="2"/><text x="507.3" y="268.0" fill="#087f72" font-size="9" font-weight="750" text-anchor="middle">15,378 ms</text><rect x="50" y="472" width="550" height="340" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="472" width="550" height="4" fill="#087f72"/><text x="72.0" y="506.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">vLLM peak waiting reached 63 requests</tspan></text><text x="72.0" y="533.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median peak requests</text><circle cx="78.0" cy="570" r="6" fill="#2d6cdf"/><text x="90.0" y="574.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Realtime only</text><circle cx="318.0" cy="570" r="6" fill="#087f72"/><text x="330.0" y="574.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Batch already running</text><text x="72.0" y="612.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Waiting requests</tspan></text><line x1="230" y1="608.0" x2="510" y2="608.0" stroke="#e1e7ed"/><line x1="230.0" y1="608.0" x2="496.7" y2="608.0" stroke="#cdd5df" stroke-width="3"/><circle cx="230.0" cy="608.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="230.0" y="596.0" fill="#2d6cdf" font-size="9" font-weight="750" text-anchor="middle">0</text><circle cx="496.7" cy="608.0" r="7" fill="#087f72" stroke="#ffffff" stroke-width="2"/><text x="496.7" y="628.0" fill="#087f72" font-size="9" font-weight="750" text-anchor="middle">63</text><rect x="50" y="832" width="550" height="340" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="832" width="550" height="4" fill="#c56a00"/><text x="72.0" y="866.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Peak KV-cache use reached 44.4%</tspan></text><text x="72.0" y="893.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median peak KV cache (%)</text><circle cx="78.0" cy="930" r="6" fill="#2d6cdf"/><text x="90.0" y="934.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Realtime only</text><circle cx="318.0" cy="930" r="6" fill="#087f72"/><text x="330.0" y="934.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Batch already running</text><text x="72.0" y="972.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">KV-cache use</tspan></text><line x1="230" y1="968.0" x2="510" y2="968.0" stroke="#e1e7ed"/><line x1="239.5" y1="968.0" x2="496.7" y2="968.0" stroke="#cdd5df" stroke-width="3"/><circle cx="239.5" cy="968.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="239.5" y="956.0" fill="#2d6cdf" font-size="9" font-weight="750" text-anchor="middle">1.6%</text><circle cx="496.7" cy="968.0" r="7" fill="#087f72" stroke="#ffffff" stroke-width="2"/><text x="496.7" y="988.0" fill="#087f72" font-size="9" font-weight="750" text-anchor="middle">44.4%</text><text x="40.0" y="1214.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
