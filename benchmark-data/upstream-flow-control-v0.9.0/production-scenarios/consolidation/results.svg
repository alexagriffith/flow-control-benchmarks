<svg xmlns="http://www.w3.org/2000/svg" width="650" height="858" viewBox="0 0 650 858" role="img" aria-labelledby="title desc"><title id="title">Consolidation benchmark results</title><desc id="desc">Two realtime tenants retained faster access while a lower-priority burst filled the shared pool. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="858" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Consolidation</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Two realtime tenants retained faster access while a lower-priority</tspan><tspan x="40.0" dy="19.5">burst filled the shared pool.</tspan></text><rect x="50" y="112" width="550" height="320" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Who waited during the surge</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="72.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="72.0" dy="0.0">The lower-priority burst absorbed more delay than either realtime tenant.</tspan></text><line x1="240" y1="226" x2="508" y2="226" stroke="#cdd5df"/><text x="240.0" y="219.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="middle">407 ms</text><text x="508.0" y="219.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="middle">25,892 ms</text><text x="72.0" y="249.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime Tenant A</tspan></text><line x1="240" y1="244.0" x2="508" y2="244.0" stroke="#e1e7ed"/><circle cx="254.2" cy="244.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="248.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">509 ms</text><text x="72.0" y="298.3" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime Tenant B</tspan></text><line x1="240" y1="293.3" x2="508" y2="293.3" stroke="#e1e7ed"/><circle cx="259.9" cy="293.3" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="297.3" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">556 ms</text><text x="72.0" y="347.7" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Standard Burst</tspan></text><line x1="240" y1="342.7" x2="508" y2="342.7" stroke="#e1e7ed"/><circle cx="504.9" cy="342.7" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="346.7" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">25,892 ms</text><rect x="50" y="452" width="550" height="340" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="452" width="550" height="4" fill="#087f72"/><text x="72.0" y="486.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">How detector choice changed realtime latency</tspan></text><text x="72.0" y="513.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="72.0" y="537.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="72.0" dy="0.0">The same prompts, schedule, model, and GPU were used for each detector.</tspan></text><circle cx="78.0" cy="576" r="6" fill="#2d6cdf"/><text x="90.0" y="580.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">queue depth 2</text><circle cx="238.0" cy="576" r="6" fill="#087f72"/><text x="250.0" y="580.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">queue depth 5</text><circle cx="398.0" cy="576" r="6" fill="#c56a00"/><text x="410.0" y="580.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Request count</text><text x="72.0" y="618.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime Tenant A</tspan></text><line x1="230" y1="614.0" x2="510" y2="614.0" stroke="#e1e7ed"/><line x1="254.2" y1="614.0" x2="504.7" y2="614.0" stroke="#cdd5df" stroke-width="3"/><circle cx="495.7" cy="614.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="495.7" y="602.0" fill="#2d6cdf" font-size="9" font-weight="750" text-anchor="middle">4,711 ms</text><circle cx="504.7" cy="614.0" r="7" fill="#087f72" stroke="#ffffff" stroke-width="2"/><text x="504.7" y="634.0" fill="#087f72" font-size="9" font-weight="750" text-anchor="middle">5,117 ms</text><circle cx="254.2" cy="614.0" r="7" fill="#c56a00" stroke="#ffffff" stroke-width="2"/><text x="254.2" y="586.0" fill="#c56a00" font-size="9" font-weight="750" text-anchor="middle">509 ms</text><text x="72.0" y="676.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime Tenant B</tspan></text><line x1="230" y1="672.0" x2="510" y2="672.0" stroke="#e1e7ed"/><line x1="263.8" y1="672.0" x2="500.1" y2="672.0" stroke="#cdd5df" stroke-width="3"/><circle cx="492.4" cy="672.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="492.4" y="660.0" fill="#2d6cdf" font-size="9" font-weight="750" text-anchor="middle">4,567 ms</text><circle cx="500.1" cy="672.0" r="7" fill="#087f72" stroke="#ffffff" stroke-width="2"/><text x="500.1" y="692.0" fill="#087f72" font-size="9" font-weight="750" text-anchor="middle">4,906 ms</text><circle cx="263.8" cy="672.0" r="7" fill="#c56a00" stroke="#ffffff" stroke-width="2"/><text x="263.8" y="644.0" fill="#c56a00" font-size="9" font-weight="750" text-anchor="middle">556 ms</text><text x="40.0" y="834.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
