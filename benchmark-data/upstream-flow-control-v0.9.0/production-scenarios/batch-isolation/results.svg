<svg xmlns="http://www.w3.org/2000/svg" width="650" height="498" viewBox="0 0 650 498" role="img" aria-labelledby="title desc"><title id="title">Batch isolation benchmark results</title><desc id="desc">Realtime stayed faster than batch in every repeat; latency spread was too wide for a stable point estimate. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="498" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Batch isolation</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Realtime stayed faster than batch in every repeat; latency spread</tspan><tspan x="40.0" dy="19.5">was too wide for a stable point estimate.</tspan></text><rect x="50" y="112" width="550" height="320" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Who waited during the surge</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="72.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="72.0" dy="0.0">Directional medians: realtime ranged from 371–669 ms and standard from</tspan><tspan x="72.0" dy="14.3">436–1,017 ms, above the 1.5× repeat-stability gate.</tspan></text><line x1="240" y1="226" x2="508" y2="226" stroke="#cdd5df"/><text x="240.0" y="219.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="middle">353 ms</text><text x="508.0" y="219.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="middle">13,077 ms</text><text x="72.0" y="249.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Realtime</tspan></text><line x1="240" y1="244.0" x2="508" y2="244.0" stroke="#e1e7ed"/><circle cx="256.3" cy="244.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="248.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">442 ms</text><text x="72.0" y="298.3" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Standard</tspan></text><line x1="240" y1="293.3" x2="508" y2="293.3" stroke="#e1e7ed"/><circle cx="267.6" cy="293.3" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="297.3" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">515 ms</text><text x="72.0" y="347.7" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Batch</tspan></text><line x1="240" y1="342.7" x2="508" y2="342.7" stroke="#e1e7ed"/><circle cx="504.4" cy="342.7" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="346.7" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">13,077 ms</text><text x="40.0" y="474.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
