<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">Batch isolation serving path</title><desc id="desc">The tested path moves from Realtime, standard, and batch through Priority and fairness queues and Request-count admission to One vLLM replica.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="1200" height="350" fill="#f5f7f9"/><text x="40.0" y="48.0" fill="#15202b" font-size="28" font-weight="800" text-anchor="start">Tested serving path</text><text x="40.0" y="78.0" fill="#5f6c7b" font-size="14" font-weight="500"><tspan x="40.0" dy="0.0">Realtime stayed faster than batch in every repeat; latency spread was too wide for a stable point estimate.</tspan></text><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#7c8996"/></marker></defs><line x1="285" y1="210" x2="307" y2="210" stroke="#7c8996" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="125" width="245" height="170" fill="#ffffff" stroke="#cdd5df"/><rect x="40" y="125" width="245" height="5" fill="#2d6cdf"/><circle cx="70" cy="160" r="16" fill="#2d6cdf"/><text x="70.0" y="166.0" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">1</text><text x="60.0" y="202.0" fill="#15202b" font-size="17" font-weight="750"><tspan x="60.0" dy="0.0">Realtime, standard,</tspan><tspan x="60.0" dy="22.1">and batch</tspan></text><line x1="570" y1="210" x2="592" y2="210" stroke="#7c8996" stroke-width="2" marker-end="url(#arrow)"/><rect x="325" y="125" width="245" height="170" fill="#ffffff" stroke="#cdd5df"/><rect x="325" y="125" width="245" height="5" fill="#087f72"/><circle cx="355" cy="160" r="16" fill="#087f72"/><text x="355.0" y="166.0" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">2</text><text x="345.0" y="202.0" fill="#15202b" font-size="17" font-weight="750"><tspan x="345.0" dy="0.0">Priority and fairness</tspan><tspan x="345.0" dy="22.1">queues</tspan></text><line x1="855" y1="210" x2="877" y2="210" stroke="#7c8996" stroke-width="2" marker-end="url(#arrow)"/><rect x="610" y="125" width="245" height="170" fill="#ffffff" stroke="#cdd5df"/><rect x="610" y="125" width="245" height="5" fill="#6550a5"/><circle cx="640" cy="160" r="16" fill="#6550a5"/><text x="640.0" y="166.0" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">3</text><text x="630.0" y="202.0" fill="#15202b" font-size="17" font-weight="750"><tspan x="630.0" dy="0.0">Request-count</tspan><tspan x="630.0" dy="22.1">admission</tspan></text><rect x="895" y="125" width="245" height="170" fill="#ffffff" stroke="#cdd5df"/><rect x="895" y="125" width="245" height="5" fill="#c56a00"/><circle cx="925" cy="160" r="16" fill="#c56a00"/><text x="925.0" y="166.0" fill="#ffffff" font-size="13" font-weight="800" text-anchor="middle">4</text><text x="915.0" y="202.0" fill="#15202b" font-size="17" font-weight="750"><tspan x="915.0" dy="0.0">One vLLM replica</tspan></text><text x="40.0" y="327.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Architecture reflects the topology and control point recorded in this package&#x27;s run configuration.</text></svg>
