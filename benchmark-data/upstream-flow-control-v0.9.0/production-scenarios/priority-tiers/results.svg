<svg xmlns="http://www.w3.org/2000/svg" width="650" height="504" viewBox="0 0 650 504" role="img" aria-labelledby="title desc"><title id="title">Priority tiers benchmark results</title><desc id="desc">Higher-priority realtime traffic retained faster access while lower-priority traffic absorbed more delay. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="504" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Priority tiers</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Higher-priority realtime traffic retained faster access while</tspan><tspan x="40.0" dy="19.5">lower-priority traffic absorbed more delay.</tspan></text><rect x="50" y="112" width="550" height="326" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Who waited during the surge</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="72.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="72.0" dy="0.0">Lower-priority traffic absorbed more delay during the surge.</tspan></text><line x1="240" y1="226" x2="508" y2="226" stroke="#cdd5df"/><text x="240.0" y="219.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="middle">324 ms</text><text x="508.0" y="219.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="middle">13,264 ms</text><text x="72.0" y="249.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Platinum Realtime</tspan></text><line x1="240" y1="244.0" x2="508" y2="244.0" stroke="#e1e7ed"/><circle cx="255.9" cy="244.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="248.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">404 ms</text><text x="72.0" y="287.5" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Gold Realtime</tspan></text><line x1="240" y1="282.5" x2="508" y2="282.5" stroke="#e1e7ed"/><circle cx="272.5" cy="282.5" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="286.5" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">511 ms</text><text x="72.0" y="326.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Silver Standard</tspan></text><line x1="240" y1="321.0" x2="508" y2="321.0" stroke="#e1e7ed"/><circle cx="290.4" cy="321.0" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="325.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">656 ms</text><text x="72.0" y="364.5" fill="#15202b" font-size="11" font-weight="650"><tspan x="72.0" dy="0.0">Bronze Batch</tspan></text><line x1="240" y1="359.5" x2="508" y2="359.5" stroke="#e1e7ed"/><circle cx="504.5" cy="359.5" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="2"/><text x="582.0" y="363.5" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">13,264 ms</text><text x="40.0" y="480.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
