<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="504" viewBox="0 0 1200 504" role="img" aria-labelledby="title desc"><title id="title">Priority tiers benchmark results</title><desc id="desc">Flow control kept dispatch policy active while the surge changed who queued. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="1200" height="504" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Priority tiers</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Flow control kept dispatch policy active while the surge changed who queued.</tspan></text><rect x="40" y="112" width="550" height="326" fill="#ffffff" stroke="#cdd5df"/><rect x="40" y="112" width="550" height="4" fill="#2d6cdf"/><text x="62.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="62.0" dy="0.0">Latency during the surge</tspan></text><text x="62.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="62.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="62.0" dy="0.0">Lower-priority or overloaded work absorbed more delay.</tspan></text><text x="62.0" y="248.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Platinum Realtime</tspan></text><rect x="220" y="237.0" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="237.0" width="179.6" height="14" fill="#2d6cdf"/><text x="572.0" y="249.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">404 ms</text><text x="62.0" y="289.5" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Gold Realtime</tspan></text><rect x="220" y="278.5" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="278.5" width="186.6" height="14" fill="#2d6cdf"/><text x="572.0" y="290.5" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">511 ms</text><text x="62.0" y="331.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Silver Standard</tspan></text><rect x="220" y="320.0" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="320.0" width="194.1" height="14" fill="#2d6cdf"/><text x="572.0" y="332.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">656 ms</text><text x="62.0" y="372.5" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Bronze Batch</tspan></text><rect x="220" y="361.5" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="361.5" width="284.0" height="14" fill="#2d6cdf"/><text x="572.0" y="373.5" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">13,264 ms</text><text x="40.0" y="480.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
