<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="508" viewBox="0 0 1200 508" role="img" aria-labelledby="title desc"><title id="title">Same-priority fairness benchmark results</title><desc id="desc">Flow control kept dispatch policy active while the surge changed who queued. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="1200" height="508" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Same-priority fairness</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Flow control kept dispatch policy active while the surge changed who queued.</tspan></text><rect x="40" y="112" width="550" height="330" fill="#ffffff" stroke="#cdd5df"/><rect x="40" y="112" width="550" height="4" fill="#2d6cdf"/><text x="62.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="62.0" dy="0.0">Latency during the surge</tspan></text><text x="62.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="62.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="62.0" dy="0.0">Lower-priority or overloaded work absorbed more delay.</tspan></text><text x="62.0" y="248.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Realtime Burster A</tspan></text><rect x="220" y="237.0" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="237.0" width="284.0" height="14" fill="#2d6cdf"/><text x="572.0" y="249.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">12,097 ms</text><text x="62.0" y="296.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Realtime Peer B</tspan></text><rect x="220" y="285.0" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="285.0" width="189.4" height="14" fill="#2d6cdf"/><text x="572.0" y="297.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">527 ms</text><text x="62.0" y="344.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="62.0" dy="0.0">Realtime Peer C</tspan></text><rect x="220" y="333.0" width="284" height="14" fill="#e1e7ed"/><rect x="220" y="333.0" width="191.8" height="14" fill="#2d6cdf"/><text x="572.0" y="345.0" fill="#15202b" font-size="11" font-weight="750" text-anchor="end">570 ms</text><rect x="610" y="112" width="550" height="330" fill="#ffffff" stroke="#cdd5df"/><rect x="610" y="112" width="550" height="4" fill="#087f72"/><text x="632.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="632.0" dy="0.0">Detector comparison</tspan></text><text x="632.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">median p95 TTFT (ms), log scale</text><text x="632.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="632.0" dy="0.0">The same prompts, schedule, model, and GPU were used for each detector.</tspan></text><rect x="632.0" y="225" width="12" height="12" fill="#2d6cdf"/><text x="650.0" y="235.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">queue depth 2</text><rect x="872.0" y="225" width="12" height="12" fill="#087f72"/><text x="890.0" y="235.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Request count</text><text x="632.0" y="270.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="632.0" dy="0.0">Realtime Peer B</tspan></text><rect x="780" y="256.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="780" y="256.0" width="294.0" height="12.0" fill="#2d6cdf"/><text x="1142.0" y="268.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">5,023 ms</text><rect x="780" y="273.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="780" y="273.0" width="216.3" height="12.0" fill="#087f72"/><text x="1142.0" y="285.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">527 ms</text><text x="632.0" y="348.0" fill="#15202b" font-size="11" font-weight="650"><tspan x="632.0" dy="0.0">Realtime Peer C</tspan></text><rect x="780" y="334.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="780" y="334.0" width="290.4" height="12.0" fill="#2d6cdf"/><text x="1142.0" y="346.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">4,519 ms</text><rect x="780" y="351.0" width="294" height="12.0" fill="#e1e7ed"/><rect x="780" y="351.0" width="219.0" height="12.0" fill="#087f72"/><text x="1142.0" y="363.0" fill="#15202b" font-size="9" font-weight="750" text-anchor="end">570 ms</text><text x="40.0" y="484.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package analysis or summary data. Units are shown in each panel.</text></svg>
