<svg xmlns="http://www.w3.org/2000/svg" width="650" height="918" viewBox="0 0 650 918" role="img" aria-labelledby="title desc"><title id="title">Request-concurrency priority tuning benchmark results</title><desc id="desc">Lower admission protected premium latency while standard traffic absorbed more queue time. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="650" height="918" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Request-concurrency priority tuning</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Lower admission protected premium latency while standard traffic</tspan><tspan x="40.0" dy="19.5">absorbed more queue time.</tspan></text><rect x="50" y="112" width="550" height="360" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="112" width="550" height="4" fill="#2d6cdf"/><text x="72.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Premium latency across request caps</tspan></text><text x="72.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">p95 TTFT (ms)</text><text x="72.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="72.0" dy="0.0">The lowest premium p95 TTFT occurred at 48 requests.</tspan></text><line x1="116" y1="417.0" x2="566" y2="417.0" stroke="#e1e7ed"/><text x="108.0" y="421.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">0.0 ms</text><line x1="116" y1="330.5" x2="566" y2="330.5" stroke="#e1e7ed"/><text x="108.0" y="334.5" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">493 ms</text><line x1="116" y1="244.0" x2="566" y2="244.0" stroke="#e1e7ed"/><text x="108.0" y="248.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">986 ms</text><text x="116.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">32</text><text x="228.5" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">48</text><text x="341.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">64</text><text x="453.5" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">96</text><text x="566.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="middle">128</text><polyline points="116.0,316.2 228.5,334.3 341.0,310.7 453.5,286.4 566.0,262.5" fill="none" stroke="#2d6cdf" stroke-width="3"/><circle cx="116.0" cy="316.2" r="4" fill="#2d6cdf"/><circle cx="228.5" cy="334.3" r="4" fill="#2d6cdf"/><circle cx="341.0" cy="310.7" r="4" fill="#2d6cdf"/><circle cx="453.5" cy="286.4" r="4" fill="#2d6cdf"/><circle cx="566.0" cy="262.5" r="4" fill="#2d6cdf"/><rect x="116" y="221" width="12" height="4" fill="#2d6cdf"/><text x="134.0" y="227.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Premium</text><rect x="50" y="492" width="550" height="360" fill="#ffffff" stroke="#cdd5df"/><rect x="50" y="492" width="550" height="4" fill="#087f72"/><text x="72.0" y="526.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="72.0" dy="0.0">Standard latency across request caps</tspan></text><text x="72.0" y="553.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">p95 TTFT (ms)</text><text x="72.0" y="577.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="72.0" dy="0.0">Standard latency fell as the cap admitted more work.</tspan></text><line x1="116" y1="797.0" x2="566" y2="797.0" stroke="#e1e7ed"/><text x="108.0" y="801.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">0.0 ms</text><line x1="116" y1="710.5" x2="566" y2="710.5" stroke="#e1e7ed"/><text x="108.0" y="714.5" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">7,099 ms</text><line x1="116" y1="624.0" x2="566" y2="624.0" stroke="#e1e7ed"/><text x="108.0" y="628.0" fill="#5f6c7b" font-si