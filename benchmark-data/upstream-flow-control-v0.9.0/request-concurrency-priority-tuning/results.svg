<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="538" viewBox="0 0 1200 538" role="img" aria-labelledby="title desc"><title id="title">Request-concurrency priority tuning benchmark results</title><desc id="desc">Lower admission protected premium latency while standard traffic absorbed more queue time. Each panel names its metric and unit.</desc><style>text{font-family:Inter,Arial,sans-serif;letter-spacing:0}</style><rect width="1200" height="538" fill="#f5f7f9"/><text x="40.0" y="50.0" fill="#15202b" font-size="30" font-weight="800" text-anchor="start">Request-concurrency priority tuning</text><text x="40.0" y="82.0" fill="#5f6c7b" font-size="15" font-weight="550"><tspan x="40.0" dy="0.0">Lower admission protected premium latency while standard traffic absorbed more queue time.</tspan></text><rect x="40" y="112" width="550" height="360" fill="#ffffff" stroke="#cdd5df"/><rect x="40" y="112" width="550" height="4" fill="#2d6cdf"/><text x="62.0" y="146.0" fill="#15202b" font-size="18" font-weight="750"><tspan x="62.0" dy="0.0">Premium latency across request caps</tspan></text><text x="62.0" y="173.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">p95 TTFT (ms)</text><text x="62.0" y="197.0" fill="#5f6c7b" font-size="11" font-weight="500"><tspan x="62.0" dy="0.0">The lowest premium p95 TTFT occurred at 48 requests.</tspan></text><line x1="106" y1="417.0" x2="556" y2="417.0" stroke="#e1e7ed"/><text x="98.0" y="421.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">0.0 ms</text><line x1="106" y1="330.5" x2="556" y2="330.5" stroke="#e1e7ed"/><text x="98.0" y="334.5" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">493 ms</text><line x1="106" y1="244.0" x2="556" y2="244.0" stroke="#e1e7ed"/><text x="98.0" y="248.0" fill="#5f6c7b" font-size="9" font-weight="550" text-anchor="end">986 ms</text><text x="106.0" y="439.0" fill="#5f6c7b" font-size="9" font-weight="600" text-anchor="middle">32</text><text x="218.5" 