<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">Reserved capacity is one pool gate; headroom is checked on every model replica</title>
  <desc id="desc">Incoming requests wait outside a shared model pool. Reserved capacity is the gate that decides whether a request may enter the pool. Inside the pool, the Endpoint Picker checks the load of each model replica against its headroom-adjusted boundary. Replicas below the boundary remain eligible; a replica at the boundary is filtered temporarily.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
    .ink { fill: #14202d; }
    .muted { fill: #5b6877; }
    .title { font-size: 32px; font-weight: 800; }
    .subtitle { font-size: 17px; }
    .label { font-size: 16px; font-weight: 800; }
    .small { font-size: 13px; font-weight: 650; }
    .level { font-size: 12px; font-weight: 850; }
    .question { font-size: 20px; font-weight: 800; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#738190"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d6cdf"/></marker>
  </defs>

  <rect width="1440" height="760" fill="#f4f7fa"/>
  <text x="48" y="55" class="ink title">One pool gate. One check per replica.</text>
  <text x="48" y="87" class="muted subtitle">The controls protect capacity at different levels of the serving path.</text>

  <!-- Incoming queue -->
  <text x="52" y="155" class="muted level">ENDPOINT PICKER QUEUE</text>
  <rect x="52" y="176" width="156" height="228" fill="#ffffff" stroke="#c9d3df" stroke-width="2"/>
  <circle cx="92" cy="218" r="13" fill="#2d6cdf"/><circle cx="132" cy="218" r="13" fill="#087f72"/><circle cx="172" cy="218" r="13" fill="#6550a5"/>
  <circle cx="92" cy="260" r="13" fill="#2d6cdf"/><circle cx="132" cy="260" r="13" fill="#087f72"/><circle cx="172" cy="260" r="13" fill="#6550a5"/>
  <circle cx="92" cy="302" r="13" fill="#2d6cdf"/><circle cx="132" cy="302" r="13" fill="#087f72"/><circle cx="172" cy="302" r="13" fill="#6550a5"/>
  <text x="130" y="354" class="ink label" text-anchor="middle">Waiting requests</text>
  <text x="130" y="379" class="muted small" text-anchor="middle">multiple priorities</text>

  <!-- Reserved capacity gate -->
  <line x1="208" y1="290" x2="252" y2="290" stroke="#738190" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="260" y="150" width="130" height="280" fill="#e9f7f4" stroke="#087f72" stroke-width="3"/>
  <rect x="280" y="190" width="90" height="14" fill="#087f72"/>
  <rect x="280" y="220" width="90" height="14" fill="#087f72"/>
  <rect x="280" y="250" width="90" height="14" fill="#087f72"/>
  <line x1="325" y1="282" x2="325" y2="338" stroke="#087f72" stroke-width="4"/>
  <circle cx="325" cy="355" r="10" fill="#087f72"/>
  <text x="325" y="388" fill="#087f72" class="label" text-anchor="middle">Reserved</text>
  <text x="325" y="410" fill="#087f72" class="label" text-anchor="middle">capacity</text>
  <text x="325" y="137" fill="#087f72" class="level" text-anchor="middle">POOL GATE</text>

  <!-- Shared model pool -->
  <rect x="430" y="124" width="958" height="334" fill="#ffffff" stroke="#087f72" stroke-width="3"/>
  <rect x="430" y="124" width="958" height="42" fill="#087f72"/>
  <text x="458" y="151" fill="#ffffff" class="level">SHARED MODEL POOL</text>

  <!-- Endpoint Picker selection -->
  <rect x="474" y="214" width="190" height="154" fill="#f4f7fa" stroke="#9aa8b6" stroke-width="2"/>
  <text x="569" y="253" class="ink label" text-anchor="middle">Endpoint Picker</text>
  <circle cx="535" cy="300" r="9" fill="#2d6cdf"/><circle cx="569" cy="300" r="9" fill="#2d6cdf"/><circle cx="603" cy="300" r="9" fill="#c56a00"/>
  <text x="569" y="337" class="muted small" text-anchor="middle">candidate replicas</text>

  <line x1="390" y1="290" x2="466" y2="290" stroke="#738190" stroke-width="3" marker-end="url(#arrow)"/>
  <line x1="664" y1="290" x2="730" y2="290" stroke="#2d6cdf" stroke-width="3" marker-end="url(#arrow-blue)"/>

  <!-- Per-replica headroom checks -->
  <text x="1042" y="196" fill="#2d6cdf" class="level" text-anchor="middle">HEADROOM CHECKED SEPARATELY ON EACH REPLICA</text>

  <rect x="748" y="218" width="176" height="170" fill="#eef4ff" stroke="#2d6cdf" stroke-width="2"/>
  <text x="836" y="249" class="ink label" text-anchor="middle">Replica A</text>
  <rect x="774" y="274" width="124" height="72" fill="#dce6f4"/>
  <rect x="774" y="310" width="124" height="36" fill="#2d6cdf"/>
  <line x1="766" y1="288" x2="906" y2="288" stroke="#14202d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="836" y="373" fill="#17663f" class="small" text-anchor="middle">ELIGIBLE</text>

  <rect x="958" y="218" width="176" height="170" fill="#eef4ff" stroke="#2d6cdf" stroke-width="2"/>
  <text x="1046" y="249" class="ink label" text-anchor="middle">Replica B</text>
  <rect x="984" y="274" width="124" height="72" fill="#dce6f4"/>
  <rect x="984" y="292" width="124" height="54" fill="#2d6cdf"/>
  <line x1="976" y1="288" x2="1116" y2="288" stroke="#14202d" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="1046" y="373" fill="#17663f" class="small" text-anchor="middle">ELIGIBLE</text>

  <rect x="1168" y="218" width="176" height="170" fill="#fff6ea" stroke="#c56a00" stroke-width="2"/>
  <text x="1256" y="249" class="ink label" text-anchor="middle">Replica C</text>
  <rect x="1194" y="274" width="124" height="72" fill="#f1dfc8"/>
  <rect x="1194" y="274" width="124" height="72" fill="#c56a00"/>
  <line x1="1186" y1="288" x2="1326" y2="288" stroke="#14202d" stroke-width="2" stroke-dasharray="5 4"/>
  <path d="M1237 303 L1275 341 M1275 303 L1237 341" stroke="#ffffff" stroke-width="5"/>
  <text x="1256" y="373" fill="#9a4f00" class="small" text-anchor="middle">FILTERED</text>

  <!-- Comparison -->
  <rect x="52" y="510" width="646" height="154" fill="#ffffff" stroke="#087f72" stroke-width="2"/>
  <rect x="52" y="510" width="12" height="154" fill="#087f72"/>
  <text x="88" y="545" fill="#087f72" class="level">SHARED POOL</text>
  <text x="88" y="583" class="ink question">May this request leave the queue?</text>
  <text x="88" y="618" class="muted label">Reserved capacity</text>

  <rect x="742" y="510" width="646" height="154" fill="#ffffff" stroke="#2d6cdf" stroke-width="2"/>
  <rect x="742" y="510" width="12" height="154" fill="#2d6cdf"/>
  <text x="778" y="545" fill="#2d6cdf" class="level">EACH MODEL REPLICA</text>
  <text x="778" y="583" class="ink question">May this replica receive the request?</text>
  <text x="778" y="618" class="muted label">Detector headroom</text>

  <rect x="52" y="694" width="1336" height="38" fill="#142538"/>
  <text x="720" y="719" fill="#ffffff" font-size="15px" font-weight="750" text-anchor="middle">When both are enabled: pool gate first → replica eligibility second</text>
</svg>
