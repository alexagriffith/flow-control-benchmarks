<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="426" viewBox="0 0 1280 426" role="img" aria-labelledby="title desc">
  <title id="title">Priority holdback and headroom answer different questions</title>
  <desc id="desc">Two aligned panels compare controls at different boundaries. Priority holdback compares pool saturation with a priority-band usage ceiling before dispatch from the Endpoint Picker queue. Headroom raises the request-concurrency detector threshold used to decide which individual model replicas remain eligible. When both are configured, priority holdback acts first at the priority-band queue boundary and headroom participates later in per-replica filtering.</desc>
  <style>
    text { font-family: Inter, "Red Hat Text", system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ink { fill:#14202d; }
    .muted { fill:#5b6877; }
    .eyebrow { font-size:12px; font-weight:850; letter-spacing:.65px; }
    .panel-title { font-size:21px; font-weight:820; }
    .question { font-size:17px; font-weight:780; }
    .box-title { font-size:14px; font-weight:820; }
    .body { font-size:13px; font-weight:620; }
    .code { font-size:11px; font-weight:760; }
    .outcome { font-size:13px; font-weight:800; }
  </style>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker>
  </defs>

  <rect width="1280" height="520" rx="10" fill="#f4f7fa"/>

  <rect x="28" y="24" width="600" height="378" rx="10" fill="#ffffff" stroke="#9bcfc5" stroke-width="2"/>
  <rect x="28" y="24" width="7" height="378" rx="3.5" fill="#087f72"/>
  <text x="58" y="52" class="eyebrow" fill="#087f72">POOL-WIDE ADMISSION</text>
  <text x="58" y="78" class="panel-title ink">Priority holdback</text>
  <text x="58" y="112" class="question ink">Can this priority band dispatch?</text>

  <rect x="58" y="142" width="154" height="126" rx="8" fill="#f8fafb" stroke="#c7d0da"/>
  <text x="135" y="170" text-anchor="middle" class="box-title ink">Signal</text>
  <text x="135" y="201" text-anchor="middle" class="body muted">pool saturation</text>
  <rect x="82" y="220" width="106" height="15" rx="7.5" fill="#d9e1e8"/>
  <rect x="82" y="220" width="66" height="15" rx="7.5" fill="#087f72"/>
  <line x1="212" y1="205" x2="242" y2="205" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <rect x="250" y="142" width="174" height="126" rx="8" fill="#eff9f6" stroke="#87c9b9"/>
  <text x="337" y="170" text-anchor="middle" class="box-title ink">Compare</text>
  <text x="337" y="199" text-anchor="middle" class="body muted">priority-band ceiling</text>
  <rect x="270" y="212" width="134" height="37" rx="5" fill="#ffffff" stroke="#b8dcd3"/>
  <text x="337" y="235" text-anchor="middle" class="code" fill="#087f72">maxUsagePercentage</text>
  <line x1="424" y1="205" x2="454" y2="205" stroke="#087f72" stroke-width="2.5" marker-end="url(#arrow-teal)"/>

  <rect x="462" y="142" width="136" height="126" rx="8" fill="#f8fafb" stroke="#c7d0da"/>
  <text x="530" y="170" text-anchor="middle" class="box-title ink">Outcome</text>
  <rect x="480" y="188" width="100" height="25" rx="5" fill="#eaf7f1" stroke="#87c9ab"/>
  <text x="530" y="205" text-anchor="middle" class="outcome" fill="#087f5b">dispatch</text>
  <rect x="480" y="222" width="100" height="25" rx="5" fill="#fff5e9" stroke="#e1ad73"/>
  <text x="530" y="239" text-anchor="middle" class="outcome" fill="#9a4f00">wait</text>

  <rect x="58" y="294" width="540" height="76" rx="8" fill="#eaf7f1"/>
  <text x="80" y="320" class="eyebrow" fill="#087f72">WHERE IT ACTS</text>
  <text x="80" y="347" class="body ink">Priority band · before dispatch from the EPP queue.</text>

  <rect x="652" y="24" width="600" height="378" rx="10" fill="#ffffff" stroke="#a8bfe9" stroke-width="2"/>
  <rect x="652" y="24" width="7" height="378" rx="3.5" fill="#2d6cdf"/>
  <text x="682" y="52" class="eyebrow" fill="#2d6cdf">PER-REPLICA FILTERING</text>
  <text x="682" y="78" class="panel-title ink">Headroom</text>
  <text x="682" y="112" class="question ink">Which replicas remain eligible?</text>

  <rect x="682" y="142" width="154" height="126" rx="8" fill="#f8fafb" stroke="#c7d0da"/>
  <text x="759" y="170" text-anchor="middle" class="box-title ink">Signal</text>
  <text x="759" y="198" text-anchor="middle" class="body muted">requests per replica</text>
  <rect x="706" y="220" width="106" height="15" rx="7.5" fill="#d9e1e8"/>
  <rect x="706" y="220" width="76" height="15" rx="7.5" fill="#2d6cdf"/>
  <line x1="836" y1="205" x2="866" y2="205" stroke="#2d6cdf" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="874" y="142" width="174" height="126" rx="8" fill="#eef4ff" stroke="#a8bfe9"/>
  <text x="961" y="170" text-anchor="middle" class="box-title ink">Compare</text>
  <text x="961" y="198" text-anchor="middle" class="body muted">detector threshold</text>
  <rect x="894" y="212" width="134" height="37" rx="5" fill="#ffffff" stroke="#b8c9ea"/>
  <text x="961" y="228" text-anchor="middle" class="code" fill="#2d6cdf">maxConcurrency</text>
  <text x="961" y="241" text-anchor="middle" class="code" fill="#2d6cdf">× (1 + headroom)</text>
  <line x1="1048" y1="205" x2="1078" y2="205" stroke="#2d6cdf" stroke-width="2.5" marker-end="url(#arrow-blue)"/>

  <rect x="1086" y="142" width="136" height="126" rx="8" fill="#f8fafb" stroke="#c7d0da"/>
  <text x="1154" y="170" text-anchor="middle" class="box-title ink">Outcome</text>
  <rect x="1104" y="188" width="100" height="25" rx="5" fill="#eaf7f1" stroke="#87c9ab"/>
  <text x="1154" y="205" text-anchor="middle" class="outcome" fill="#087f5b">eligible</text>
  <rect x="1104" y="222" width="100" height="25" rx="5" fill="#fff5e9" stroke="#e1ad73"/>
  <text x="1154" y="239" text-anchor="middle" class="outcome" fill="#9a4f00">filtered</text>

  <rect x="682" y="294" width="540" height="76" rx="8" fill="#eef4ff"/>
  <text x="704" y="320" class="eyebrow" fill="#2d6cdf">WHERE IT ACTS</text>
  <text x="704" y="347" class="body ink">Individual replica · during endpoint filtering.</text>

</svg>
