<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="700" viewBox="0 0 1280 700" role="img" aria-labelledby="title desc">
  <title id="title">Reserved capacity and saturation-detector headroom use different flows</title>
  <desc id="desc">Reserved capacity compares pool saturation with a priority-specific ceiling to decide whether a request remains queued or dispatches. Headroom belongs to the selected saturation detector and relaxes each model replica's filtering boundary. A utilization detector measures waiting queue and KV cache pressure; a concurrency detector measures in-flight requests or tokens.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif;letter-spacing:0}.ink{fill:#14202d}.muted{fill:#5b6877}.title{font-size:30px;font-weight:800}.sub{font-size:16px}.label{font-size:16px;font-weight:800}.small{font-size:13px;font-weight:650}.tiny{font-size:11px;font-weight:850}.question{font-size:20px;font-weight:800}
  </style>
  <defs>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f72"/></marker>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d6cdf"/></marker>
    <marker id="gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#708090"/></marker>
  </defs>
  <rect width="1280" height="700" fill="#f4f7fa"/>
  <text x="40" y="48" class="ink title">Two controls. Two different questions.</text>
  <text x="40" y="78" class="muted sub">Each flow is useful on its own; the final strip shows how they compose.</text>

  <!-- Reserved capacity flow -->
  <rect x="40" y="112" width="580" height="430" fill="#fff" stroke="#087f72" stroke-width="3"/>
  <rect x="40" y="112" width="580" height="48" fill="#087f72"/>
  <text x="64" y="143" fill="#fff" class="label">RESERVED CAPACITY · POOL ADMISSION</text>
  <text x="68" y="198" class="question ink">May this request leave the queue?</text>

  <rect x="68" y="236" width="128" height="150" fill="#f4f7fa" stroke="#bdc8d3" stroke-width="2"/>
  <text x="132" y="262" class="label ink" text-anchor="middle">Queue</text>
  <circle cx="98" cy="302" r="10" fill="#2d6cdf"/><circle cx="132" cy="302" r="10" fill="#087f72"/><circle cx="166" cy="302" r="10" fill="#6550a5"/>
  <circle cx="98" cy="338" r="10" fill="#2d6cdf"/><circle cx="132" cy="338" r="10" fill="#087f72"/><circle cx="166" cy="338" r="10" fill="#6550a5"/>
  <text x="132" y="370" class="muted tiny" text-anchor="middle">BY PRIORITY</text>

  <line x1="196" y1="312" x2="242" y2="312" stroke="#087f72" stroke-width="3" marker-end="url(#teal)"/>

  <rect x="260" y="224" width="208" height="176" fill="#e9f7f4" stroke="#087f72" stroke-width="2"/>
  <text x="364" y="252" class="label ink" text-anchor="middle">Usage-limit policy</text>
  <text x="364" y="281" class="muted small" text-anchor="middle">pool saturation</text>
  <rect x="286" y="295" width="156" height="24" fill="#d5dee7"/>
  <rect x="286" y="295" width="98" height="24" fill="#087f72"/>
  <line x1="398" y1="286" x2="398" y2="328" stroke="#14202d" stroke-width="3"/>
  <text x="398" y="347" class="muted tiny" text-anchor="middle">THIS PRIORITY'S CEILING</text>
  <text x="364" y="377" fill="#087f72" class="small" text-anchor="middle">compare saturation to ceiling</text>

  <line x1="468" y1="312" x2="510" y2="312" stroke="#087f72" stroke-width="3" marker-end="url(#teal)"/>
  <rect x="524" y="246" width="70" height="52" fill="#edf8f5" stroke="#087f72"/>
  <text x="559" y="267" fill="#17663f" class="tiny" text-anchor="middle">BELOW</text><text x="559" y="285" class="small ink" text-anchor="middle">dispatch</text>
  <rect x="524" y="326" width="70" height="52" fill="#fff5e9" stroke="#c56a00"/>
  <text x="559" y="347" fill="#9a4f00" class="tiny" text-anchor="middle">AT LIMIT</text><text x="559" y="365" class="small ink" text-anchor="middle">wait</text>

  <rect x="68" y="430" width="526" height="78" fill="#e9f7f4"/>
  <text x="90" y="457" fill="#087f72" class="tiny">WHAT CHANGES</text>
  <text x="90" y="486" class="label ink">Lower priorities can stop dispatching sooner.</text>

  <!-- Headroom flow -->
  <rect x="660" y="112" width="580" height="430" fill="#fff" stroke="#2d6cdf" stroke-width="3"/>
  <rect x="660" y="112" width="580" height="48" fill="#2d6cdf"/>
  <text x="684" y="143" fill="#fff" class="label">SATURATION-DETECTOR HEADROOM · REPLICA ELIGIBILITY</text>
  <text x="688" y="198" class="question ink">May this replica receive the request?</text>

  <rect x="688" y="224" width="190" height="176" fill="#eef4ff" stroke="#2d6cdf" stroke-width="2"/>
  <text x="783" y="250" class="label ink" text-anchor="middle">Selected detector</text>
  <text x="783" y="274" class="muted small" text-anchor="middle">utilization: queue + KV cache</text>
  <text x="783" y="294" class="muted small" text-anchor="middle">concurrency: requests or tokens</text>
  <rect x="716" y="316" width="134" height="22" fill="#d5dee7"/>
  <rect x="716" y="316" width="83" height="22" fill="#2d6cdf"/>
  <line x1="814" y1="307" x2="814" y2="347" stroke="#14202d" stroke-width="3"/>
  <text x="783" y="365" class="muted tiny" text-anchor="middle">THRESHOLD + HEADROOM</text>
  <text x="783" y="386" fill="#2d6cdf" class="small" text-anchor="middle">check each replica</text>

  <line x1="878" y1="312" x2="916" y2="312" stroke="#2d6cdf" stroke-width="3" marker-end="url(#blue)"/>

  <rect x="932" y="226" width="82" height="166" fill="#eef4ff" stroke="#2d6cdf"/>
  <text x="973" y="252" class="small ink" text-anchor="middle">A</text><rect x="951" y="276" width="44" height="62" fill="#d8e1ec"/><rect x="951" y="310" width="44" height="28" fill="#2d6cdf"/><line x1="945" y1="294" x2="1001" y2="294" stroke="#14202d" stroke-dasharray="4 3"/><text x="973" y="370" fill="#17663f" class="tiny" text-anchor="middle">ELIGIBLE</text>
  <rect x="1024" y="226" width="82" height="166" fill="#eef4ff" stroke="#2d6cdf"/>
  <text x="1065" y="252" class="small ink" text-anchor="middle">B</text><rect x="1043" y="276" width="44" height="62" fill="#d8e1ec"/><rect x="1043" y="300" width="44" height="38" fill="#2d6cdf"/><line x1="1037" y1="294" x2="1093" y2="294" stroke="#14202d" stroke-dasharray="4 3"/><text x="1065" y="370" fill="#17663f" class="tiny" text-anchor="middle">ELIGIBLE</text>
  <rect x="1116" y="226" width="82" height="166" fill="#fff5e9" stroke="#c56a00"/>
  <text x="1157" y="252" class="small ink" text-anchor="middle">C</text><rect x="1135" y="276" width="44" height="62" fill="#c56a00"/><line x1="1129" y1="294" x2="1185" y2="294" stroke="#14202d" stroke-dasharray="4 3"/><path d="M1142 301 L1172 331 M1172 301 L1142 331" stroke="#fff" stroke-width="4"/><text x="1157" y="370" fill="#9a4f00" class="tiny" text-anchor="middle">FILTERED</text>

  <rect x="688" y="430" width="510" height="78" fill="#eef4ff"/>
  <text x="710" y="457" fill="#2d6cdf" class="tiny">WHAT CHANGES</text>
  <text x="710" y="486" class="label ink">A replica may burst farther before filtering.</text>

  <!-- Composition -->
  <rect x="40" y="576" width="1200" height="84" fill="#14202d"/>
  <circle cx="92" cy="618" r="20" fill="#087f72"/><text x="92" y="625" fill="#fff" class="label" text-anchor="middle">1</text>
  <text x="128" y="613" fill="#fff" class="label">May this priority dispatch?</text><text x="128" y="637" fill="#b9c5d0" class="small">reserved capacity</text>
  <line x1="448" y1="618" x2="526" y2="618" stroke="#708090" stroke-width="3" marker-end="url(#gray)"/>
  <circle cx="576" cy="618" r="20" fill="#2d6cdf"/><text x="576" y="625" fill="#fff" class="label" text-anchor="middle">2</text>
  <text x="612" y="613" fill="#fff" class="label">Which replica may receive it?</text><text x="612" y="637" fill="#b9c5d0" class="small">selected detector + headroom</text>
  <text x="1196" y="625" fill="#b9c5d0" class="tiny" text-anchor="end">WHEN BOTH ARE ENABLED</text>
</svg>
