<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" role="img" aria-label="Premium p95 TTFT gate off versus on across output lengths, with the 128-token arm restated using per-repeat percentiles"><rect width="1200" height="340" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#151515" text-anchor="start">Service-tier TTFT by output length</text><text x="20" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Only the 128-token arm is restated as a headline here. The older 64/512 pooled cells remain provenance until rechecked.</text><line x1="70" y1="262.0" x2="1170" y2="262.0" stroke="#eeeeee"/><text x="62" y="266.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">100</text><line x1="70" y1="215.9" x2="1170" y2="215.9" stroke="#eeeeee"/><text x="62" y="219.8695955165101" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">300</text><line x1="70" y1="165.3" x2="1170" y2="165.3" stroke="#eeeeee"/><text x="62" y="169.31513419875984" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">1,000</text><line x1="70" y1="119.2" x2="1170" y2="119.2" stroke="#eeeeee"/><text x="62" y="123.18472971526992" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">3,000</text><line x1="70" y1="215.9" x2="1170" y2="215.9" stroke="#151515" stroke-dasharray="5 4" opacity=".45"/><text x="1166" y="207.8695955165101" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,s