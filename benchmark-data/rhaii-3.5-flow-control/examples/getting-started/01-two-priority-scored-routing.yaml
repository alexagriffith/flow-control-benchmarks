# Getting started: two priorities with scored multi-replica routing.
#
# Choose this when two workloads share the same model and one needs stronger
# latency protection. Flow control decides when work may leave the queue.
# Queue scoring then selects the eligible replica with less queued work.
#
# The campaign measured maxConcurrency 128 and 10% detector headroom for
# GPT-OSS 20B on one H100 per replica. Recalibrate both values for your model.
apiVersion: v1
kind: Namespace
metadata:
  name: flow-control-demo
  labels:
    # The Gateway below accepts routes from namespaces with this label.
    inference-gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flow-control-gateway
  namespace: redhat-ods-applications
spec:
  gatewayClassName: istio
  infrastructure:
    labels:
      serving.kserve.io/gateway: kserve-ingress-gateway
    parametersRef:
      group: ""
      kind: ConfigMap
      # Red Hat AI Inference installs this Gateway configuration.
      name: inference-gateway-config
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              inference-gateway-access: "true"
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: flow-control-model
  namespace: flow-control-demo
spec:
  model:
    name: openai/gpt-oss-20b
    uri: hf://openai/gpt-oss-20b
  parallelism:
    tensor: 1
  # Two replicas make endpoint scoring meaningful.
  replicas: 2
  router:
    gateway:
      refs:
        - name: flow-control-gateway
          namespace: redhat-ods-applications
          sectionName: http
    route: {}
    scheduler:
      config:
        inline:
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          featureGates:
            - flowControl
          flowControl:
            # Stop an unavailable service from building an unlimited queue.
            defaultRequestTTL: 300s
            maxBytes: 1073741824
            priorityBands:
              # Protected work is dispatched before standard work.
              - priority: 100
                fairnessPolicyRef: round-robin-fairness-policy
                orderingPolicyRef: fcfs-ordering-policy
              # Standard work still makes progress whenever capacity is free.
              - priority: 0
                fairnessPolicyRef: round-robin-fairness-policy
                orderingPolicyRef: fcfs-ordering-policy
            saturationDetector:
              pluginRef: concurrency-detector
            usageLimitPolicyPluginRef: priority-holdback
          plugins:
            # Read objective and fairness headers from OpenAI requests.
            - type: openai-parser
            # Count active requests so flow control knows when to queue work.
            - name: inflight-load
              type: inflight-load-producer
              parameters:
                addEstimatedOutputTokens: false
            - name: concurrency-detector
              type: concurrency-detector
              parameters:
                concurrencyMode: requests
                inFlightLoadProducerName: inflight-load
                maxConcurrency: 128
                # Allow a small scheduling buffer around the measured limit.
                headroom: 0.1
            # Give different callers at the same priority alternating turns.
            - name: round-robin-fairness-policy
              type: round-robin-fairness-policy
            - name: fcfs-ordering-policy
              type: fcfs-ordering-policy
            # Standard work pauses at 75% saturation, leaving 25% available
            # for protected work. Both classes may use idle capacity below it.
            - name: priority-holdback
              type: priority-holdback-policy
              parameters:
                domain: rank
                shape: linear
                minCeiling: 0.75
                maxCeiling: 1
            # Prefer the eligible replica with less queued model-server work.
            - name: queue-scorer
              type: queue-scorer
            # Select the eligible replica with the highest combined score.
            - name: max-score-picker
              type: max-score-picker
            # Read model-server metrics over the secured Red Hat AI Inference path.
            - type: metrics-data-source
              parameters:
                scheme: https
          requestHandler:
            parsers:
              - pluginRef: openai-parser
          schedulingProfiles:
            - name: default
              plugins:
                - pluginRef: concurrency-detector
                - pluginRef: queue-scorer
                - pluginRef: max-score-picker
      template:
        containers:
          - name: main
            image: quay.io/opendatahub/odh-llm-d-router-endpoint-picker@sha256:275037b7611b2d51faedae4437321014ebac349920c0440a2afb688e82430585
            command:
              - /app/epp
              - --pool-name
              - flow-control-model-inference-pool
              - --pool-namespace
              - flow-control-demo
              - --zap-encoder
              - json
              - --grpc-port
              - "9002"
              - --grpc-health-port
              - "9003"
              - --enable-cert-reload=true
              - --secure-serving=true
              - --cert-path=/var/run/kserve/tls
              - --allow-experimental-plugins
  storageInitializer:
    enabled: true
  template:
    containers:
      - name: main
        env:
          - name: VLLM_ADDITIONAL_ARGS
            value: >-
              --max-model-len 32768 --max-num-batched-tokens 8192
              --max-num-seqs 128 --gpu-memory-utilization 0.90
              --no-enable-prefix-caching
          - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
            value: "120"
        resources:
          requests:
            cpu: "8"
            memory: 64Gi
            nvidia.com/gpu: "1"
          limits:
            cpu: "16"
            memory: 128Gi
            nvidia.com/gpu: "1"
---
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  # Send this name in x-llm-d-inference-objective for protected work.
  name: protected
  namespace: flow-control-demo
spec:
  priority: 100
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: flow-control-model-inference-pool
---
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  # Send this name for ordinary work that may wait behind protected work.
  name: standard
  namespace: flow-control-demo
spec:
  priority: 0
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: flow-control-model-inference-pool
