# Benchmark reproduction: prefill/decode flow control with hybrid admission.
# This preserves the selected policy and scored P/D routing graph.
apiVersion: v1
kind: Namespace
metadata:
  name: flow-control-pd-demo
  labels:
    inference-gateway-access: "true"
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: flow-control-pd-gateway
  namespace: redhat-ods-applications
spec:
  gatewayClassName: istio
  infrastructure:
    labels:
      serving.kserve.io/gateway: kserve-ingress-gateway
    parametersRef:
      group: ""
      kind: ConfigMap
      name: inference-gateway-config
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              inference-gateway-access: "true"
---
apiVersion: serving.kserve.io/v1alpha2
kind: LLMInferenceService
metadata:
  name: flow-control-pd-model
  namespace: flow-control-pd-demo
spec:
  model:
    name: openai/gpt-oss-20b
    uri: hf://openai/gpt-oss-20b:6cee5e81ee83917806bbde320786a8fb61efebee
  replicas: 1
  parallelism:
    tensor: 1
  prefill:
    replicas: 1
    parallelism:
      tensor: 1
    template:
      containers:
        - name: main
          env: &worker-env
            - name: VLLM_NIXL_SIDE_CHANNEL_HOST
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: VLLM_HTTP_TIMEOUT_KEEP_ALIVE
              value: "120"
            - name: VLLM_ADDITIONAL_ARGS
              value: >-
                --max-model-len 32768 --max-num-batched-tokens 8192
                --max-num-seqs 128 --gpu-memory-utilization 0.90
                --no-enable-prefix-caching --block-size 128
                --no-disable-hybrid-kv-cache-manager
                --kv-transfer-config
                {"kv_connector":"NixlConnector","kv_role":"kv_both","kv_load_failure_policy":"fail"}
          resources: &worker-resources
            requests:
              cpu: "8"
              memory: 64Gi
              nvidia.com/gpu: "1"
            limits:
              cpu: "16"
              memory: 128Gi
              nvidia.com/gpu: "1"
      nodeSelector:
        nvidia.com/gpu.accelerator: h100
      # The accepted run placed prefill and decode on one node.
      affinity: &same-node-affinity
        podAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: flow-control-pd-model
              topologyKey: kubernetes.io/hostname
  router:
    gateway:
      refs:
        - name: flow-control-pd-gateway
          namespace: redhat-ods-applications
          sectionName: http
    route: {}
    scheduler:
      config:
        inline:
          apiVersion: llm-d.ai/v1alpha1
          kind: EndpointPickerConfig
          featureGates:
            - flowControl
          plugins:
            - type: openai-parser
            # Track reusable prompt prefixes for prefill endpoint selection.
            - type: approx-prefix-cache-producer
              parameters:
                maxPrefixTokensToMatch: 16384
                lruCapacityPerServer: 31250
            - type: queue-scorer
            - type: prefill-filter
            - type: decode-filter
            - type: max-score-picker
            # This test always sends prefill and decode to separate workers.
            - type: always-disagg-pd-decider
            - type: disagg-profile-handler
              parameters:
                deciders:
                  prefill: always-disagg-pd-decider
            - name: inflight-load
              type: inflight-load-producer
              parameters:
                # Request count covers long generations without trusting a declared output size.
                addEstimatedOutputTokens: false
            - name: concurrency-detector
              type: concurrency-detector
              parameters:
                # Request count detects decode pressure; token count detects prefill pressure.
                concurrencyMode: hybrid
                inFlightLoadProducerName: inflight-load
                maxConcurrency: 64
                maxTokenConcurrency: 80000
                # Allow a 10% scheduling buffer around the measured limits.
                headroom: 0.1
            - name: round-robin-fairness-policy
              type: round-robin-fairness-policy
            - name: fcfs-ordering-policy
              type: fcfs-ordering-policy
            # Lower-priority work pauses at 50% saturation to protect higher priorities.
            - name: priority-holdback-050
              type: priority-holdback-policy
              parameters:
                domain: rank
                shape: linear
                minCeiling: 0.5
                maxCeiling: 1
            - type: metrics-data-source
              parameters:
                scheme: https
          requestHandler:
            parsers:
              - pluginRef: openai-parser
          schedulingProfiles:
            - name: prefill
              plugins:
                - pluginRef: prefill-filter
                - pluginRef: queue-scorer
                - pluginRef: max-score-picker
            - name: decode
              plugins:
                - pluginRef: decode-filter
                - pluginRef: queue-scorer
                - pluginRef: max-score-picker
          flowControl:
            defaultRequestTTL: 90s
            noEndpointRequestTTL: 30s
            maxRequests: 1024
            maxBytes: 1073741824
            priorityBands:
              - priority: 100
                fairnessPolicyRef: round-robin-fairness-policy
                orderingPolicyRef: fcfs-ordering-policy
              - priority: 0
                fairnessPolicyRef: round-robin-fairness-policy
                orderingPolicyRef: fcfs-ordering-policy
              - priority: -10
                fairnessPolicyRef: round-robin-fairness-policy
                orderingPolicyRef: fcfs-ordering-policy
            saturationDetector:
              pluginRef: concurrency-detector
            usageLimitPolicyPluginRef: priority-holdback-050
            defaultPriorityBand:
              fairnessPolicyRef: round-robin-fairness-policy
              orderingPolicyRef: fcfs-ordering-policy
            defaultNegativePriorityBand:
              fairnessPolicyRef: round-robin-fairness-policy
              orderingPolicyRef: fcfs-ordering-policy
      template:
        containers:
          - name: main
            image: quay.io/opendatahub/odh-llm-d-router-endpoint-picker@sha256:05e5510b46136f7d02eaa602cd1223ae77c2d67e807d4222324215d74280670d
            command:
              - /app/epp
              - --pool-name
              - flow-control-pd-model-inference-pool
              - --pool-namespace
              - flow-control-pd-demo
              - --zap-encoder
              - json
              - --grpc-port
              - "9002"
              - --grpc-health-port
              - "9003"
              - --enable-cert-reload=true
              - --secure-serving=true
              - --cert-path=/var/run/kserve/tls
              - --allow-experimental-plugins
  storageInitializer:
    enabled: true
  template:
    containers:
      - name: main
        env: *worker-env
        resources: *worker-resources
    nodeSelector:
      nvidia.com/gpu.accelerator: h100
    affinity: *same-node-affinity
---
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  name: pd-protected
  namespace: flow-control-pd-demo
spec:
  priority: 100
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: flow-control-pd-model-inference-pool
---
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  name: standard
  namespace: flow-control-pd-demo
spec:
  priority: 0
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: flow-control-pd-model-inference-pool
---
apiVersion: llm-d.ai/v1alpha2
kind: InferenceObjective
metadata:
  name: retryable
  namespace: flow-control-pd-demo
spec:
  priority: -10
  poolRef:
    group: inference.networking.k8s.io
    kind: InferencePool
    name: flow-control-pd-model-inference-pool
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flow-control-pd-endpoint-picker
  namespace: flow-control-pd-demo
  labels:
    release: llmd
spec:
  endpoints:
    - bearerTokenFile: /var/run/secrets/kubernetes.io/serviceaccount/token
      interval: 5s
      path: /metrics
      port: metrics
      scheme: http
      scrapeTimeout: 4s
  namespaceSelector:
    matchNames:
      - flow-control-pd-demo
  selector:
    matchLabels:
      app.kubernetes.io/component: llminferenceservice-router-scheduler
      app.kubernetes.io/name: flow-control-pd-model
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: flow-control-pd-vllm
  namespace: flow-control-pd-demo
  labels:
    release: llmd
spec:
  endpoints:
    - interval: 5s
      path: /metrics
      port: https
      scheme: https
      scrapeTimeout: 4s
      tlsConfig:
        ca:
          secret:
            key: ca.crt
            name: flow-control-pd-model-kserve-self-signed-certs
        serverName: flow-control-pd-model-kserve-workload-svc.flow-control-pd-demo.svc
  namespaceSelector:
    matchNames:
      - flow-control-pd-demo
  selector:
    matchLabels:
      app.kubernetes.io/component: llminferenceservice-workload
      app.kubernetes.io/name: flow-control-pd-model
