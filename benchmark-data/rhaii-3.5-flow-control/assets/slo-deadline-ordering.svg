<svg xmlns="http://www.w3.org/2000/svg" width="900" height="286" viewBox="0 0 900 286" role="img" aria-labelledby="title desc" style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: #ffffff;">
  <title id="title">Requests meeting their service-level objective deadline</title>
  <desc id="desc">A compact before-and-after chart compares median deadline goodput from three accepted matched runs. Gray represents FCFS and green represents SLO ordering. SLO ordering increases the fraction of requests meeting the 250 millisecond TTFT objective from 41.4 to 72.2 percent and the 500 millisecond TTFT objective from 70.4 to 90.6 percent. The displayed horizontal axis begins at 30 percent.</desc>

  <rect width="900" height="286" fill="#ffffff"/>

  <line x1="380" x2="398" y1="18" y2="18" stroke="#62666b" stroke-width="4" stroke-linecap="round"/>
  <text x="405" y="22" fill="#151515" font-size="11.5" font-weight="700">FCFS</text>
  <line x1="500" x2="518" y1="18" y2="18" stroke="#087f5b" stroke-width="4" stroke-linecap="round"/>
  <text x="525" y="22" fill="#151515" font-size="11.5" font-weight="700">SLO ordering</text>

  <line x1="140" x2="870" y1="90" y2="90" stroke="#dedede"/>
  <line x1="140" x2="870" y1="170" y2="170" stroke="#dedede"/>
  <line x1="140" x2="140" y1="42" y2="220" stroke="#9aa0a6" stroke-width="1.25"/>
  <line x1="140" x2="870" y1="220" y2="220" stroke="#9aa0a6" stroke-width="1.25"/>

  <text transform="translate(16,132) rotate(-90)" text-anchor="middle" fill="#62666b" font-size="12" font-weight="750">TTFT objective</text>
  <line x1="132" x2="140" y1="90" y2="90" stroke="#9aa0a6" stroke-width="1.25"/>
  <line x1="132" x2="140" y1="170" y2="170" stroke="#9aa0a6" stroke-width="1.25"/>
  <text x="122" y="94" text-anchor="end" fill="#151515" font-size="11.5" font-weight="650">250 ms</text>
  <text x="122" y="174" text-anchor="end" fill="#151515" font-size="11.5" font-weight="650">500 ms</text>

  <line x1="259" x2="580" y1="90" y2="90" stroke="#ffffff" stroke-width="7"/>
  <line x1="259" x2="580" y1="90" y2="90" stroke="#9aa0a6" stroke-width="3"/>
  <circle cx="259" cy="90" r="7" fill="#ffffff" stroke="#62666b" stroke-width="3"/>
  <circle cx="580" cy="90" r="7" fill="#ffffff" stroke="#087f5b" stroke-width="3"/>
  <text x="259" y="112" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="850">41.4%</text>
  <text x="580" y="112" text-anchor="middle" fill="#087f5b" font-size="11.5" font-weight="850">72.2%</text>

  <line x1="561" x2="772" y1="170" y2="170" stroke="#ffffff" stroke-width="7"/>
  <line x1="561" x2="772" y1="170" y2="170" stroke="#9aa0a6" stroke-width="3"/>
  <circle cx="561" cy="170" r="7" fill="#ffffff" stroke="#62666b" stroke-width="3"/>
  <circle cx="772" cy="170" r="7" fill="#ffffff" stroke="#087f5b" stroke-width="3"/>
  <text x="561" y="192" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="850">70.4%</text>
  <text x="772" y="192" text-anchor="middle" fill="#087f5b" font-size="11.5" font-weight="850">90.6%</text>

  <line x1="140" x2="140" y1="220" y2="228" stroke="#9aa0a6"/>
  <line x1="349" x2="349" y1="220" y2="228" stroke="#9aa0a6"/>
  <line x1="557" x2="557" y1="220" y2="228" stroke="#9aa0a6"/>
  <line x1="766" x2="766" y1="220" y2="228" stroke="#9aa0a6"/>
  <line x1="870" x2="870" y1="220" y2="228" stroke="#9aa0a6"/>
  <text x="140" y="246" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="650">30%</text>
  <text x="349" y="246" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="650">50%</text>
  <text x="557" y="246" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="650">70%</text>
  <text x="766" y="246" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="650">90%</text>
  <text x="870" y="246" text-anchor="middle" fill="#62666b" font-size="11.5" font-weight="650">100%</text>
  <text x="505" y="276" text-anchor="middle" fill="#62666b" font-size="12" font-weight="750">Requests meeting objective</text>
</svg>
