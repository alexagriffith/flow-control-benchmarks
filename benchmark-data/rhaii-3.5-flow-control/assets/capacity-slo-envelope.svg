<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
  <title id="title">The latency objective selected 40.6 requests per second as the operating point</title>
  <desc id="desc">A logarithmic line chart plots p95 time to first token at four request rates. The 30.4 and 40.6 request-per-second points remain below the 250 millisecond objective. The selected 40.6 request-per-second point measures 155 milliseconds. Latency rises to 6,273 milliseconds at 50.7 requests per second and 28,900 milliseconds at 55.8 requests per second.</desc>
  <style>
    text { font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    .ink { fill: #151515; }
    .muted { fill: #596773; }
    .grid { stroke: #d8dfe5; stroke-width: 1; }
  </style>

  <rect width="1200" height="480" fill="#ffffff"/>

  <g transform="translate(0 -180)">
  <rect x="160" y="230" width="920" height="285" fill="#f4fbf8"/>

  <line x1="160" y1="565" x2="1080" y2="565" class="grid"/>
  <text x="146" y="570" class="muted" font-size="13" text-anchor="end">100 ms</text>

  <line x1="160" y1="511" x2="1080" y2="511" stroke="#087f72" stroke-width="2" stroke-dasharray="7 6"/>
  <rect x="162" y="482" width="172" height="24" rx="12" fill="#ffffff" stroke="#087f72"/>
  <text x="248" y="499" fill="#075f55" font-size="12" font-weight="700" text-anchor="middle">250 ms TTFT objective</text>

  <line x1="160" y1="430" x2="1080" y2="430" class="grid"/>
  <text x="146" y="435" class="muted" font-size="13" text-anchor="end">1,000 ms</text>

  <line x1="160" y1="295" x2="1080" y2="295" class="grid"/>
  <text x="146" y="300" class="muted" font-size="13" text-anchor="end">10,000 ms</text>

  <line x1="160" y1="230" x2="1080" y2="230" class="grid"/>
  <text x="146" y="235" class="muted" font-size="13" text-anchor="end">30,000 ms</text>

  <text x="48" y="214" class="muted" font-size="13" font-weight="650">p95 TTFT · logarithmic scale</text>

  <line x1="160" y1="565" x2="1080" y2="565" stroke="#9aa8b3" stroke-width="1.5"/>
  <polyline points="234,552 546,539 856,322 1013,232" fill="none" stroke="#2d6cdf" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

  <circle cx="234" cy="552" r="7" fill="#2d6cdf" stroke="#ffffff" stroke-width="3"/>
  <circle cx="546" cy="539" r="11" fill="#087f72" stroke="#ffffff" stroke-width="4"/>
  <circle cx="856" cy="322" r="8" fill="#c45a00" stroke="#ffffff" stroke-width="3"/>
  <circle cx="1013" cy="232" r="8" fill="#a30000" stroke="#ffffff" stroke-width="3"/>

  <text x="214" y="530" fill="#2d6cdf" font-size="14" font-weight="700" text-anchor="end">124 ms</text>

  <line x1="546" y1="527" x2="546" y2="474" stroke="#087f72" stroke-width="2"/>
  <rect x="438" y="420" width="216" height="54" rx="7" fill="#ffffff" stroke="#087f72" stroke-width="2"/>
  <text x="546" y="443" fill="#075f55" font-size="13" font-weight="750" text-anchor="middle">SELECTED OPERATING POINT</text>
  <text x="546" y="463" class="ink" font-size="15" font-weight="700" text-anchor="middle">40.6 RPS · 155 ms</text>

  <line x1="864" y1="329" x2="876" y2="341" stroke="#c45a00" stroke-width="2"/>
  <text x="884" y="354" fill="#9b4700" font-size="14" font-weight="750">50.7 RPS · 6,273 ms</text>
  <text x="884" y="374" class="muted" font-size="13">Queueing boundary</text>

  <line x1="1005" y1="224" x2="988" y2="212" stroke="#a30000" stroke-width="2"/>
  <text x="978" y="202" fill="#8f0000" font-size="14" font-weight="750" text-anchor="end">55.8 RPS · 28,900 ms</text>
  <text x="978" y="220" class="muted" font-size="13" text-anchor="end">Outside the objective</text>

  <line x1="234" y1="565" x2="234" y2="573" stroke="#9aa8b3"/>
  <line x1="546" y1="565" x2="546" y2="573" stroke="#9aa8b3"/>
  <line x1="856" y1="565" x2="856" y2="573" stroke="#9aa8b3"/>
  <line x1="1013" y1="565" x2="1013" y2="573" stroke="#9aa8b3"/>
  <text x="234" y="594" class="muted" font-size="13" text-anchor="middle">30.4</text>
  <text x="546" y="594" fill="#075f55" font-size="13" font-weight="750" text-anchor="middle">40.6</text>
  <text x="856" y="594" fill="#9b4700" font-size="13" font-weight="700" text-anchor="middle">50.7</text>
  <text x="1013" y="594" fill="#8f0000" font-size="13" font-weight="700" text-anchor="middle">55.8</text>
  <text x="620" y="628" class="muted" font-size="14" font-weight="650" text-anchor="middle">Requests per second</text>
  </g>
</svg>
