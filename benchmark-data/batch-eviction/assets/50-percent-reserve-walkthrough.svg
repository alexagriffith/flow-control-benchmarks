<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
  <title id="title">Decision tree for a 32-request realtime burst with 50 percent reserved capacity</title>
  <desc id="desc">Batch traffic is capped at 24 of the Endpoint Picker's 48-request budget. When 32 realtime requests arrive, 24 enter and up to 8 wait. If eviction is disabled, they wait for natural batch completion. If eviction is enabled, Endpoint Picker requests that eligible batch work stop. Realtime enters after the stream releases capacity and batch retries later.</desc>
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto" markerUnits="userSpaceOnUse"><path d="M0 0L9 4.5L0 9Z" fill="#697480"/></marker>
  </defs>
  <style>
    text{font-family:Inter,"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif}
    .ink{fill:#15202b}.muted{fill:#5e6975}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.4px}
    .title{font-size:19px;font-weight:850}.node{font-size:13px;font-weight:800}.body{font-size:11px;font-weight:650}
    .value{font-size:25px;font-weight:850}.metric{font-size:10px;font-weight:750}.center{text-anchor:middle}
  </style>
  <rect width="1000" height="540" fill="#f5f7fa"/>
  <text x="42" y="34" class="eyebrow" fill="#087f5b">50% RESERVED CAPACITY · TESTED SETUP</text>
  <text x="42" y="62" class="title ink">When the realtime burst exceeds the reserve</text>

  <!-- Shared starting state -->
  <rect x="170" y="88" width="660" height="88" rx="8" fill="#ffffff" stroke="#cbd5df"/>
  <text x="500" y="112" class="node center ink">Before realtime arrives</text>
  <text x="500" y="132" class="body center muted">Endpoint Picker cap: 48 requests · batch ceiling: 24</text>
  <rect x="198" y="146" width="292" height="18" rx="5" fill="#6f42c1"/>
  <rect x="510" y="146" width="292" height="18" rx="5" fill="#e7f5ed" stroke="#8bc7ad"/>
  <text x="344" y="160" class="body center" fill="#ffffff">24 batch running</text>
  <text x="656" y="160" class="body center" fill="#087f5b">24 available for realtime</text>

  <path d="M500 176V198" fill="none" stroke="#697480" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="300" y="208" width="400" height="68" rx="8" fill="#ffffff" stroke="#9eb7e9"/>
  <text x="500" y="234" class="node center ink">32 realtime requests arrive</text>
  <text x="500" y="256" class="body center muted">24 start · up to 8 wait for capacity</text>

  <path d="M500 276V296" fill="none" stroke="#697480" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M500 300L602 346L500 392L398 346Z" fill="#ffffff" stroke="#8793a0" stroke-width="1.4"/>
  <text x="500" y="351" class="node center ink">Eviction enabled?</text>

  <!-- No branch -->
  <path d="M398 346H260V408" fill="none" stroke="#697480" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="330" y="336" class="node center muted">No</text>
  <rect x="60" y="418" width="400" height="100" rx="8" fill="#ffffff" stroke="#9eb7e9"/>
  <text x="84" y="444" class="eyebrow" fill="#2867df">HOLDBACK ONLY</text>
  <text x="84" y="471" class="node ink">Wait for batch to finish</text>
  <text x="84" y="492" class="body muted">Capacity returns naturally.</text>

  <!-- Yes branch -->
  <path d="M602 346H740V408" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="670" y="336" class="node center" fill="#6f42c1">Yes</text>
  <rect x="540" y="418" width="400" height="100" rx="8" fill="#ffffff" stroke="#b39bdf"/>
  <text x="564" y="444" class="eyebrow" fill="#6f42c1">HOLDBACK + EVICTION + RETRY</text>
  <text x="564" y="471" class="node ink">Stop eligible batch work</text>
  <text x="564" y="492" class="body muted">Batch retries later.</text>
</svg>
