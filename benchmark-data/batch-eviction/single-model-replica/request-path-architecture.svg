<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc">
  <title id="title">Batch eviction cancellation and retry sequence</title>
  <desc id="desc">The Async Processor sends batch through Envoy. Envoy asks the Endpoint Picker for a model replica and forwards the stream to vLLM. When higher-priority work is blocked, the Endpoint Picker instructs Envoy to return HTTP 429. Envoy resets the vLLM stream and sends the response to the Async Processor, which retries through the complete routing path and receives one final result.</desc>
  <style>
    text{font-family:Inter,Arial,sans-serif;letter-spacing:0}.ink{fill:#14202d}.muted{fill:#5b6877}.title{font-size:30px;font-weight:800}.sub{font-size:16px}.actor{font-size:16px;font-weight:800}.small{font-size:13px;font-weight:700}.phase{font-size:12px;font-weight:850}.step{font-size:14px;font-weight:800}
  </style>
  <defs>
    <marker id="blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d6cdf"/></marker>
    <marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b83232"/></marker>
    <marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f72"/></marker>
    <marker id="orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c56a00"/></marker>
  </defs>
  <rect width="1200" height="810" fill="#f4f7fa"/>
  <text x="40" y="48" class="ink title">Eviction ends one stream. Retry starts another.</text>
  <text x="40" y="78" class="muted sub">Each arrow begins at the component that performs the action.</text>

  <!-- Actors -->
  <rect x="50" y="108" width="220" height="62" fill="#fff" stroke="#c56a00" stroke-width="2"/>
  <text x="160" y="135" class="ink actor" text-anchor="middle">Async Processor</text><text x="160" y="155" fill="#9a4f00" class="phase" text-anchor="middle">RETRY OWNER</text>
  <rect x="340" y="108" width="220" height="62" fill="#fff" stroke="#738190" stroke-width="2"/>
  <text x="450" y="135" class="ink actor" text-anchor="middle">Envoy</text><text x="450" y="155" class="muted phase" text-anchor="middle">PROXY + STREAM</text>
  <rect x="630" y="108" width="220" height="62" fill="#fff" stroke="#087f72" stroke-width="2"/>
  <text x="740" y="135" class="ink actor" text-anchor="middle">Endpoint Picker</text><text x="740" y="155" fill="#087f72" class="phase" text-anchor="middle">ROUTING + EVICTION</text>
  <rect x="920" y="108" width="220" height="62" fill="#fff" stroke="#2d6cdf" stroke-width="2"/>
  <text x="1030" y="135" class="ink actor" text-anchor="middle">vLLM</text><text x="1030" y="155" fill="#2d6cdf" class="phase" text-anchor="middle">ACTIVE GENERATION</text>

  <!-- Lifelines -->
  <line x1="160" y1="170" x2="160" y2="784" stroke="#c9d3df" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="450" y1="170" x2="450" y2="784" stroke="#c9d3df" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="740" y1="170" x2="740" y2="784" stroke="#c9d3df" stroke-width="2" stroke-dasharray="6 6"/>
  <line x1="1030" y1="170" x2="1030" y2="784" stroke="#c9d3df" stroke-width="2" stroke-dasharray="6 6"/>

  <!-- Initial request -->
  <text x="40" y="202" fill="#2d6cdf" class="phase">BATCH IS RUNNING</text>
  <line x1="160" y1="220" x2="450" y2="220" stroke="#2d6cdf" stroke-width="3" marker-end="url(#blue)"/>
  <text x="305" y="211" class="small ink" text-anchor="middle">batch request</text>
  <line x1="450" y1="258" x2="740" y2="258" stroke="#087f72" stroke-width="3" marker-end="url(#green)"/>
  <text x="595" y="249" class="small ink" text-anchor="middle">ask for routing decision</text>
  <line x1="740" y1="294" x2="450" y2="294" stroke="#087f72" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#green)"/>
  <text x="595" y="285" class="small muted" text-anchor="middle">selected replica</text>
  <line x1="450" y1="330" x2="1030" y2="330" stroke="#2d6cdf" stroke-width="3" marker-end="url(#blue)"/>
  <text x="740" y="321" class="small ink" text-anchor="middle">Envoy forwards request stream</text>

  <!-- Eviction -->
  <rect x="30" y="354" width="1140" height="216" fill="#fff2f1" stroke="#e7c5c1"/>
  <text x="48" y="378" fill="#b83232" class="phase">HIGHER-PRIORITY WORK IS BLOCKED</text>
  <circle cx="740" cy="408" r="9" fill="#b83232"/>
  <text x="760" y="413" class="ink step">Endpoint Picker selects lower-priority batch</text>
  <line x1="740" y1="446" x2="450" y2="446" stroke="#b83232" stroke-width="4" marker-end="url(#red)"/>
  <text x="595" y="437" class="ink step" text-anchor="middle">ImmediateResponse instruction (429)</text>
  <line x1="450" y1="490" x2="1030" y2="490" stroke="#b83232" stroke-width="4" marker-end="url(#red)"/>
  <text x="740" y="481" class="ink step" text-anchor="middle">Envoy resets upstream stream → vLLM aborts</text>
  <line x1="450" y1="536" x2="160" y2="536" stroke="#c56a00" stroke-width="4" marker-end="url(#orange)"/>
  <text x="305" y="527" class="ink step" text-anchor="middle">Envoy sends HTTP 429</text>

  <!-- Retry -->
  <rect x="30" y="590" width="1140" height="194" fill="#edf8f5" stroke="#b9ddd4"/>
  <text x="48" y="614" fill="#087f72" class="phase">ASYNC PROCESSOR STARTS A NEW REQUEST</text>
  <line x1="160" y1="640" x2="450" y2="640" stroke="#087f72" stroke-width="4" marker-end="url(#green)"/>
  <text x="305" y="631" class="ink step" text-anchor="middle">retry batch job</text>
  <line x1="450" y1="674" x2="740" y2="674" stroke="#087f72" stroke-width="3" marker-end="url(#green)"/>
  <text x="595" y="665" class="small ink" text-anchor="middle">ask for routing decision</text>
  <line x1="740" y1="706" x2="450" y2="706" stroke="#087f72" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#green)"/>
  <text x="595" y="697" class="small muted" text-anchor="middle">selected replica</text>
  <line x1="450" y1="738" x2="1030" y2="738" stroke="#087f72" stroke-width="4" marker-end="url(#green)"/>
  <text x="740" y="729" class="ink step" text-anchor="middle">Envoy starts a new vLLM stream</text>
  <line x1="1030" y1="770" x2="160" y2="770" stroke="#087f72" stroke-width="4" marker-end="url(#green)"/>
  <text x="595" y="762" fill="#087f72" class="step" text-anchor="middle">one final result</text>
</svg>
