<svg xmlns="http://www.w3.org/2000/svg" width="960" height="610" viewBox="0 0 960 610" role="img" aria-labelledby="title desc">
  <title id="title">Batch eviction cancellation and retry flow</title>
  <desc id="desc">The normal request path moves from the Async Processor through Envoy and the Endpoint Picker to vLLM. During eviction, the Endpoint Picker selects lower-priority batch, Envoy returns HTTP 429 and resets the upstream stream, and vLLM aborts the request. The Async Processor then retries the job through the normal path and keeps one final result.</desc>
  <style>
    text { font-family: Inter, Arial, sans-serif; letter-spacing: 0; }
    .ink { fill: #15202b; }
    .muted { fill: #5f6c7b; }
    .title { font-size: 26px; font-weight: 800; }
    .subtitle { font-size: 14px; }
    .actor { font-size: 14px; font-weight: 800; }
    .role { font-size: 10px; font-weight: 750; }
    .step { font-size: 14px; font-weight: 800; }
    .small { font-size: 11px; font-weight: 650; }
    .phase { font-size: 11px; font-weight: 850; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#2d6cdf"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#b83232"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#087f72"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#c56a00"/></marker>
  </defs>

  <rect width="960" height="610" fill="#f5f7f9"/>
  <text x="32" y="42" class="ink title">Cancel the stream. Retry the job.</text>
  <text x="32" y="68" class="muted subtitle">Eviction ends active generation; the retry owner starts a new request.</text>

  <!-- Components -->
  <rect x="38" y="102" width="178" height="90" fill="#ffffff" stroke="#c56a00" stroke-width="2"/>
  <circle cx="69" cy="130" r="12" fill="#c56a00"/>
  <path d="M63 130 h12 M69 124 v12" stroke="#ffffff" stroke-width="2"/>
  <text x="127" y="132" class="ink actor" text-anchor="middle">Async Processor</text>
  <text x="127" y="157" fill="#9a4f00" class="role" text-anchor="middle">RETRY OWNER</text>

  <rect x="274" y="102" width="178" height="90" fill="#ffffff" stroke="#8794a1" stroke-width="2"/>
  <rect x="296" y="119" width="26" height="22" fill="none" stroke="#738190" stroke-width="2"/>
  <path d="M298 145 h22" stroke="#738190" stroke-width="2"/>
  <text x="363" y="132" class="ink actor" text-anchor="middle">Envoy gateway</text>
  <text x="363" y="157" class="muted role" text-anchor="middle">STREAM CONTROL</text>

  <rect x="510" y="102" width="188" height="90" fill="#ffffff" stroke="#087f72" stroke-width="2"/>
  <circle cx="540" cy="130" r="12" fill="none" stroke="#087f72" stroke-width="2"/>
  <circle cx="540" cy="130" r="4" fill="#087f72"/>
  <text x="613" y="132" class="ink actor" text-anchor="middle">Endpoint Picker</text>
  <text x="613" y="157" fill="#087f72" class="role" text-anchor="middle">ADMISSION + EVICTION</text>

  <rect x="756" y="102" width="166" height="90" fill="#ffffff" stroke="#2d6cdf" stroke-width="2"/>
  <rect x="778" y="117" width="26" height="26" fill="#2d6cdf"/>
  <path d="M783 135 l6-11 l6 11" fill="none" stroke="#ffffff" stroke-width="2"/>
  <text x="852" y="132" class="ink actor" text-anchor="middle">vLLM</text>
  <text x="852" y="157" fill="#2d6cdf" class="role" text-anchor="middle">ACTIVE GENERATION</text>

  <!-- Normal path -->
  <text x="38" y="224" fill="#2d6cdf" class="phase">NORMAL REQUEST PATH</text>
  <line x1="127" y1="250" x2="850" y2="250" stroke="#2d6cdf" stroke-width="4" marker-end="url(#arrow)"/>
  <circle cx="127" cy="250" r="7" fill="#2d6cdf"/><circle cx="363" cy="250" r="7" fill="#2d6cdf"/><circle cx="604" cy="250" r="7" fill="#2d6cdf"/>
  <text x="488" y="242" class="muted small" text-anchor="middle">route · admit · start stream</text>

  <!-- Eviction actions -->
  <rect x="38" y="288" width="884" height="174" fill="#fff3f2" stroke="#efd0cc"/>
  <text x="56" y="314" fill="#b83232" class="phase">WHEN HIGHER-PRIORITY DEMAND IS BLOCKED</text>

  <rect x="72" y="338" width="230" height="84" fill="#ffffff" stroke="#b83232" stroke-width="2"/>
  <circle cx="100" cy="366" r="15" fill="#b83232"/>
  <text x="100" y="371" fill="#ffffff" class="step" text-anchor="middle">1</text>
  <text x="187" y="365" class="ink step" text-anchor="middle">Select batch</text>
  <text x="187" y="391" class="muted small" text-anchor="middle">must be lower priority</text>

  <line x1="302" y1="380" x2="352" y2="380" stroke="#b83232" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="360" y="338" width="230" height="84" fill="#ffffff" stroke="#b83232" stroke-width="2"/>
  <circle cx="388" cy="366" r="15" fill="#b83232"/>
  <text x="388" y="371" fill="#ffffff" class="step" text-anchor="middle">2</text>
  <text x="475" y="365" class="ink step" text-anchor="middle">Envoy resets stream</text>
  <text x="475" y="391" class="muted small" text-anchor="middle">immediate HTTP 429</text>

  <line x1="590" y1="380" x2="640" y2="380" stroke="#b83232" stroke-width="3" marker-end="url(#arrow-red)"/>

  <rect x="648" y="338" width="230" height="84" fill="#ffffff" stroke="#b83232" stroke-width="2"/>
  <circle cx="676" cy="366" r="15" fill="#b83232"/>
  <text x="676" y="371" fill="#ffffff" class="step" text-anchor="middle">3</text>
  <text x="763" y="365" class="ink step" text-anchor="middle">vLLM aborts</text>
  <text x="763" y="391" class="muted small" text-anchor="middle">active request ends</text>

  <!-- Retry lane -->
  <rect x="38" y="482" width="884" height="86" fill="#edf8f5" stroke="#b9ddd4"/>
  <text x="56" y="507" fill="#087f72" class="phase">CLIENT-OWNED RETRY</text>
  <line x1="844" y1="536" x2="136" y2="536" stroke="#c56a00" stroke-width="2.5" marker-end="url(#arrow-orange)"/>
  <text x="490" y="528" fill="#9a4f00" class="small" text-anchor="middle">retryable 429 returns to Async Processor</text>
  <path d="M136 548 V582 H844" fill="none" stroke="#087f72" stroke-width="3" marker-end="url(#arrow-green)"/>
  <text x="490" y="576" fill="#087f72" class="small" text-anchor="middle">new request through the normal path → one final result</text>

  <text x="480" y="602" class="muted small" text-anchor="middle">Partial generation is not resumed. The retry owner preserves job identity and prevents duplicate final results.</text>
</svg>
