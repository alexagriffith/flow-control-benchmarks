<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="470" viewBox="0 0 1000 470" role="img" aria-label="Batch recovery sequence: the Async Processor sends batch through the Gateway and Endpoint Picker to vLLM; the Endpoint Picker instructs the Gateway to return HTTP 429 and end the selected vLLM stream; the Async Processor then submits the request again"><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="1000" height="470" fill="#ffffff"/><defs><marker id="blue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="orange-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker><marker id="purple-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6650a5"/></marker><marker id="teal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker></defs><text x="32.0" y="38.0" fill="#15202b" font-size="20" font-weight="780" text-anchor="start">Batch eviction releases capacity and returns work to the request path</text><text x="32.0" y="60.0" fill="#5f6c7b" font-size="12" font-weight="600" text-anchor="start">The Gateway ends the selected vLLM stream and returns a retryable response to the Async Processor.</text><rect x="40" y="84" width="172" height="48" rx="6" fill="#f7f8fa" stroke="#6650a5" stroke-width="2"/><text x="126.0" y="114.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="middle">Async Processor</text><line x1="126" y1="132" x2="126" y2="438" stroke="#d7dde5" stroke-width="2" stroke-dasharray="5 6"/><rect x="282" y="84" width="172" height="48" rx="6" fill="#f7f8fa" stroke="#2d6cdf" stroke-width="2"/><text x="368.0" y="114.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="middle">Gateway</text><line x1="368" y1="132" x2="368" y2="438" stroke="#d7dde5" stroke-width="2" stroke-dasharray="5 6"/><rect x="524" y="84" width="172" height="48" rx="6" fill="#f7f8fa" stroke="#087f72" stroke-width="2"/><text x="610.0" y="114.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="middle">Endpoint Picker</text><line x1="610" y1="132" x2="610" y2="438" stroke="#d7dde5" stroke-width="2" stroke-dasharray="5 6"/><rect x="766" y="84" width="172" height="48" rx="6" fill="#f7f8fa" stroke="#2d6cdf" stroke-width="2"/><text x="852.0" y="114.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="middle">vLLM</text><line x1="852" y1="132" x2="852" y2="438" stroke="#d7dde5" stroke-width="2" stroke-dasharray="5 6"/><text x="32.0" y="158.0" fill="#2d6cdf" font-size="9" font-weight="800" text-anchor="start">1  BATCH REQUEST</text><path d="M126 174 H844" stroke="#2d6cdf" stroke-width="3" marker-end="url(#blue-arrow)"/><text x="489.0" y="164.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="middle">Gateway routes · Endpoint Picker selects · vLLM runs</text><text x="32.0" y="222.0" fill="#c56a00" font-size="9" font-weight="800" text-anchor="start">2  CAPACITY NEEDED</text><path d="M610 240 H376" stroke="#c56a00" stroke-width="3" marker-end="url(#orange-arrow)"/><text x="493.0" y="231.0" fill="#c56a00" font-size="11" font-weight="750" text-anchor="middle">Return HTTP 429</text><path d="M368 276 H844" stroke="#c56a00" stroke-width="3" marker-end="url(#orange-arrow)"/><text x="610.0" y="267.0" fill="#c56a00" font-size="11" font-weight="750" text-anchor="middle">End selected upstream stream</text><rect x="802" y="292" width="100" height="24" rx="4" fill="#c56a00" opacity="0.12"/><text x="852.0" y="308.0" fill="#c56a00" font-size="9" font-weight="750" text-anchor="middle">capacity released</text><path d="M360 326 H134" stroke="#6650a5" stroke-width="3" marker-end="url(#purple-arrow)"/><text x="247.0" y="317.0" fill="#6650a5" font-size="11" font-weight="750" text-anchor="middle">HTTP 429</text><text x="32.0" y="370.0" fill="#087f72" font-size="9" font-weight="800" text-anchor="start">3  RETRY</text><path d="M126 388 H844" stroke="#087f72" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="489.0" y="379.0" fill="#087f72" font-size="11" font-weight="750" text-anchor="middle">Async Processor submits the request again</text><path d="M852 420 H134" stroke="#087f72" stroke-width="3" marker-end="url(#teal-arrow)"/><text x="489.0" y="441.0" fill="#087f72" font-size="11" font-weight="750" text-anchor="middle">One final result returns to the batch job</text></svg>
