<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="350" viewBox="0 0 1000 350" role="img" aria-label="One Endpoint Picker routed traffic across two model replicas; both replicas received balanced traffic, eviction and retry worked on both, and the latency difference from one model was inconclusive"><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="1000" height="350" fill="#ffffff"/><text x="32.0" y="38.0" fill="#15202b" font-size="20" font-weight="780" text-anchor="start">Eviction and retry continued across two model replicas</text><text x="32.0" y="60.0" fill="#5f6c7b" font-size="12" font-weight="600" text-anchor="start">One Endpoint Picker served both models at the same per-GPU load as the single-model proof.</text><circle cx="218" cy="172" r="66" fill="#f7f8fa" stroke="#087f72" stroke-width="3"/><text x="218.0" y="166.0" fill="#15202b" font-size="15" font-weight="780" text-anchor="middle">Endpoint</text><text x="218.0" y="187.0" fill="#15202b" font-size="15" font-weight="780" text-anchor="middle">Picker</text><path d="M284 148 C350 148 350 112 420 112" fill="none" stroke="#2d6cdf" stroke-width="4"/><path d="M284 196 C350 196 350 232 420 232" fill="none" stroke="#087f72" stroke-width="4"/><rect x="420" y="80" width="246" height="64" rx="6" fill="#f7f8fa" stroke="#2d6cdf" stroke-width="2"/><text x="442.0" y="107.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="start">Model replica 1</text><text x="442.0" y="127.0" fill="#2d6cdf" font-size="11" font-weight="650" text-anchor="start">48–52% of traffic</text><circle cx="638" cy="112" r="10" fill="#e7f4f1" stroke="#087f72"/><text x="638.0" y="116.0" fill="#087f72" font-size="10" font-weight="800" text-anchor="middle">✓</text><rect x="420" y="200" width="246" height="64" rx="6" fill="#f7f8fa" stroke="#087f72" stroke-width="2"/><text x="442.0" y="227.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="start">Model replica 2</text><text x="442.0" y="247.0" fill="#087f72" font-size="11" font-weight="650" text-anchor="start">48–52% of traffic</text><circle cx="638" cy="232" r="10" fill="#e7f4f1" stroke="#087f72"/><text x="638.0" y="236.0" fill="#087f72" font-size="10" font-weight="800" text-anchor="middle">✓</text><path d="M666 112 H750" stroke="#6650a5" stroke-width="4"/><path d="M666 232 H750" stroke="#6650a5" stroke-width="4"/><path d="M750 112 V232" stroke="#6650a5" stroke-width="4"/><circle cx="750" cy="172" r="18" fill="#6650a5"/><text x="750.0" y="177.0" fill="#ffffff" font-size="14" font-weight="800" text-anchor="middle">↻</text><text x="784.0" y="151.0" fill="#15202b" font-size="13" font-weight="780" text-anchor="start">Batch eviction and retry</text><text x="784.0" y="172.0" fill="#6650a5" font-size="12" font-weight="650" text-anchor="start">worked on both replicas</text><text x="784.0" y="198.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">One final result per evicted job</text><line x1="32" y1="296" x2="968" y2="296" stroke="#dde3ea"/><text x="32.0" y="326.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Latency comparison</text><text x="160.0" y="326.0" fill="#5f6c7b" font-size="11" font-weight="650" text-anchor="start">The observed difference was small; three repeats were insufficient to establish a scaling change.</text></svg>
