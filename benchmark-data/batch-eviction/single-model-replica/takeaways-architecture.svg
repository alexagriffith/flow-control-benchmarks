<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="takeaways-arch-title takeaways-arch-desc">
  <title id="takeaways-arch-title">Batch eviction request path</title>
  <desc id="takeaways-arch-desc">Realtime and batch traffic enter through Envoy, are admitted by the Endpoint Picker with reserved capacity and in-flight eviction, run on vLLM, and evicted batch work is retried by the Async Processor.</desc>
  <style>
    text { font-family: Inter, ui-sans-serif, system-ui, sans-serif; letter-spacing: 0; }
    .kicker { fill: #5f6c7b; font-size: 10px; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .title { fill: #15202b; font-size: 16px; font-weight: 800; }
    .label { fill: #15202b; font-size: 11.5px; font-weight: 700; }
    .copy { fill: #5f6c7b; font-size: 10.5px; }
    .flow { fill: #4a5563; font-size: 10px; font-weight: 700; }
    .lane-realtime { fill: #087f72; font-size: 10.5px; font-weight: 800; }
    .lane-batch { fill: #2d6cdf; font-size: 10.5px; font-weight: 800; }
    .callout { fill: #b83232; font-size: 10px; font-weight: 800; }
    .pill { fill: #fff; stroke: #e2e8f0; stroke-width: 1; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4a5563"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f72"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b83232"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c56a00"/>
    </marker>
  </defs>

  <rect width="960" height="400" fill="#f7f8fa" rx="8"/>

  <!-- Clients: 20,48 → 170 -->
  <g id="clients">
    <rect x="20" y="48" width="150" height="168" fill="#fff" stroke="#cdd5df" stroke-width="1.5" rx="8"/>
    <text class="kicker" x="36" y="72">Incoming work</text>
    <text class="title" x="36" y="94">Clients</text>
    <rect x="36" y="108" width="118" height="42" fill="#e7f5f2" stroke="#087f72" stroke-width="1.2" rx="6"/>
    <text class="lane-realtime" x="48" y="128">Realtime</text>
    <text class="copy" x="48" y="142">higher priority</text>
    <rect x="36" y="158" width="118" height="42" fill="#edf3ff" stroke="#2d6cdf" stroke-width="1.2" rx="6"/>
    <text class="lane-batch" x="48" y="178">Batch</text>
    <text class="copy" x="48" y="192">lower priority</text>
  </g>

  <!-- Envoy: 190,48 → 348 -->
  <g id="envoy">
    <rect x="190" y="48" width="158" height="168" fill="#fff" stroke="#cdd5df" stroke-width="1.5" rx="8"/>
    <text class="kicker" x="206" y="72">Edge</text>
    <text class="title" x="206" y="94">Envoy gateway</text>
    <rect x="206" y="110" width="126" height="30" fill="#f3f6f8" stroke="#dde3ea" rx="4"/>
    <text class="label" x="218" y="130">OpenAI route</text>
    <rect x="206" y="146" width="126" height="30" fill="#f3f6f8" stroke="#dde3ea" rx="4"/>
    <text class="label" x="218" y="166">Priority headers</text>
    <rect x="206" y="182" width="126" height="30" fill="#f3f6f8" stroke="#dde3ea" rx="4"/>
    <text class="label" x="218" y="202">Fairness ID</text>
  </g>

  <!-- Endpoint Picker: 368,32 → 668, bottom 244 -->
  <g id="epp">
    <rect x="368" y="32" width="300" height="212" fill="#fff" stroke="#087f72" stroke-width="2" rx="8"/>
    <text class="kicker" x="384" y="56">Admission and eviction</text>
    <text class="title" x="384" y="78">Endpoint Picker</text>
    <rect x="384" y="92" width="132" height="60" fill="#f3f6f8" stroke="#dde3ea" rx="6"/>
    <text class="label" x="396" y="114">Concurrency gate</text>
    <text class="copy" x="396" y="132">admit or queue</text>
    <rect x="524" y="92" width="132" height="60" fill="#e7f5f2" stroke="#087f72" stroke-width="1.2" rx="6"/>
    <text class="label" x="536" y="114">Reserved capacity</text>
    <text class="copy" x="536" y="132">hold slots for realtime</text>
    <rect x="384" y="162" width="272" height="58" fill="#fdeaea" stroke="#b83232" stroke-width="1.2" rx="6"/>
    <text class="label" x="396" y="184">In-flight eviction</text>
    <text class="copy" x="396" y="202">stops running batch when priority work is blocked</text>
  </g>

  <!-- vLLM: 688,48 → 856, running 704,148 → 840,202 -->
  <g id="vllm">
    <rect x="688" y="48" width="168" height="168" fill="#fff" stroke="#cdd5df" stroke-width="1.5" rx="8"/>
    <text class="kicker" x="704" y="72">Model execution</text>
    <text class="title" x="704" y="94">vLLM</text>
    <rect x="704" y="108" width="136" height="30" fill="#f3f6f8" stroke="#dde3ea" rx="4"/>
    <text class="label" x="716" y="128">Waiting queue</text>
    <rect x="704" y="148" width="136" height="54" fill="#edf3ff" stroke="#2d6cdf" stroke-width="1.2" rx="4"/>
    <text class="label" x="716" y="170">Running sequences</text>
    <text class="copy" x="716" y="186">shared GPU capacity</text>
  </g>

  <!-- Async: 368,272 → 668, top 272 -->
  <g id="async">
    <rect x="368" y="272" width="300" height="68" fill="#fff" stroke="#c56a00" stroke-width="1.6" rx="8"/>
    <text class="kicker" x="384" y="296">Retry owner</text>
    <text class="title" x="384" y="318">Async Processor</text>
    <text class="copy" x="384" y="332">requeues evicted batch with bounded retry</text>
  </g>

  <!-- Main path -->
  <path d="M170 132 H190" fill="none" stroke="#4a5563" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M348 132 H368" fill="none" stroke="#4a5563" stroke-width="1.75" marker-end="url(#arrow)"/>
  <path d="M668 132 H688" fill="none" stroke="#4a5563" stroke-width="1.75" marker-end="url(#arrow)"/>

  <!-- Abort: eviction → running sequences (lane y=252) -->
  <path d="M520 220 V252 H704 V175" fill="none" stroke="#b83232" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow-red)"/>

  <!-- Evicted retry: running box → below async (lane y=348) -->
  <path d="M840 202 V348 H518 V272" fill="none" stroke="#c56a00" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-amber)"/>

  <!-- Resubmit: async left → clients (lane y=308, left margin x=108) -->
  <path d="M368 306 H108 V132 H170" fill="none" stroke="#087f72" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arrow-teal)"/>

  <!-- Main-flow labels (above arrows) -->
  <g>
    <rect class="pill" x="162" y="110" width="38" height="16" rx="4"/>
    <text class="flow" x="181" y="121" text-anchor="middle">HTTP</text>
    <rect class="pill" x="340" y="110" width="46" height="16" rx="4"/>
    <text class="flow" x="363" y="121" text-anchor="middle">route</text>
    <rect class="pill" x="658" y="110" width="58" height="16" rx="4"/>
    <text class="flow" x="687" y="121" text-anchor="middle">dispatch</text>
  </g>

  <!-- Abort label: whitespace above abort lane, clear of EPP border -->
  <g>
    <rect class="pill" x="556" y="226" width="108" height="16" rx="4"/>
    <text class="callout" x="610" y="237" text-anchor="middle">abort batch stream</text>
  </g>

  <!-- Evicted label: right margin, clear of both dashed paths -->
  <g>
    <rect class="pill" x="872" y="268" width="76" height="16" rx="4"/>
    <text class="flow" x="910" y="279" text-anchor="middle" fill="#c56a00">evicted &#8594; retry</text>
  </g>

  <!-- Resubmit label: left margin, below horizontal lane -->
  <g>
    <rect class="pill" x="52" y="318" width="58" height="16" rx="4"/>
    <text class="flow" x="81" y="329" text-anchor="middle" fill="#087f72">resubmit</text>
  </g>
</svg>
