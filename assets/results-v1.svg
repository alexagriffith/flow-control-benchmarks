<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200"><rect width="1200" height="200" fill="#ffffff"/><text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#151515">Results at a glance</text><text x="20" y="51" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" fill="#6b6b6b">Four pressure scenarios, three repeats each, one GPU past its knee on purpose. The pattern, not the absolute numbers, is the finding.</text><rect x="20.0" y="66" width="278.0" height="114" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="36.0" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ee0000" letter-spacing="1.1">TEST 1 · DOUBLED LOAD</text><text x="36.0" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#151515">513 → 606 ms</text><text x="36.0" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b6b6b">p95 TTFT as load doubled</text><text x="36.0" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">One endpoint kept serving both tenants.</text><rect x="314.0" y="66" width="278.0" height="114" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="330.0" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ee0000" letter-spacing="1.1">TEST 2 · PRIORITY</text><text x="330.0" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#151515">2.6x</text><text x="330.0" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b6b6b">queue duration, standard vs premium</text><text x="330.0" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">The queue moved to the lower tier.</text><rect x="608.0" y="66" width="278.0" height="114" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="624.0" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ee0000" letter-spacing="1.1">TEST 3 · FAIRNESS</text><text x="624.0" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#151515">7.7 ms</text><text x="624.0" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b6b6b">p95 spread across one band</text><text x="624.0" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">Three tenants, one spiking, equal experience.</text><rect x="902.0" y="66" width="278.0" height="114" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="918.0" y="90" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="800" fill="#ee0000" letter-spacing="1.1">TEST 4 · BATCH SURGE</text><text x="918.0" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="23" font-weight="800" fill="#151515">198 vs 62 ms</text><text x="918.0" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#6b6b6b">mean queue time, batch vs premium</text><text x="918.0" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">The surge paid for its own waiting.</text></svg>