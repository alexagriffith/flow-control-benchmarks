<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 854" role="img" aria-label="Every run in the campaign and what it proves"><rect width="1200" height="854" fill="#ffffff"/><text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start">What we ran, and what each run proves</text><text x="20" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">One GPU serving GPT-OSS 20B behind the llm-d inference gateway. Every number below comes from a run that met its acceptance bar, except where marked.</text><text x="20" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">RUN</text><text x="330" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">WHAT IT PROVES</text><text x="816" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">HEADLINE</text><text x="1006" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">STATUS</text><line x1="20" y1="94" x2="1180" y2="94" stroke="#d8d8d8"/><rect x="20" y="104" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="104" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="131" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Capacity envelope</text><text x="38" y="149" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">5 request shapes, 9 concurrency steps</text><text x="330" y="129" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Concurrency does not describe load. The knee sat at 160</text><text x="330" y="145" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">for every shape, the cost of being there did not.</text><text x="816" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1f8a5f" text-anchor="start">569 ms to 6.0 s</text><text x="816" y="149" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">p95 TTFT at the same 160 concurrent</text><rect x="1002" y="120" width="178" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1091" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="180" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="180" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="207" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Consolidation, three phase</text><text x="38" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, 42,162 requests</text><text x="330" y="205" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Interactive tenants share one GPU and hold the objective</text><text x="330" y="221" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">as more of them arrive.</text><text x="816" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1f8a5f" text-anchor="start">45 to 69 ms</text><text x="816" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">p95 TTFT across all three phases</text><rect x="1002" y="196" width="178" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1091" y="211" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="256" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="256" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="283" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Service tiers</text><text x="38" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, 53,399 requests</text><text x="330" y="281" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">When the pool saturates, priority decides who waits.</text><text x="816" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1f8a5f" text-anchor="start">41 vs 379 ms</text><text x="816" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">p50 TTFT, premium against standard</text><rect x="1002" y="272" width="178" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1091" y="287" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="332" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="332" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="359" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Batch isolation</text><text x="38" y="377" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, 53,954 requests</text><text x="330" y="357" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Batch cannot displace interactive traffic even when it</text><text x="330" y="373" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">dominates arrivals.</text><text x="816" y="359" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1f8a5f" text-anchor="start">202 vs 64 ms</text><text x="816" y="377" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">mean queue duration, batch against premium</text><rect x="1002" y="348" width="178" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1091" y="363" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="408" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="408" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="435" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Overload probe</text><text x="38" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">4 load steps, tightened limits</text><text x="330" y="433" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Past the limits, refusals are governed and carry a named</text><text x="330" y="449" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">reason on the wire.</text><text x="816" y="435" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1f8a5f" text-anchor="start">429 and 503</text><text x="816" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">named drop reasons, no silent failure</text><rect x="1002" y="424" width="178" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1091" y="439" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="484" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="484" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="511" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Same-band fairness</text><text x="38" y="529" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, matched pair</text><text x="330" y="509" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Fairness holds inside a band. The burster carries the</text><text x="330" y="525" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">queue, and the band degrades together.</text><text x="816" y="511" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1f8a5f" text-anchor="start">3.6x queue</text><text x="816" y="529" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">the burster against its peers, 10x the load</text><rect x="1002" y="500" width="178" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1091" y="515" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1f8a5f" text-anchor="middle">Ready to publish</text><rect x="20" y="560" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="560" width="4" height="68" rx="2" fill="#1c78d8"/><text x="38" y="587" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Priority as insulation</text><text x="38" y="605" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, same traffic</text><text x="330" y="585" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Ordering is not occupancy. Demoting the burster left peer</text><text x="330" y="601" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">latency where it was.</text><text x="816" y="587" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#1c78d8" text-anchor="start">506 to 483 ms</text><text x="816" y="605" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">peer p95 TTFT, one band against two</text><rect x="1002" y="576" width="178" height="22" rx="11" fill="#1c78d8" opacity="0.12"/><text x="1091" y="591" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#1c78d8" text-anchor="middle">Ready to publish</text><rect x="20" y="636" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="636" width="4" height="68" rx="2" fill="#d59a00"/><text x="38" y="663" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Phase-3 calibration</text><text x="38" y="681" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">7 attempts, endpoint B</text><text x="330" y="661" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">The window between no queueing and a premium objective</text><text x="330" y="677" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">breach is about one traffic step wide.</text><text x="816" y="663" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#d59a00" text-anchor="start">112 works, 120 breaks</text><text x="816" y="681" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">standard concurrency on this hardware</text><rect x="1002" y="652" width="178" height="22" rx="11" fill="#d59a00" opacity="0.12"/><text x="1091" y="667" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#d59a00" text-anchor="middle">Supporting finding</text><rect x="20" y="712" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="712" width="4" height="68" rx="2" fill="#d59a00"/><text x="38" y="739" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Probe ladder</text><text x="38" y="757" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">10 attempts, every traffic lever</text><text x="330" y="737" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">No gate or traffic setting makes ordering behave like an</text><text x="330" y="753" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">occupancy cap.</text><text x="816" y="739" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" font-weight="700" fill="#d59a00" text-anchor="start">0 of 10</text><text x="816" y="757" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="9.5" font-weight="400" fill="#8a8a8a" text-anchor="start">probes that met the retired bar</text><rect x="1002" y="728" width="178" height="22" rx="11" fill="#d59a00" opacity="0.12"/><text x="1091" y="743" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#d59a00" text-anchor="middle">Boundary</text><line x1="20" y1="794" x2="1180" y2="794" stroke="#e6e6e6"/><text x="20" y="816" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Green is published evidence. Blue is measured and waiting to go in. Amber is a finding that changed how we frame the claim rather than a run that failed.</text></svg>