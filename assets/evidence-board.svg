<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 778" role="img" aria-label="Every run in the campaign and what it proves"><rect width="1200" height="778" fill="#ffffff"/><text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start">What we ran, and what each run proves</text><text x="20" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">One GPU serving GPT-OSS 20B behind the llm-d inference gateway. Every number below comes from a run that met its acceptance bar, except where marked.</text><text x="20" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">RUN</text><text x="330" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">WHAT IT PROVES</text><text x="830" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">HEADLINE</text><text x="1030" y="86" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">STATUS</text><line x1="20" y1="94" x2="1180" y2="94" stroke="#d8d8d8"/><rect x="20" y="104" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="104" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="131" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Capacity envelope</text><text x="38" y="149" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">5 request shapes, 9 concurrency steps</text><text x="330" y="129" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Concurrency does not describe load. The knee sat at 160 for</text><text x="330" y="145" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">every shape, the cost of being there did not.</text><text x="830" y="131" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#1f8a5f" text-anchor="start">569 ms to 6.0 s</text><text x="830" y="149" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">p95 TTFT at the same 160 concurrent</text><rect x="1030" y="120" width="150" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1105" y="135" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="180" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="180" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="207" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Consolidation, SLA rerun</text><text x="38" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">2 counted repeats, 1,298 requests</text><text x="330" y="205" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Two interactive tenants share one GPU and hold an interactive</text><text x="330" y="221" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">target.</text><text x="830" y="207" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#1f8a5f" text-anchor="start">114 to 125 ms</text><text x="830" y="225" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">p95 TTFT against a 300 ms target</text><rect x="1030" y="196" width="150" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1105" y="211" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="256" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="256" width="4" height="68" rx="2" fill="#1c78d8"/><text x="38" y="283" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Consolidation, three phase</text><text x="38" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, endpoint B</text><text x="330" y="281" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Same claim under noisy production-like traffic, with the</text><text x="330" y="297" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">streaming artifact fixed at the runner.</text><text x="830" y="283" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#1c78d8" text-anchor="start">44 to 73 ms</text><text x="830" y="301" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">p95 TTFT across all three phases</text><rect x="1030" y="272" width="150" height="22" rx="11" fill="#1c78d8" opacity="0.12"/><text x="1105" y="287" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1c78d8" text-anchor="middle">Ready to publish</text><rect x="20" y="332" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="332" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="359" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Service tiers</text><text x="38" y="377" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, 53,399 requests</text><text x="330" y="357" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">When the pool saturates, priority decides who waits.</text><text x="830" y="359" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#1f8a5f" text-anchor="start">41 vs 379 ms</text><text x="830" y="377" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">p50 TTFT, premium against standard</text><rect x="1030" y="348" width="150" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1105" y="363" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="408" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="408" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="435" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Batch isolation</text><text x="38" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">3 counted repeats, 53,954 requests</text><text x="330" y="433" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Batch cannot displace interactive traffic even when it dominates</text><text x="330" y="449" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">arrivals.</text><text x="830" y="435" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#1f8a5f" text-anchor="start">202 vs 64 ms</text><text x="830" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">mean queue duration, batch against premium</text><rect x="1030" y="424" width="150" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1105" y="439" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="484" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="484" width="4" height="68" rx="2" fill="#1f8a5f"/><text x="38" y="511" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Overload probe</text><text x="38" y="529" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">4 load steps, tightened limits</text><text x="330" y="509" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Past the limits, refusals are governed and carry a named reason</text><text x="330" y="525" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">on the wire.</text><text x="830" y="511" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#1f8a5f" text-anchor="start">429 and 503</text><text x="830" y="529" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">named drop reasons, no silent failure</text><rect x="1030" y="500" width="150" height="22" rx="11" fill="#1f8a5f" opacity="0.12"/><text x="1105" y="515" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#1f8a5f" text-anchor="middle">Published</text><rect x="20" y="560" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="560" width="4" height="68" rx="2" fill="#d59a00"/><text x="38" y="587" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Same-band fairness</text><text x="38" y="605" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">10 probe attempts, every lever tried</text><text x="330" y="585" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">Fairness is equal treatment, not insulation. The burster pays</text><text x="330" y="601" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">the queue, the band degrades together.</text><text x="830" y="587" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#d59a00" text-anchor="start">2.6x queue</text><text x="830" y="605" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">the burster against its peers, 14x the load</text><rect x="1030" y="576" width="150" height="22" rx="11" fill="#d59a00" opacity="0.12"/><text x="1105" y="591" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#d59a00" text-anchor="middle">Reframe and rerun as a pair</text><rect x="20" y="636" width="1160" height="68" rx="8" fill="#fbfbfb" stroke="#ececec"/><rect x="20" y="636" width="4" height="68" rx="2" fill="#d59a00"/><text x="38" y="663" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Phase-3 calibration</text><text x="38" y="681" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">5 attempts, endpoint B</text><text x="330" y="661" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">The window between no queueing and a premium SLO breach is about</text><text x="330" y="677" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#383838" text-anchor="start">one traffic step wide.</text><text x="830" y="663" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" font-weight="700" fill="#d59a00" text-anchor="start">112 works, 120 breaks</text><text x="830" y="681" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">standard concurrency on this hardware</text><rect x="1030" y="652" width="150" height="22" rx="11" fill="#d59a00" opacity="0.12"/><text x="1105" y="667" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="700" fill="#d59a00" text-anchor="middle">Supporting finding</text><line x1="20" y1="718" x2="1180" y2="718" stroke="#e6e6e6"/><text x="20" y="740" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Green is published evidence. Blue is measured and waiting to go in. Amber is a finding that changed how we frame the claim rather than a run that failed.</text></svg>