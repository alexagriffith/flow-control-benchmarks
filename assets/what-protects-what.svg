<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" role="img" aria-label="Which mechanism protects a tenant from which source of load"><rect width="1200" height="540" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start">Which mechanism protects you from what</text><text x="20" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Read a row as a question a tenant asks. Each column is one mechanism, and only one column answers each row.</text><text x="560" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="middle">Fairness</text><text x="790" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="middle">Priority</text><text x="1020" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="middle">Capacity</text><text x="24" y="88" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">THE LOAD THAT IS HURTING YOU</text><line x1="20" y1="98" x2="1180" y2="98" stroke="#d8d8d8"/><rect x="20" y="112" width="1160" height="72" rx="8" fill="#fbfbfb" stroke="#ececec"/><text x="38" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#151515" text-anchor="start">A neighbor in your own band sends far more than you</text><rect x="492" y="134" width="136" height="28" rx="14" fill="#1f8a5f" opacity="1"/><text x="560" y="153" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Bounded</text><rect x="722" y="134" width="136" height="28" rx="14" fill="#f3f3f3" opacity="1"/><text x="790" y="153" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a9a9a" text-anchor="middle">No</text><rect x="952" y="134" width="136" height="28" rx="14" fill="#d59a00" opacity="1"/><text x="1020" y="153" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Helps</text><rect x="20" y="192" width="1160" height="72" rx="8" fill="#fbfbfb" stroke="#ececec"/><text x="38" y="224" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#151515" text-anchor="start">A workload in a lower band surges</text><rect x="492" y="214" width="136" height="28" rx="14" fill="#f3f3f3" opacity="1"/><text x="560" y="233" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a9a9a" text-anchor="middle">No</text><rect x="722" y="214" width="136" height="28" rx="14" fill="#1f8a5f" opacity="1"/><text x="790" y="233" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Bounded</text><rect x="952" y="214" width="136" height="28" rx="14" fill="#d59a00" opacity="1"/><text x="1020" y="233" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Helps</text><rect x="20" y="272" width="1160" height="72" rx="8" fill="#fbfbfb" stroke="#ececec"/><text x="38" y="304" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="600" fill="#151515" text-anchor="start">Your own band is full of your own traffic</text><rect x="492" y="294" width="136" height="28" rx="14" fill="#f3f3f3" opacity="1"/><text x="560" y="313" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a9a9a" text-anchor="middle">No</text><rect x="722" y="294" width="136" height="28" rx="14" fill="#f3f3f3" opacity="1"/><text x="790" y="313" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#9a9a9a" text-anchor="middle">No</text><rect x="952" y="294" width="136" height="28" rx="14" fill="#1f8a5f" opacity="1"/><text x="1020" y="313" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#ffffff" text-anchor="middle">Bounded</text><line x1="20" y1="356" x2="1180" y2="356" stroke="#e6e6e6"/><text x="20" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="start">Fairness</text><text x="20" y="402" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Splits dispatch turns inside one band. A tenant</text><text x="20" y="419" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">can always claim its turn, and it forfeits the</text><text x="20" y="436" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">turn when its queue is empty. It divides a band,</text><text x="20" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">it does not reserve capacity.</text><text x="420" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="start">Priority</text><text x="420" y="402" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Serves a higher band before a lower one, and holds</text><text x="420" y="419" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">the lower band first when the gate closes. It</text><text x="420" y="436" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">separates bands, and it does nothing about load</text><text x="420" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">inside your own band.</text><text x="820" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="start">Capacity</text><text x="820" y="402" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Replicas and request shape set how much work the</text><text x="820" y="419" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">pool can hold. This is the only lever that adds</text><text x="820" y="436" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">headroom. The other two decide who waits while it</text><text x="820" y="453" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">is missing.</text></svg>