<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-label="Reserved capacity keeps batch in the Endpoint Picker before vLLM. After dispatch, the Endpoint Picker can select eligible running batch, Envoy resets the vLLM stream, and the batch client retries the request."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="410" fill="#ffffff"/><rect x="10" y="10" width="860" height="390" rx="8" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#087f72"/></marker><marker id="batch-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#c56a00"/></marker><marker id="retry-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#2d6cdf"/></marker><marker id="reset-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#b83232"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#667180"/></marker></defs><rect x="30" y="24" width="820" height="158" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="50.0" y="48.0" fill="#087f72" font-size="11" font-weight="800" text-anchor="start">Reserved capacity</text><rect x="54" y="76" width="124" height="58" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="116.0" y="100.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Gateway / Envoy</text><text x="116.0" y="117.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">request path</text><rect x="230" y="54" width="356" height="112" rx="8" fill="#f1fbf8" stroke="#087f72" stroke-width="1.6"/><text x="408.0" y="72.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="250" y="82" width="316" height="28" rx="5" fill="#ffffff" stroke="#087f72"/><text x="264.0" y="100.0" fill="#087f72" font-size="8" font-weight="750" text-anchor="start">real-time</text><rect x="396.0" y="90.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="411.0" y="90.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="426.0" y="90.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="250" y="122" width="316" height="28" rx="5" fill="#fff8f0" stroke="#c56a00"/><text x="264.0" y="140.0" fill="#c56a00" font-size="8" font-weight="750" text-anchor="start">batch</text><rect x="396.0" y="130.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="411.0" y="130.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="426.0" y="130.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="441.0" y="130.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="456.0" y="130.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="692" y="64" width="112" height="86" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="748.0" y="85.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">vLLM</text><rect x="718.0" y="98.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="733.0" y="98.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="748.0" y="98.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="763.0" y="98.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="778.0" y="98.0" width="10" height="10" rx="2.4" fill="#dbe9e6"/><rect x="718.0" y="112.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="733.0" y="112.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="748.0" y="112.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="763.0" y="112.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="778.0" y="112.0" width="10" height="10" rx="2.4" fill="#dbe9e6"/><text x="748.0" y="142.0" fill="#5f6c