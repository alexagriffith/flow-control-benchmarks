<svg xmlns="http://www.w3.org/2000/svg" width="880" height="370" viewBox="0 0 880 370" role="img" aria-label="Reserved capacity protects room before dispatch. After dispatch, eviction releases eligible batch work and the Async Processor retries the same job."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="370" fill="#ffffff"/><rect x="10" y="10" width="860" height="350" rx="8" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker><marker id="batch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker><marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="reset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b83232"/></marker></defs><text x="30.0" y="38.0" fill="#15202b" font-size="15" font-weight="800" text-anchor="start">Reserve before dispatch. Evict and retry after dispatch.</text><rect x="30" y="58" width="820" height="122" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="52.0" y="84.0" fill="#087f72" font-size="12" font-weight="800" text-anchor="start">Reserved capacity</text><rect x="70" y="112" width="92" height="42" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="116.0" y="128.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">Gateway</text><text x="116.0" y="146.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">labels</text><path d="M170.0 133.0 L202.0 133.0" stroke="#667180" stroke-width="1.35" stroke-linecap="round" fill="none" marker-end="url(#reserve-arrow)"/><rect x="210" y="90" width="318" height="78" rx="7" fill="#f1fbf8" stroke="#087f72"/><text x="369.0" y="108.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="232" y="124" width="226" height="18" rx="4" fill="#ffffff" stroke="#087f72"/><text x="248.0" y="137.0" fill="#087f72" font-size="7.5" font-weight="740" text-anchor="start">real-time dispatches</text><rect x="232" y="146" width="226" height="18" rx="4" fill="#fff7ed" stroke="#c56a00"/><text x="248.0" y="159.0" fill="#c56a00" font-size="7.0" font-weight="740" text-anchor="start">batch waits</text><path d="M458.0 133.0 L628.0 133.0" stroke="#087f72" stroke-width="1.35" stroke-linecap="round" fill="none" marker-end="url(#reserve-arrow)"/><path d="M458 155 H618" stroke="#c56a00" stroke-width="1.35" stroke-dasharray="4 6" fill="none"/><text x="560.0" y="151.0" fill="#c56a00" font-size="7.0" font-weight="740" text-anchor="middle">held before vLLM</text><rect x="646" y="96" width="118" height="76" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="705.0" y="118.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">vLLM</text><rect x="674.0" y="134.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="689.0" y="134.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="704.0" y="134.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="719.0" y="134.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="734.0" y="134.0" width="10" height="10" rx="2.4" fill="#dbe9e6" opacity="0.84"/><rect x="674.0" y="148.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="689.0" y="148.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="704.0" y="148.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="719.0" y="148.0" width="10" height="10" rx="2.4" fill="#087f72" opacity="0.84"/><rect x="734.0" y="148.0" width="10" height="10" rx="2.4" fill="#dbe9e6" opacity="0.84"/><text x="705.0" y="166.0" fill="#087f72" font-size="7.2" font-weight="700" text-anchor="middle">reserved</text><rect x="30" y="202" width="820" height="132" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="52.0" y="228.0" fill="#c56a00" font-size="12" font-weight="800" text-anchor="start">Eviction and retry</text><rect x="70" y="256" width="128" height="44" rx="7" fill="#ffffff" stroke="#c56a00"/><text x="134.0" y="273.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">Endpoint Picker</text><text x="134.0" y="291.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">selects batch</text><path d="M206.0 278.0 L246.0 278.0" stroke="#c56a00" stroke-width="1.35" stroke-linecap="round" fill="none" marker-end="url(#batch-arrow)"/><rect x="254" y="256" width="130" height="44" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="319.0" y="273.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">Gateway</text><text x="319.0" y="291.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">HTTP 429 + reset</text><path d="M392.0 258.0 L428.0 242.0" stroke="#b83232" stroke-width="1.35" stroke-linecap="round" fill="none" stroke-dasharray="4 5" marker-end="url(#reset-arrow)"/><rect x="436" y="220" width="126" height="44" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="499.0" y="237.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">vLLM</text><text x="499.0" y="255.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">stream ends</text><text x="499.0" y="278.0" fill="#087f72" font-size="7.2" font-weight="700" text-anchor="middle">capacity released</text><path d="M384.0 290.0 L428.0 306.0" stroke="#2d6cdf" stroke-width="1.35" stroke-linecap="round" fill="none" marker-end="url(#retry-arrow)"/><rect x="436" y="286" width="126" height="44" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="499.0" y="303.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">Async Processor</text><text x="4