<svg xmlns="http://www.w3.org/2000/svg" width="880" height="338" viewBox="0 0 880 338" role="img" aria-label="Reserved capacity protects room before dispatch. After dispatch, eviction releases eligible batch work and the Async Processor retries the same job."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="338" fill="#ffffff"/><rect x="10" y="10" width="860" height="318" rx="8" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker><marker id="batch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker><marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="reset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b83232"/></marker></defs><rect x="30" y="24" width="820" height="122" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="52.0" y="50.0" fill="#087f72" font-size="12" font-weight="800" text-anchor="start">Reserved capacity</text><rect x="70" y="78" width="92" height="42" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="116.0" y="94.0" fill="#15202b" font-size="8.8" font-weight="800" text-anchor="middle">Gateway</text><text x="116.0" y="112.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">labels</text><path d="M170.0 99.0 L202.0 99.0" stroke="#667180" stroke-width="1.35" stroke-linecap="round" fill="none" marker-end="url(#reserve-arrow)"/><rect x="210" y="56" width="318" height="78" rx="7" fill="#f1fbf8" stroke="#087f72"/><text x="369.0" y="74.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="232" y="90" width="226" height=