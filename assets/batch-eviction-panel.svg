<svg xmlns="http://www.w3.org/2000/svg" width="880" height="432" viewBox="0 0 880 432" role="img" aria-label="Reserved capacity keeps batch in the Endpoint Picker before vLLM. After dispatch, the Endpoint Picker can select eligible running batch, Envoy resets the vLLM stream, and the batch client retries the request."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="432" fill="#ffffff"/><rect x="10" y="10" width="860" height="412" rx="8" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker><marker id="batch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker><marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="reset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b83232"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667180"/></marker></defs><rect x="30" y="26" width="820" height="154" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="50.0" y="52.0" fill="#087f72" font-size="12" font-weight="800" text-anchor="start">Reserved capacity</text><rect x="50" y="88" width="112" height="56" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="106.0" y="111.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Gateway</text><text x="106.0" y="128.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">request labels</text><path d="M162 116 H206" stroke="#667180" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#gray-arrow)"/><r