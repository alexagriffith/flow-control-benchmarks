<svg xmlns="http://www.w3.org/2000/svg" width="880" height="410" viewBox="0 0 880 410" role="img" aria-label="Reserved capacity keeps batch in the Endpoint Picker before vLLM. After dispatch, the Endpoint Picker can select eligible running batch, Envoy resets the vLLM stream, and the batch client retries the request."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="410" fill="#ffffff"/><rect x="10" y="10" width="860" height="390" rx="8" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker><marker id="batch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker><marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="reset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b83232"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667180"/></marker></defs><rect x="30" y="26" width="820" height="144" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="50.0" y="51.0" fill="#087f72" font-size="12" font-weight="800" text-anchor="start">Reserved capacity</text><rect x="52" y="84" width="108" height="54" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="106.0" y="106.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Gateway</text><text x="106.0" y="123.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">request labels</text><path d="M160 111 H204" stroke="#667180" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#gray-arrow)"/><rect x="214" y="68" width="354" height="92" rx="7" fill="#f1fbf8" stroke="#087f72" stroke-width="1.5"/><text x="391.0" y="86.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="234" y="96" width="286" height="22" rx="4" fill="#ffffff" stroke="#087f72"/><text x="248.0" y="111.0" fill="#087f72" font-size="7.8" font-weight="750" text-anchor="start">real-time</text><rect x="234" y="126" width="286" height="24" rx="4" fill="#fff8f0" stroke="#c56a00"/><text x="248.0" y="142.0" fill="#c56a00" font-size="7.8" font-weight="750" text-anchor="start">batch queue</text><rect x="430.0" y="132.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="445.0" y="132.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="460.0" y="132.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="475.0" y="132.0" width="10" height="10" rx="2.4" fill="#c56a00"/><rect x="490.0" y="132.0" width="10" height="10" rx="2.4" fill="#c56a00"/><path d="M520 107 H674" stroke="#087f72" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#reserve-arrow)"/><rect x="686" y="76" width="122" height="72" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="747.0" y="94.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">vLLM</text><rect x="711.0" y="104.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="726.0" y="104.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="741.0" y="104.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="756.0" y="104.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="771.0" y="104.0" width="10" height="10" rx="2.4" fill="#dbe9e6"/><rect x="711.0" y="118.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="726.0" y="118.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="741.0" y="118.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="756.0" y="118.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="771.0" y="118.0" width="10" height="10" rx="2.4" fill="#dbe9e6"/><text x="747.0" y="143.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">running slots</text><rect x="30" y="184" width="820" height="194" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="50.0" y="209.0" fill="#c56a00" font-size="12" font-weight="800" text-anchor="start">Eviction and retry</text><rect x="50" y="232" width="142" height="56" rx="7" fill="#fffaf4" stroke="#c56a00"/><text x="121.0" y="255.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><text x="121.0" y="272.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">selects running batch</text><rect x="262" y="232" width="174" height="56" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="349.0" y="255.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Gateway / Envoy</text><text x="349.0" y="272.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">returns HTTP 429</text><rect x="506" y="232" width="134" height="56" rx="7" fill="#fff8f8" stroke="#b83232"/><text x="573.0" y="255.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">vLLM</text><text x="573.0" y="272.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">releases sequence</text><path d="M192 260 H262" stroke="#c56a00" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#batch-arrow)"/><text x="227.0" y="248.0" fill="#c56a00" font-size="7.0" font-weight="800" text-anchor="middle">ImmediateResponse(429)</text><path d="M436 248 H506" stroke="#b83232" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#reset-arrow)"/><text x="471.0" y="238.0" fill="#b83232" font-size="7.2" font-weight="800" text-anchor="middle">stream reset</text><rect x="506" y="316" width="142" height="46" rx="7" fill="#f7f9ff" stroke="#2d6cdf"/><text x="577.0" y="334.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Batch client</text><text x="577.0" y="351.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">Async Processor</text><path d="M349 288 V339 H506" stroke="#2d6cdf" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#retry-arrow)"/><text x="418.0" y="330.0" fill="#2d6cdf" font-size="7.2" font-weight="800" text-anchor="middle">HTTP 429</text><path d="M648 339 H772 V288 H436" stroke="#2d6cdf" stroke-width="2.0" stroke-linecap="round" stroke-linejoin="round" fill="none" marker-end="url(#retry-arrow)"/><text x="718.0" y="329.0" fill="#2d6cdf" font-size="7.2" font-weight="800" text-anchor="middle">retry as new request</text></svg>
