<svg xmlns="http://www.w3.org/2000/svg" width="880" height="398" viewBox="0 0 880 398" role="img" aria-label="Reserved capacity holds batch before vLLM. Eviction selects eligible running batch, ends its vLLM stream, returns a retryable response, and submits the job again through the normal request path."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="398" fill="#ffffff"/><rect x="10" y="10" width="860" height="378" rx="8" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="reserve-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#087f72"/></marker><marker id="batch-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker><marker id="retry-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="reset-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#b83232"/></marker><marker id="gray-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667180"/></marker></defs><rect x="30" y="26" width="820" height="138" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="50.0" y="51.0" fill="#087f72" font-size="12" font-weight="800" text-anchor="start">Reserved capacity before dispatch</text><rect x="52" y="82" width="108" height="54" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="106.0" y="104.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Gateway</text><text x="106.0" y="121.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">request labels</text><path d="M160.0 109.0 L204.0 109.0" stroke="#667180" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#gray-arrow)"/><rect x="214" y="66" width="354" height="86" rx="7" fill="#f1fbf8" stroke="#087f72" stroke-width="1.5"/><text x="391.0" y="84.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="234" y="94" width="286" height="20" rx="4" fill="#ffffff" stroke="#087f72"/><text x="248.0" y="108.0" fill="#087f72" font-size="7.6" font-weight="750" text-anchor="start">real-time dispatches</text><rect x="234" y="122" width="286" height="20" rx="4" fill="#fff8f0" stroke="#c56a00"/><text x="248.0" y="136.0" fill="#c56a00" font-size="7.6" font-weight="750" text-anchor="start">batch waits</text><path d="M520.0 104.0 L674.0 104.0" stroke="#087f72" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#reserve-arrow)"/><path d="M520 132 H638" stroke="#c56a00" stroke-width="2" stroke-dasharray="5 6" fill="none"/><text x="579.0" y="127.0" fill="#c56a00" font-size="7.3" font-weight="750" text-anchor="middle">held before vLLM</text><rect x="686" y="74" width="122" height="68" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="747.0" y="91.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">vLLM</text><rect x="711.0" y="99.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="726.0" y="99.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="741.0" y="99.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="756.0" y="99.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="771.0" y="99.0" width="10" height="10" rx="2.4" fill="#dbe9e6"/><rect x="711.0" y="113.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="726.0" y="113.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="741.0" y="113.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="756.0" y="113.0" width="10" height="10" rx="2.4" fill="#087f72"/><rect x="771.0" y="113.0" width="10" height="10" rx="2.4" fill="#dbe9e6"/><text x="747.0" y="137.0" fill="#5f6c7b" font-size="7.2" font-weight="650" text-anchor="middle">reserved slots</text><rect x="30" y="178" width="820" height="188" rx="8" fill="#fbfcfd" stroke="#dde3ea"/><text x="50.0" y="203.0" fill="#c56a00" font-size="12" font-weight="800" text-anchor="start">Eviction and retry after dispatch</text><rect x="50" y="226" width="140" height="56" rx="7" fill="#fffaf4" stroke="#c56a00"/><text x="120.0" y="249.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Endpoint Picker</text><text x="120.0" y="266.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">selects eligible batch</text><rect x="320" y="226" width="180" height="56" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="410.0" y="249.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">llm-d Gateway / Envoy</text><text x="410.0" y="266.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">resets upstream</text><rect x="610" y="226" width="130" height="56" rx="7" fill="#ffffff" stroke="#dde3ea"/><text x="675.0" y="249.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">vLLM</text><text x="675.0" y="266.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">releases sequence</text><path d="M190.0 254.0 L320.0 254.0" stroke="#c56a00" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#batch-arrow)"/><text x="255.0" y="243.0" fill="#c56a00" font-size="7.1" font-weight="800" text-anchor="middle">ImmediateResponse(429)</text><path d="M500.0 254.0 L610.0 254.0" stroke="#b83232" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#reset-arrow)"/><text x="555.0" y="243.0" fill="#b83232" font-size="7.4" font-weight="800" text-anchor="middle">stream reset</text><rect x="320" y="310" width="180" height="42" rx="7" fill="#f7f9ff" stroke="#2d6cdf"/><text x="410.0" y="326.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">HTTP 429</text><text x="410.0" y="343.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">retryable response</text><rect x="550" y="310" width="140" height="42" rx="7" fill="#f7f9ff" stroke="#2d6cdf"/><text x="620.0" y="326.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Batch client</text><text x="620.0" y="343.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">Async Processor retries</text><rect x="720" y="310" width="110" height="42" rx="7" fill="#f7f9ff" stroke="#2d6cdf"/><text x="775.0" y="326.0" fill="#15202b" font-size="9" font-weight="800" text-anchor="middle">Request path</text><text x="775.0" y="343.0" fill="#5f6c7b" font-size="7.4" font-weight="650" text-anchor="middle">new request</text><path d="M410.0 282.0 L410.0 310.0" stroke="#2d6cdf" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#retry-arrow)"/><path d="M500.0 331.0 L550.0 331.0" stroke="#2d6cdf" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#retry-arrow)"/><path d="M690.0 331.0 L720.0 331.0" stroke="#2d6cdf" stroke-width="2.0" stroke-linecap="round" fill="none" marker-end="url(#retry-arrow)"/></svg>
