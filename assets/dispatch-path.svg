<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-label="How flow control routes multi-tenant traffic through priority bands to the model server"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9a9a9a"/></marker></defs><rect width="1200" height="430" fill="#ffffff"/><text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#151515" letter-spacing="-0.4">The dispatch path under pressure</text><text x="20" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6b6b6b">The gateway tags each request. The Endpoint Picker queues by priority band, cycles tenants fairly inside a band, and dispatches when the pool has room.</text><rect x="20" y="92" width="190" height="72" rx="10" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="42" cy="118" r="6" fill="#1f8a5f"/><text x="56" y="123" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#151515" text-anchor="start">Premium tenants</text><text x="56" y="143" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">priority 100</text><line x1="210" y1="128" x2="268" y2="128" stroke="#9a9a9a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="20" y="192" width="190" height="72" rx="10" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="42" cy="218" r="6" fill="#d59a00"/><text x="56" y="223" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#151515" text-anchor="start">Standard tenants</text><text x="56" y="243" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">priority 0</text><line x1="210" y1="228" x2="268" y2="228" stroke="#9a9a9a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="20" y="292" width="190" height="72" rx="10" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="42" cy="318" r="6" fill="#1c78d8"/><text x="56" y="323" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#151515" text-anchor="start">Batch tenants</text><text x="56" y="343" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">priority -10</text><line x1="210" y1="328" x2="268" y2="328" stroke="#9a9a9a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="270" y="92" width="168" height="272" rx="10" fill="#fbfbfb" stroke="#d7d7d7"/><text x="354" y="122" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#151515" text-anchor="middle">Inference gateway</text><text x="354" y="146" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="middle">tags every request</text><rect x="288" y="170" width="132" height="76" rx="10" fill="#f6f6f6" stroke="#d7d7d7"/><text x="354" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="middle">objective header</text><text x="354" y="220" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="middle">fairness id header</text><line x1="438" y1="228" x2="496" y2="228" stroke="#9a9a9a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="498" y="74" width="420" height="308" rx="10" fill="#ffffff" stroke="#b9b9b9"/><text x="708" y="102" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="800" fill="#151515" text-anchor="middle">Endpoint Picker · flow control</text><rect x="518" y="122" width="380" height="48" rx="10" fill="#f6f6f6" stroke="#d7d7d7"/><rect x="518" y="122" width="6" height="48" rx="3" fill="#1f8a5f"/><text x="538" y="142" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Band 100 · premium</text><text x="538" y="160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">round-robin across tenants · dispatches first</text><rect x="518" y="184" width="380" height="48" rx="10" fill="#f6f6f6" stroke="#d7d7d7"/><rect x="518" y="184" width="6" height="48" rx="3" fill="#d59a00"/><text x="538" y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Band 0 · standard</text><text x="538" y="222" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">round-robin across tenants · waits behind premium</text><rect x="518" y="246" width="380" height="48" rx="10" fill="#f6f6f6" stroke="#d7d7d7"/><rect x="518" y="246" width="6" height="48" rx="3" fill="#1c78d8"/><text x="538" y="266" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Band -10 · batch</text><text x="538" y="284" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="start">round-robin across tenants · absorbs the queue</text><rect x="518" y="312" width="380" height="50" rx="10" fill="#fff6f6" stroke="#e4bcbc"/><text x="708" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">saturation gate</text><text x="708" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">holds dispatch while queue depth or KV cache read full</text><line x1="918" y1="228" x2="976" y2="228" stroke="#9a9a9a" stroke-width="1.6" marker-end="url(#arr)"/><rect x="978" y="130" width="200" height="196" rx="10" fill="#fbfbfb" stroke="#d7d7d7"/><text x="1078" y="162" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#151515" text-anchor="middle">vLLM on one GPU</text><rect x="996" y="182" width="164" height="54" rx="10" fill="#f6f6f6" stroke="#d7d7d7"/><text x="1078" y="204" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="middle">running batch</text><text x="1078" y="222" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">up to 128 sequences</text><rect x="996" y="248" width="164" height="54" rx="10" fill="#f6f6f6" stroke="#d7d7d7"/><text x="1078" y="270" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="middle">local queue</text><text x="1078" y="288" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#6b6b6b" text-anchor="middle">stays shallow by design</text><text x="20" y="412" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#4a4a4a" text-anchor="start">While the pool has room the gate is open and requests flow straight through. Past saturation the bands decide who waits.</text></svg>