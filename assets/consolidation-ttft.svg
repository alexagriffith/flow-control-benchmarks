<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="Rolling p95 time to first token stays under 75 ms as a second premium tenant joins at 100 s and a standard tenant joins at 200 s"><rect width="1200" height="420" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="16" font-weight="800" fill="#151515" text-anchor="start">Two tenants join a running pool, and the objective holds</text><text x="20" y="50" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="start">Rolling p95 time to first token, 10 s window. Premium B joins at 100 s, Standard A joins at 200 s. All three tenants track each other because the pool never reached its batch limit, which is what operating below the knee looks like.</text><line x1="64" y1="362.0" x2="1172" y2="362.0" stroke="#eeeeee"/><text x="54" y="366.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">0</text><line x1="64" y1="302.0" x2="1172" y2="302.0" stroke="#eeeeee"/><text x="54" y="306.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">25</text><line x1="64" y1="242.0" x2="1172" y2="242.0" stroke="#eeeeee"/><text x="54" y="246.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">50</text><line x1="64" y1="182.0" x2="1172" y2="182.0" stroke="#eeeeee"/><text x="54" y="186.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">75</text><line x1="64" y1="122.0" x2="1172" y2="122.0" stroke="#eeeeee"/><text x="54" y="126.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">100</text><text x="54" y="64.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#8a8a8a" text-anchor="end">ms</text><line x1="433.3333333333333" y1="66" x2="433.3333333333333" y2="362" stroke="#151515" stroke-dasharray="4 4" opacity=".35"/><text x="441.3333333333333" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="start">Premium B joins</text><line x1="802.6666666666666" y1="66" x2="802.6666666666666" y2="362" stroke="#151515" stroke-dasharray="4 4" opacity=".35"/><text x="810.6666666666666" y="78" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="start">Standard A joins</text><path d="M64.0 139.2 L82.5 255.0 L100.9 271.4 L119.4 271.3 L137.9 271.4 L156.3 269.7 L174.8 268.3 L193.3 249.8 L211.7 244.9 L230.2 248.3 L248.7 249.4 L267.1 250.8 L285.6 262.9 L304.1 269.5 L322.5 269.4 L341.0 286.6 L359.5 288.8 L377.9 287.4 L396.4 286.4 L414.9 285.4 L433.3 247.8 L451.8 246.6 L470.3 255.5 L488.7 264.6 L507.2 264.2 L525.7 261.2 L544.1 262.2 L562.6 264.9 L581.1 262.1 L599.5 260.3 L618.0 256.4 L636.5 249.2 L654.9 232.4 L673.4 226.6 L691.9 238.0 L710.3 240.8 L728.8 246.4 L747.3 243.5 L765.7 242.7 L784.2 258.0 L802.7 237.0 L821.1 234.9 L839.6 249.8 L858.1 232.8 L876.5 205.0 L895.0 215.4 L913.5 227.2 L931.9 222.6 L950.4 214.9 L968.9 226.0 L987.3 214.1 L1005.8 204.8 L1024.3 204.5 L1042.7 226.4 L1061.2 229.0 L1079.7 219.0 L1098.1 214.6 L1116.6 214.6 L1135.1 221.2 L1153.5 217.4 " fill="none" stroke="#1f8a5f" stroke-width="2.2" stroke-linejoin="round"/><path d="M433.3 204.2 L451.8 206.6 L470.3 251.8 L488.7 260.2 L507.2 261.1 L525.7 260.7 L544.1 261.4 L562.6 262.7 L581.1 266.9 L599.5 257.7 L618.0 247.9