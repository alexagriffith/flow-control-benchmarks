<svg xmlns="http://www.w3.org/2000/svg" width="880" height="264" viewBox="0 0 880 264" role="img" aria-label="In the priority-tier scenario, platinum, gold, and silver traffic had median surge p95 time to first token below one second while bronze batch exceeded 13 seconds."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="264" fill="#ffffff"/><rect x="10" y="10" width="860" height="244" rx="6" fill="#ffffff" stroke="#dde3ea"/><text x="32.0" y="38.0" fill="#5f6c7b" font-size="10" font-weight="700" text-anchor="start">Median surge p95 TTFT (seconds, log scale)</text><rect x="32" y="78" width="816" height="142" rx="6" fill="#fbfcfd" stroke="#dde3ea"/><rect x="180.0" y="104" width="155.8" height="90" fill="#eef8f6" opacity="0.75"/><line x1="180.0" y1="104.0" x2="180.0" y2="194.0" stroke="#e7ebef"/><text x="180.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">0.3 s</text><line x1="335.8" y1="104.0" x2="335.8" y2="194.0" stroke="#e7ebef"/><text x="335.8" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">1 s</text><line x1="478.0" y1="104.0" x2="478.0" y2="194.0" stroke="#e7ebef"/><text x="478.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">3 s</text><line x1="633.8" y1="104.0" x2="633.8" y2="194.0" stroke="#e7ebef"/><text x="633.8" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">10 s</text><line x1="776.0" y1="104.0" x2="776.0" y2="194.0" stroke="#e7ebef"/><text x="776.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">30 s</text><text x="56.0" y="130.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Platinum</text><rect x="180.0" y="121.0" width="596.0" height="10" rx="5" fill="#edf1f4"/><rect x="180.0" y="121.0" width="48.0" height="10" rx="5" fill="#087f72"/><text x="824.0" y="130.0" fill="#087f72" font-size="10" font-weight="800" text-anchor="end">404 ms</text><text x="56.0" y="152.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Gold</text><rect x="180.0" y="143.0" width="596.0" height="10" rx="5" fill="#edf1f4"/><rect x="180.0" y="143.0" width="68.9" height="10" rx="5" fill="#c69200"/><text x="824.0" y="152.0" fill="#c69200" font-size="10" font-weight="800" text-anchor="end">511 ms</text><text x="56.0" y="174.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Silver</text><rect x="180.0" y="165.0" width="596.0" height="10" rx="5" fill="#edf1f4"/><rect x="180.0" y="165.0" width="101.3" height="10" rx="5" fill="#2d6cdf"/><text x="824.0" y="174.0" fill="#2d6cdf" font-size="10" font-weight="800" text-anchor="end">656 ms</text><text x="56.0" y="196.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Bronze batch</text><rect x="180.0" y="187.0" width="596.0" height="10" rx="5" fill="#edf1f4"/><rect x="180.0" y="187.0" width="490.4" height="10" rx="5" fill="#b85c00"/><text x="824.0" y="196.0" fill="#b85c00" font-size="10" font-weight="800" text-anchor="end">13.3 s</text></svg>
