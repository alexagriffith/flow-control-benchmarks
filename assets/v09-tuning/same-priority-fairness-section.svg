<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="In the same-priority fairness scenario, the tenant sending the burst waited about 12.1 seconds while peers B and C stayed near half a second."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="270" fill="#ffffff"/><rect x="10" y="10" width="860" height="250" rx="6" fill="#ffffff" stroke="#dde3ea"/><text x="32.0" y="38.0" fill="#15202b" font-size="17" font-weight="780" text-anchor="start">Peers stayed near 0.5 seconds during Tenant A&#x27;s burst</text><text x="32.0" y="58.0" fill="#5f6c7b" font-size="10" font-weight="700" text-anchor="start">Median surge p95 TTFT (seconds, log scale)</text><rect x="32" y="78" width="816" height="158" rx="6" fill="#fbfcfd" stroke="#dde3ea"/><rect x="172.0" y="104" width="157.9" height="110" fill="#eef8f6" opacity="0.75"/><line x1="172.0" y1="104.0" x2="172.0" y2="214.0" stroke="#e7ebef"/><text x="172.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">0.3 s</text><line x1="329.9" y1="104.0" x2="329.9" y2="214.0" stroke="#e7ebef"/><text x="329.9" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">1 s</text><line x1="474.0" y1="104.0" x2="474.0" y2="214.0" stroke="#e7ebef"/><text x="474.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">3 s</text><line x1="631.9" y1="104.0" x2="631.9" y2="214.0" stroke="#e7ebef"/><text x="631.9" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">10 s</text><line x1="776.0" y1="104.0" x2="776.0" y2="214.0" stroke="#e7ebef"/><text x="776.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">30 s</text><text x="56.0" y="136.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Tenant A burst</text><line x1="172.0" y1="132.0" x2="776.0" y2="132.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><line x1="172.0" y1="132.0" x2="656.9" y2="132.0" stroke="#c56a00" stroke-width="10" stroke-linecap="round"/><text x="824.0" y="136.0" fill="#c56a00" font-size="10" font-weight="800" text-anchor="end">12.1 s</text><text x="56.0" y="172.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Peer B</text><line x1="172.0" y1="168.0" x2="776.0" y2="168.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><line x1="172.0" y1="168.0" x2="246.0" y2="168.0" stroke="#087f72" stroke-width="10" stroke-linecap="round"/><text x="824.0" y="172.0" fill="#087f72" font-size="10" font-weight="800" text-anchor="end">527 ms</text><text x="56.0" y="208.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Peer C</text><line x1="172.0" y1="204.0" x2="776.0" y2="204.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><line x1="172.0" y1="204.0" x2="256.2" y2="204.0" stroke="#2d6cdf" stroke-width="10" stroke-linecap="round"/><text x="824.0" y="208.0" fill="#2d6cdf" font-size="10" font-weight="800" text-anchor="end">570 ms</text></svg>
