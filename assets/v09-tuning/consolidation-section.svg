<svg xmlns="http://www.w3.org/2000/svg" width="880" height="270" viewBox="0 0 880 270" role="img" aria-label="In the tenant-consolidation scenario, two high-priority tenants stayed below one second while the lower-priority burst waited about 25.9 seconds."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="270" fill="#ffffff"/><rect x="10" y="10" width="860" height="250" rx="6" fill="#ffffff" stroke="#dde3ea"/><text x="32.0" y="38.0" fill="#15202b" font-size="17" font-weight="780" text-anchor="start">Two high-priority tenants shared the pool</text><text x="32.0" y="58.0" fill="#5f6c7b" font-size="10" font-weight="700" text-anchor="start">Median surge p95 TTFT (seconds, log scale)</text><rect x="32" y="78" width="816" height="158" rx="6" fill="#fbfcfd" stroke="#dde3ea"/><rect x="190.0" y="104" width="153.2" height="110" fill="#eef8f6" opacity="0.75"/><line x1="190.0" y1="104.0" x2="190.0" y2="214.0" stroke="#e7ebef"/><text x="190.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">0.3 s</text><line x1="343.2" y1="104.0" x2="343.2" y2="214.0" stroke="#e7ebef"/><text x="343.2" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">1 s</text><line x1="483.0" y1="104.0" x2="483.0" y2="214.0" stroke="#e7ebef"/><text x="483.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">3 s</text><line x1="636.2" y1="104.0" x2="636.2" y2="214.0" stroke="#e7ebef"/><text x="636.2" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">10 s</text><line x1="776.0" y1="104.0" x2="776.0" y2="214.0" stroke="#e7ebef"/><text x="776.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">30 s</text><text x="56.0" y="136.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">High priority A</text><line x1="190.0" y1="132.0" x2="776.0" y2="132.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><line x1="190.0" y1="132.0" x2="257.2" y2="132.0" stroke="#087f72" stroke-width="10" stroke-linecap="round"/><text x="824.0" y="136.0" fill="#087f72" font-size="10" font-weight="800" text-anchor="end">509 ms</text><text x="56.0" y="172.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">High priority B</text><line x1="190.0" y1="168.0" x2="776.0" y2="168.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><line x1="190.0" y1="168.0" x2="268.5" y2="168.0" stroke="#2d6cdf" stroke-width="10" stroke-linecap="round"/><text x="824.0" y="172.0" fill="#2d6cdf" font-size="10" font-weight="800" text-anchor="end">556 ms</text><text x="56.0" y="208.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Lower-priority burst</text><line x1="190.0" y1="204.0" x2="776.0" y2="204.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><line x1="190.0" y1="204.0" x2="757.3" y2="204.0" stroke="#c56a00" stroke-width="10" stroke-linecap="round"/><text x="824.0" y="208.0" fill="#c56a00" font-size="10" font-weight="800" text-anchor="end">25.9 s</text></svg>
