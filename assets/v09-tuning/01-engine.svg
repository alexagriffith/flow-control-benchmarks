<svg xmlns="http://www.w3.org/2000/svg" width="880" height="268" viewBox="0 0 880 268" role="img" aria-label="Raising the vLLM sequence limit from 128 to 192 added 1.4 requests per second while p95 time per output token increased from 19.6 to 28.9 milliseconds per token"><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="268" fill="#f7f8fa"/><rect x="20" y="10" width="840" height="248" fill="#ffffff" stroke="#dde3ea" rx="6"/><rect x="20" y="10" width="840" height="4" fill="#2d6cdf" rx="6"/><text x="38.0" y="36.0" fill="#15202b" font-size="15" font-weight="750" text-anchor="start">More running sequences added little throughput and more token delay</text><text x="38.0" y="52.0" fill="#5f6c7b" font-size="10" font-weight="650" text-anchor="start">Three matched runs per setting</text><text x="126.0" y="73.0" fill="#087f72" font-size="9" font-weight="750" text-anchor="start">Served throughput (requests/s)</text><text x="810.0" y="73.0" fill="#c56a00" font-size="9" font-weight="750" text-anchor="end">p95 TPOT (ms/token)</text><rect x="72.0" y="88.0" width="108" height="126.0" fill="#087f72" opacity="0.10"/><line x1="126.0" y1="214.0" x2="810.0" y2="214.0" stroke="#e7ebef"/><text x="114.0" y="217.0" fill="#087f72" font-size="8" font-weight="600" text-anchor="end">50</text><line x1="126.0" y1="163.6" x2="810.0" y2="163.6" stroke="#e7ebef"/><text x="114.0" y="166.6" fill="#087f72" font-size="8" font-weight="600" text-anchor="end">51</text><line x1="126.0" y1="113.2" x2="810.0" y2="113.2" stroke="#e7ebef"/><text x="114.0" y="116.2" fill="#087f72" font-size="8" font-weight="600" text-anchor="end">52</text><text x="822.0" y="196.0" fill="#c56a00" font-size="8" font-weight="600" text-anchor="start">20</text><text x="822.0" y="143.5" fill="#c56a00" font-size="8" font-weight="600" text-anchor="start">25</text><text x="822.0" y="91.0" fill="#c56a00" font-size="8" font-weight="600" text-anchor="start">30</text><polyline points="126.0,187.3 46