<svg xmlns="http://www.w3.org/2000/svg" width="880" height="264" viewBox="0 0 880 264" role="img" aria-label="In the priority-tier scenario, platinum, gold, and silver traffic had median surge p95 time to first token below one second while bronze batch exceeded 13 seconds."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="264" fill="#ffffff"/><rect x="10" y="10" width="860" height="244" rx="6" fill="#ffffff" stroke="#dde3ea"/><text x="32.0" y="38.0" fill="#15202b" font-size="17" font-weight="780" text-anchor="start">Bronze batch absorbed the surge delay</text><text x="32.0" y="58.0" fill="#5f6c7b" font-size="10" font-weight="700" text-anchor="start">Median surge p95 TTFT (seconds, log scale)</text><rect x="32" y="78" width="816" height="142" rx="6" fill="#fbfcfd" stroke="#dde3ea"/><rect x="180.0" y="104" width="155.8" height="90" fill="#eef8f6" opacity="0.75"/><line x1="180.0" y1="104.0" x2="180.0" y2="194.0" stroke="#e7ebef"/><text x="180.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">0.3 s</text><line x1="335.8" y1="104.0" x2="335.8" y2="194.0" stroke="#e7ebef"/><text x="335.8" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">1 s</text><line x1="478.0" y1="104.0" x2="478.0" y2="194.0" stroke="#e7ebef"/><text x="478.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">3 s</text><line x1="633.8" y1="104.0" x2="633.8" y2="194.0" stroke="#e7ebef"/><text x="633.8" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">10 s</text><line x1="776.0" y1="104.0" x2="776.0" y2="194.0" stroke="#e7ebef"/><text x="776.0" y="100.0" fill="#5f6c7b" font-size="8" font-weight="600" text-anchor="middle">30 s</text><text x="56.0" y="130.0" fill="#15202b" font-size="10" font-weight="720" text-anchor="start">Platinum</text><line x1="180.0" y1="126.0" x2="776.0" y2="126.0" stroke="#edf1f4" stroke-width="10" stroke-linecap="round"/><l