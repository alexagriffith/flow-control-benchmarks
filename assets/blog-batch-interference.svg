<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Batch interference can delay realtime traffic</title>
  <desc id="desc">Batch occupies vLLM before realtime demand arrives. Realtime moves to the front of the queue but still waits until running capacity is released.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#7b8794"/>
    </marker>
  </defs>

  <rect width="1200" height="520" fill="#f4f7f9"/>
  <rect x="38" y="38" width="1124" height="444" rx="8" fill="#ffffff" stroke="#cdd7df"/>

  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="78" y="84" font-size="13" font-weight="800" fill="#b83232">BATCH INTERFERENCE</text>
    <text x="78" y="132" font-size="38" font-weight="800" fill="#111820">Batch can delay realtime after it enters vLLM.</text>
    <text x="78" y="164" font-size="16" fill="#536273">Priority moves realtime forward in the queue. Running batch continues to occupy model capacity.</text>

    <g transform="translate(78,204)">
      <rect width="286" height="200" rx="7" fill="#f7f9fb" stroke="#cdd7df"/>
      <text x="22" y="32" font-size="12" font-weight="800" fill="#536273">1  BATCH STARTS FIRST</text>
      <text x="22" y="62" font-size="17" font-weight="800" fill="#111820">Batch occupies vLLM</text>
      <g transform="translate(22,84)">
        <rect width="48" height="34" rx="4" fill="#6650a4"/><rect x="56" width="48" height="34" rx="4" fill="#6650a4"/>
        <rect x="112" width="48" height="34" rx="4" fill="#6650a4"/><rect x="168" width="48" height="34" rx="4" fill="#6650a4"/>
        <rect y="42" width="48" height="34" rx="4" fill="#6650a4"/><rect x="56" y="42" width="48" height="34" rx="4" fill="#6650a4"/>
        <rect x="112" y="42" width="48" height="34" rx="4" fill="#6650a4"/><rect x="168" y="42" width="48" height="34" rx="4" fill="#6650a4"/>
      </g>
      <text x="22" y="180" font-size="13" fill="#536273">Running sequences are generating tokens.</text>
    </g>

    <path d="M 382 304 H 438" fill="none" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(456,204)">
      <rect width="286" height="200" rx="7" fill="#f7f9fb" stroke="#cdd7df"/>
      <text x="22" y="32" font-size="12" font-weight="800" fill="#536273">2  REALTIME ARRIVES</text>
      <text x="22" y="62" font-size="17" font-weight="800" fill="#111820">Realtime moves to the front</text>
      <rect x="22" y="88" width="242" height="42" rx="5" fill="#eaf0ff" stroke="#2f6fed"/>
      <circle cx="44" cy="109" r="8" fill="#2f6fed"/>
      <text x="62" y="114" font-size="14" font-weight="800" fill="#2f6fed">Realtime request</text>
      <rect x="22" y="140" width="242" height="28" rx="4" fill="#f3f0f8" stroke="#d7cfea"/>
      <text x="34" y="159" font-size="12" fill="#6650a4">New batch remains queued</text>
      <text x="22" y="188" font-size="13" fill="#536273">Priority order is working.</text>
    </g>

    <path d="M 760 304 H 816" fill="none" stroke="#7b8794" stroke-width="3" marker-end="url(#arrow)"/>

    <g transform="translate(834,204)">
      <rect width="288" height="200" rx="7" fill="#fff1f1" stroke="#e7a9a9"/>
      <text x="22" y="32" font-size="12" font-weight="800" fill="#b83232">3  NO CAPACITY IS FREE</text>
      <text x="22" y="62" font-size="17" font-weight="800" fill="#111820">Realtime still waits</text>
      <g transform="translate(22,84)">
        <rect width="190" height="28" rx="4" fill="#6650a4"/>
        <text x="95" y="19" text-anchor="middle" font-size="12" font-weight="800" fill="#ffffff">RUNNING BATCH</text>
        <line x1="204" y1="-4" x2="204" y2="88" stroke="#b83232" stroke-width="3"/>
        <circle cx="238" cy="36" r="24" fill="#eaf0ff" stroke="#2f6fed" stroke-width="2"/>
        <circle cx="238" cy="36" r="6" fill="#2f6fed"/>
        <path d="M238 36 L238 20 M238 36 L249 42" fill="none" stroke="#2f6fed" stroke-width="3" stroke-linecap="round"/>
      </g>
      <text x="22" y="180" font-size="13" fill="#b83232">Running work must release capacity first.</text>
    </g>

    <rect x="78" y="428" width="1044" height="34" rx="5" fill="#edf7f5" stroke="#9fcfc7"/>
    <circle cx="98" cy="445" r="6" fill="#087f73"/>
    <text x="114" y="450" font-size="13" font-weight="700" fill="#335c57">Reserved capacity keeps room available. Eviction can reclaim eligible batch work that is already running.</text>
  </g>
</svg>
