<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-label="Three measured outcomes: priority admission kept premium traffic below standard p95 TTFT, batch overload produced zero rejections with flow control on, and premium tenants stayed lower latency in a consolidated pool."><rect width="1200" height="330" fill="#ffffff"/><rect x="18" y="14" width="374" height="302" rx="8" fill="#fbfbfb" stroke="#d7d7d7"/><text x="40" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1f8a5f" text-anchor="start" letter-spacing="1">SERVICE PRIORITY</text><text x="40" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" text-anchor="start">Priority admission</text><text x="40" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="550" fill="#6b6b6b" text-anchor="start">p95 TTFT under saturated load</text><text x="111" y="134.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#59636e" text-anchor="middle">1,406 ms</text><rect x="58" y="144.0" width="106" height="112.0" rx="6" fill="#59636e"/><text x="111" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#4b4f54" text-anchor="middle">Standard (on)</text><text x="299" y="157.0213371266003" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f8a5f" text-anchor="middle">1,117 ms</text><rect x="246" y="167.0" width="106" height="89.0" rx="6" fill="#1f8a5f"/><text x="299" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#4b4f54" text-anchor="middle">Premium (on)</text><rect x="404" y="14" width="374" height="302" rx="8" fill="#fbfbfb" stroke="#d7d7d7"/><text x="426" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1f8a5f" text-anchor="start" letter-spacing="1">BATCH OVERLOAD</text><text x="426" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" text-anchor="start">Zero rejections</text><text x="426" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="550" fill="#6b6b6b" text-anchor="start">HTTP 429 responses</text><text x="497" y="134.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#ee0000" text-anchor="middle">48,224</text><rect x="444" y="144.0" width="106" height="112.0" rx="6" fill="#ee0000"/><text x="497" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#4b4f54" text-anchor="middle">Gate off</text><text x="685" y="248" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f8a5f" text-anchor="middle">0</text><text x="685" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#4b4f54" text-anchor="middle">Gate on</text><rect x="790" y="14" width="374" height="302" rx="8" fill="#fbfbfb" stroke="#d7d7d7"/><text x="812" y="44" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1f8a5f" text-anchor="start" letter-spacing="1">SHARED POOL</text><text x="812" y="80" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" text-anchor="start">Shared pool protected</text><text x="812" y="104" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="550" fill="#6b6b6b" text-anchor="start">p95 TTFT in one model pool</text><text x="883" y="134.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#59636e" text-anchor="middle">1,062 ms</text><rect x="830" y="144.0" width="106" height="112.0" rx="6" fill="#59636e"/><text x="883" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#4b4f54" text-anchor="middle">Standard</text><text x="1071" y="162.09673652103638" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="800" fill="#1f8a5f" text-anchor="middle">795 ms</text><rect x="1018" y="172.1" width="106" height="83.9" rx="6" fill="#1f8a5f"/><text x="1071" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="650" fill="#4b4f54" text-anchor="middle">Premium</text></svg>