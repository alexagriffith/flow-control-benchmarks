<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" font-family="-apple-system,system-ui,sans-serif">
<rect width="920" height="560" fill="#ffffff"/>
<text x="30" y="34" font-size="21" font-weight="700" fill="#151515">Flow control: what it does, off vs on</text>
<text x="30" y="56" font-size="12.5" fill="#6b6b6b">One H100, GPT-OSS 20B, behind the llm-d inference gateway. The pattern is the finding; numbers track the hardware.</text>
<rect x="30" y="74" width="418" height="216" rx="12" fill="#fbfbfa" stroke="#e8e8e6"/>
<rect x="30" y="74" width="4" height="216" rx="2" fill="#1f8a5f"/>
<text x="50" y="102" font-size="11" font-weight="700" fill="#1f8a5f" letter-spacing="0.5">SERVICE TIERS</text>
<text x="50" y="128" font-size="18" font-weight="700" fill="#151515">Premium keeps its place</text>
<text x="50" y="152" font-size="12.5" fill="#444">Under a surge it didn't cause, the interactive tier</text>
<text x="50" y="169" font-size="12.5" fill="#444">holds its latency while standard absorbs the wait.</text>
<text x="50" y="260" font-size="15" font-weight="700" fill="#1f8a5f">~7x faster premium p95</text>
<text x="50" y="277" font-size="11.5" fill="#6b6b6b">1778 ms → 251 ms, gate off → on</text>
<rect x="472" y="74" width="418" height="216" rx="12" fill="#fbfbfa" stroke="#e8e8e6"/>
<rect x="472" y="74" width="4" height="216" rx="2" fill="#ee0000"/>
<text x="492" y="102" font-size="11" font-weight="700" fill="#ee0000" letter-spacing="0.5">BATCH ISOLATION</text>
<text x="492" y="128" font-size="18" font-weight="700" fill="#151515">Overload is queued, not dropped</text>
<text x="492" y="152" font-size="12.5" fill="#444">A batch flood is held in the queue instead of shed,</text>
<text x="492" y="169" font-size="12.5" fill="#444">so no request is rejected and the app builds no</text>
<text x="492" y="186" font-size="12.5" fill="#444">retry logic.</text>
<text x="492" y="260" font-size="15" font-weight="700" fill="#ee0000">Rejections eliminated</text>
<text x="492" y="277" font-size="11.5" fill="#6b6b6b">48,224 → 0 requests rejected</text>
<rect x="30" y="314" width="418" height="216" rx="12" fill="#fbfbfa" stroke="#e8e8e6"/>
<rect x="30" y="314" width="4" height="216" rx="2" fill="#1c78d8"/>
<text x="50" y="342" font-size="11" font-weight="700" fill="#1c78d8" letter-spacing="0.5">CONSOLIDATION</text>
<text x="50" y="368" font-size="18" font-weight="700" fill="#151515">A noisy neighbor stays contained</text>
<text x="50" y="392" font-size="12.5" fill="#444">Interactive tenants share one GPU with a flooding</text>
<text x="50" y="409" font-size="12.5" fill="#444">tenant and keep their place in line.</text>
<text x="50" y="500" font-size="15" font-weight="700" fill="#1c78d8">Premium held ahead</text>
<text x="50" y="517" font-size="11.5" fill="#6b6b6b">795 ms vs standard 1062 ms</text>
<rect x="472" y="314" width="418" height="216" rx="12" fill="#fbfbfa" stroke="#e8e8e6"/>
<rect x="472" y="314" width="4" height="216" rx="2" fill="#6b6b6b"/>
<text x="492" y="342" font-size="11" font-weight="700" fill="#6b6b6b" letter-spacing="0.5">THE BOUNDARY</text>
<text x="492" y="368" font-size="18" font-weight="700" fill="#151515">It acts across tiers, not among equals</text>
<text x="492" y="392" font-size="12.5" fill="#444">Same-priority tenants share one batch, so fairness</text>
<text x="492" y="409" font-size="12.5" fill="#444">bounds a hog's share but not a peer's tail. A calm</text>
<text x="492" y="426" font-size="12.5" fill="#444">pool sees no effect.</text>
<text x="492" y="500" font-size="15" font-weight="700" fill="#6b6b6b">Honest limit</text>
<text x="492" y="517" font-size="11.5" fill="#6b6b6b">reorders who waits; adds no capacity</text>
</svg>