<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-label="Premium p95 time to first token, flow control off versus on, across the four scenarios"><rect width="1200" height="470" fill="#ffffff"/><text x="20" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="24" font-weight="800" fill="#151515" text-anchor="start" letter-spacing="-0.5">Flow control, off vs on</text><text x="20" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#6b6b6b" text-anchor="start">Premium p95 time to first token on one GPU, GPT-OSS 20B behind the llm-d inference gateway. Every number is measured from the benchmark data.</text><rect x="20" y="88" width="282" height="350" rx="14" fill="#fbfbfb" stroke="#d7d7d7"/><text x="40" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1f8a5f" text-anchor="start" letter-spacing="1.2">SERVICE TIERS</text><text x="40" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#151515" text-anchor="start" letter-spacing="-0.5">Priority admission</text><text x="40" y="174" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">premium ahead of standard</text><rect x="40.0" y="226.1" width="74.0" height="111.9" rx="6" fill="#9aa0a6"/><text x="77.0" y="220.135593220339" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">1406</text><text x="77.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate off</text><rect x="154.0" y="249.1" width="74.0" height="88.9" rx="6" fill="#1f8a5f"/><text x="191.0" y="243.12905947874725" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">1117</text><text x="191.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate on</text><text x="40" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Premium 1117 ms vs standard 1406 ms</text><text x="40" y="403" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">under saturated load.</text><rect x="326" y="88" width="282" height="350" rx="14" fill="#fbfbfb" stroke="#d7d7d7"/><text x="346" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ee0000" text-anchor="start" letter-spacing="1.2">BATCH ISOLATION</text><text x="346" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#151515" text-anchor="start" letter-spacing="-0.5">Zero rejections</text><text x="346" y="174" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">429s eliminated, gate on</text><rect x="346.0" y="206.0" width="74.0" height="132.0" rx="6" fill="#ee0000"/><text x="383.0" y="200" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#ee0000" text-anchor="middle">48,224</text><text x="383.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate off</text><rect x="460.0" y="332.0" width="74.0" height="6.0" rx="3" fill="#1f8a5f"/><text x="497.0" y="326" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#1f8a5f" text-anchor="middle">0</text><text x="497.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate on</text><text x="346" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">48,224 rejected with the gate off.</text><text x="346" y="403" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">None with it on.</text><rect x="632" y="88" width="282" height="350" rx="14" fill="#fbfbfb" stroke="#d7d7d7"/><text x="652" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#1c78d8" text-anchor="start" letter-spacing="1.2">CONSOLIDATION</text><text x="652" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#151515" text-anchor="start" letter-spacing="-0.5">Premium held</text><text x="652" y="174" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">p95 protected under a standard flood</text><rect x="652.0" y="226.1" width="74.0" height="111.9" rx="6" fill="#9aa0a6"/><text x="689.0" y="220.135593220339" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">886</text><text x="689.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate off</text><rect x="766.0" y="237.6" width="74.0" height="100.4" rx="6" fill="#1c78d8"/><text x="803.0" y="231.55427853907597" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">795</text><text x="803.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate on</text><text x="652" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">886 ms -&gt; 795 ms while standard</text><text x="652" y="403" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">floods the shared pool.</text><rect x="938" y="88" width="282" height="350" rx="14" fill="#fbfbfb" stroke="#d7d7d7"/><text x="958" y="118" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#d59a00" text-anchor="start" letter-spacing="1.2">FAIRNESS</text><text x="958" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="27" font-weight="800" fill="#151515" text-anchor="start" letter-spacing="-0.5">Within band</text><text x="958" y="174" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">modest effect inside one priority band</text><rect x="958.0" y="226.1" width="74.0" height="111.9" rx="6" fill="#9aa0a6"/><text x="995.0" y="220.135593220339" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">894</text><text x="995.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate off</text><rect x="1072.0" y="227.6" width="74.0" height="110.4" rx="6" fill="#d59a00"/><text x="1109.0" y="221.63712888181092" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="800" fill="#151515" text-anchor="middle">882</text><text x="1109.0" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#4a4a4a" text-anchor="middle">gate on</text><text x="958" y="388" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">882 vs 894 ms. Same-band traffic</text><text x="958" y="403" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">shares evenly, as designed.</text></svg>