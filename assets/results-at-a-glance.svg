<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 210" role="img" aria-label="Results at a glance across the four scenarios"><rect width="1200" height="210" fill="#ffffff"/><text x="20" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#151515" letter-spacing="-0.5">Results at a glance</text><text x="20" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#6b6b6b">One GPU, GPT-OSS 20B behind the llm-d inference gateway. Every number comes from the accepted run for that scenario.</text><rect x="20.0" y="70" width="278.0" height="120" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="36.0" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ee0000" letter-spacing="1.2">1 · CONSOLIDATION</text><text x="36.0" y="126" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" letter-spacing="-0.5">114 to 125 ms</text><text x="36.0" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">p95 TTFT, target 300 ms</text><text x="36.0" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">Two tenants, one GPU. Target upheld in</text><text x="36.0" y="181" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">every counted repeat.</text><rect x="314.0" y="70" width="278.0" height="120" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="330.0" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ee0000" letter-spacing="1.2">2 · SERVICE TIERS</text><text x="330.0" y="126" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" letter-spacing="-0.5">41 vs 379 ms</text><text x="330.0" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">p50 TTFT, premium vs standard</text><text x="330.0" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">Standard surges past saturation. Premium</text><text x="330.0" y="181" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">stays ahead.</text><rect x="608.0" y="70" width="278.0" height="120" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="624.0" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ee0000" letter-spacing="1.2">3 · FAIRNESS</text><text x="624.0" y="126" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" letter-spacing="-0.5">382 vs 214 ms</text><text x="624.0" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">p50 TTFT, spiker vs peer average</text><text x="624.0" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">The spiking tenant carries the queue it</text><text x="624.0" y="181" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">creates.</text><rect x="902.0" y="70" width="278.0" height="120" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><text x="918.0" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="800" fill="#ee0000" letter-spacing="1.2">4 · BATCH ISOLATION</text><text x="918.0" y="126" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="25" font-weight="800" fill="#151515" letter-spacing="-0.5">202 vs 64 ms</text><text x="918.0" y="144" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">mean queue time, batch vs premium</text><text x="918.0" y="166" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">Batch triples the load and still absorbs</text><text x="918.0" y="181" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#4a4a4a">the waiting.</text></svg>