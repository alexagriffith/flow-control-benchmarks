<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">One pool. Protected latency. Completed batch.</title>
  <desc id="desc">Flow control lets chat and batch share one GPU pool while realtime latency stays near 340 ms and every evicted batch job completes once.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f3f6f8"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="520" fill="url(#bg)"/>

  <text x="600" y="72" text-anchor="middle" font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="12" font-weight="800" fill="#087f73" letter-spacing="0.1em">FLOW CONTROL · BATCH EVICTION</text>

  <text x="600" y="148" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="56" font-weight="800" fill="#111820" letter-spacing="-0.03em">One pool.</text>
  <text x="600" y="214" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="56" font-weight="800" fill="#111820" letter-spacing="-0.03em">Protected latency.</text>
  <text x="600" y="280" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="56" font-weight="800" fill="#087f73" letter-spacing="-0.03em">Completed batch.</text>

  <text x="600" y="322" text-anchor="middle" font-family="Inter, ui-sans-serif, sans-serif" font-size="18" fill="#5d6873">Consolidate chat and batch on shared GPUs without choosing cost or user experience.</text>

  <rect x="120" y="352" width="960" height="132" rx="8" fill="#111820"/>
  <g font-family="Inter, ui-sans-serif, sans-serif">
    <text x="200" y="396" text-anchor="middle" font-size="11" font-weight="750" fill="#8fd9cc" letter-spacing="0.06em">VALUE</text>
    <text x="200" y="432" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">Share silicon</text>
    <text x="200" y="458" text-anchor="middle" font-size="13" fill="#b8c4ce">One fleet, not two idle pools</text>

    <line x1="400" y1="372" x2="400" y2="464" stroke="#ffffff" stroke-opacity="0.14"/>

    <text x="600" y="396" text-anchor="middle" font-size="11" font-weight="750" fill="#8fd9cc" letter-spacing="0.06em">PROOF</text>
    <text x="600" y="432" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">~341 ms TTFT</text>
    <text x="600" y="458" text-anchor="middle" font-size="13" fill="#b8c4ce">561 ms without protection ? 341 ms with</text>

    <line x1="800" y1="372" x2="800" y2="464" stroke="#ffffff" stroke-opacity="0.14"/>

    <text x="1000" y="396" text-anchor="middle" font-size="11" font-weight="750" fill="#8fd9cc" letter-spacing="0.06em">TRUST</text>
    <text x="1000" y="432" text-anchor="middle" font-size="22" font-weight="800" fill="#ffffff">38 ? 38 ? 38</text>
    <text x="1000" y="458" text-anchor="middle" font-size="13" fill="#b8c4ce">Evicted, retried, one result each</text>
  </g>
</svg>
