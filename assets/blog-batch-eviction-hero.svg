<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Realtime and batch share one GPU pool</title>
  <desc id="desc">A shared GPU pool preserves realtime p95 time to first token while evicted batch work is safely retried.</desc>
  <defs>
    <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#2f6fed"/></marker>
    <marker id="arrow-teal" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 Z" fill="#087f73"/></marker>
  </defs>
  <rect width="1200" height="630" fill="#f4f7f9"/>
  <rect x="38" y="38" width="1124" height="554" rx="8" fill="#ffffff" stroke="#cdd7df"/>
  <g font-family="Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="78" y="84" font-size="13" font-weight="800" fill="#087f73">FLOW CONTROL WITH BATCH EVICTION</text>
    <text x="78" y="142" font-size="45" font-weight="800" fill="#111820">Share one GPU pool.</text>
    <text x="78" y="194" font-size="41" font-weight="800" fill="#111820">Preserve realtime p95 TTFT.</text>
    <text x="78" y="246" font-size="34" font-weight="800" fill="#6650a4">Batch is safely retried when evicted.</text>
    <text x="78" y="286" font-size="17" fill="#536273">Realtime gets capacity when demand rises.</text>
    <g transform="translate(710,82)">
      <text x="0" y="0" font-size="13" font-weight="800" fill="#536273">SHARED GPU POOL</text>
      <rect x="0" y="20" width="390" height="238" rx="8" fill="#eef3f7" stroke="#aab8c4"/>
      <text x="20" y="52" font-size="15" font-weight="750" fill="#111820">vLLM running sequences</text>
      <g transform="translate(20,72)">
        <rect width="80" height="34" rx="4" fill="#2f6fed"/><rect x="88" width="80" height="34" rx="4" fill="#2f6fed"/>
        <rect x="176" width="80" height="34" rx="4" fill="#6650a4"/><rect x="264" width="80" height="34" rx="4" fill="#6650a4"/>
        <rect y="42" width="80" height="34" rx="4" fill="#2f6fed"/><rect x="88" y="42" width="80" height="34" rx="4" fill="#2f6fed"/>
        <rect x="176" y="42" width="80" height="34" rx="4" fill="#6650a4"/><rect x="264" y="42" width="80" height="34" rx="4" fill="#6650a4" opacity="0.28" stroke="#6650a4" stroke-dasharray="6 4"/>
        <rect y="84" width="80" height="34" rx="4" fill="#2f6fed"/><rect x="88" y="84" width="80" height="34" rx="4" fill="#2f6fed"/>
        <rect x="176" y="84" width="80" height="34" rx="4" fill="#6650a4" opacity="0.28" stroke="#6650a4" stroke-dasharray="6 4"/><rect x="264" y="84" width="80" height="34" rx="4" fill="#ffffff" stroke="#aab8c4"/>
      </g>
      <circle cx="26" cy="220" r="6" fill="#2f6fed"/><text x="40" y="225" font-size="13" fill="#536273">Realtime</text>
      <circle cx="132" cy="220" r="6" fill="#6650a4"/><text x="146" y="225" font-size="13" fill="#536273">Batch</text>
      <rect x="226" y="212" width="14" height="14" rx="2" fill="#6650a4" opacity="0.28" stroke="#6650a4" stroke-dasharray="4 3"/><text x="250" y="225" font-size="13" fill="#536273">Evicted</text>
      <path d="M 330 112 C 405 112, 405 186, 338 186" fill="none" stroke="#6650a4" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
      <rect x="278" y="274" width="112" height="52" rx="6" fill="#f3f0f8" stroke="#6650a4"/>
      <text x="334" y="296" text-anchor="middle" font-size="12" font-weight="800" fill="#6650a4">RETRY</text>
      <text x="334" y="315" text-anchor="middle" font-size="12" fill="#536273">new request</text>
      <path d="M 278 300 C 196 300, 196 250, 230 250" fill="none" stroke="#087f73" stroke-width="4" marker-end="url(#arrow-teal)"/>
    </g>
    <line x1="78" y1="352" x2="1122" y2="352" stroke="#d8e0e6"/>
    <text x="78" y="394" font-size="13" font-weight="800" fill="#536273">ONE SHARED GPU POOL</text>
    <g transform="translate(78,420)">
      <circle cx="20" cy="35" r="10" fill="#2f6fed"/>
      <text x="46" y="29" font-size="16" font-weight="800" fill="#111820">Realtime</text>
      <text x="46" y="52" font-size="14" fill="#536273">p95 TTFT remains protected as batch shares the pool</text>
      <path d="M 430 35 H 548" fill="none" stroke="#2f6fed" stroke-width="4" marker-end="url(#arrow-blue)"/>
      <rect x="570" y="8" width="192" height="54" rx="6" fill="#eaf0ff" stroke="#94b3ff"/>
      <text x="666" y="31" text-anchor="middle" font-size="13" font-weight="800" fill="#2f6fed">PROTECTED ACCESS</text>
      <text x="666" y="49" text-anchor="middle" font-size="12" fill="#536273">when demand rises</text>

      <circle cx="20" cy="111" r="10" fill="#6650a4"/>
      <text x="46" y="105" font-size="16" font-weight="800" fill="#111820">Batch</text>
      <text x="46" y="128" font-size="14" fill="#536273">uses available capacity, then yields when needed</text>
      <path d="M 430 111 H 548" fill="none" stroke="#6650a4" stroke-width="4" stroke-dasharray="8 7" marker-end="url(#arrow-blue)"/>
      <rect x="570" y="84" width="192" height="54" rx="6" fill="#f3f0f8" stroke="#b9a9dc"/>
      <text x="666" y="107" text-anchor="middle" font-size="13" font-weight="800" fill="#6650a4">SAFE RETRY</text>
      <text x="666" y="125" text-anchor="middle" font-size="12" fill="#536273">after eviction</text>

      <path d="M 780 111 H 904" fill="none" stroke="#087f73" stroke-width="4" marker-end="url(#arrow-teal)"/>
      <circle cx="930" cy="111" r="22" fill="#e7f5f2" stroke="#80c7bb"/>
      <path d="M 920 111 L 928 119 L 943 102" fill="none" stroke="#087f73" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="972" y="106" font-size="14" font-weight="800" fill="#111820">Batch work</text>
      <text x="972" y="127" font-size="14" fill="#536273">continues</text>
    </g>
  </g>
</svg>
