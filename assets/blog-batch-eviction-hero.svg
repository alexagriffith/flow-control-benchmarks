<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Realtime and batch traffic share one model pool</title>
  <desc id="desc">Blue realtime traffic and purple batch traffic feed one shared model pool. Before eviction, an eligible batch request is running. After eviction, that request moves to retry, freeing capacity for higher-priority traffic.</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2f6fed"/></marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6f42c1"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="4.5" markerHeight="4.5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6a737d"/></marker>
    <style>
      text{font-family:Inter,"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif}.ink{fill:#14202d}.muted{fill:#5b6877}.eyebrow{font-size:13px;font-weight:850;letter-spacing:.55px}.title{font-size:36px;font-weight:820}.panel-label{font-size:12px;font-weight:850;letter-spacing:.45px}.panel-title{font-size:16px;font-weight:820}.pool-label{font-size:11px;font-weight:750}.request-label{font-size:12px;font-weight:700}.status-label{font-size:11px;font-weight:700}.body{font-size:14px;font-weight:600}
    </style>
  </defs>
  <rect width="1200" height="630" fill="#f4f7fa"/>
  <rect x="38" y="38" width="1124" height="444" rx="10" fill="#fff" stroke="#cbd5df"/>
  <text x="74" y="80" class="eyebrow" fill="#087f72">SHARED MODEL CAPACITY</text>
  <text x="74" y="130" class="title ink">Realtime and batch traffic share one model pool.</text>
  <text x="74" y="166" class="body muted">Eviction interrupts eligible running batch traffic, freeing capacity for higher-priority traffic.</text>

  <rect x="74" y="206" width="200" height="248" rx="10" fill="#f7f9fb" stroke="#cbd5df" stroke-width="1.5"/>
  <text x="174" y="238" text-anchor="middle" class="panel-label muted">REQUESTS</text>
  <rect x="94" y="284" width="160" height="50" rx="7" fill="#eef4ff" stroke="#94b3ff"/>
  <text x="174" y="314" text-anchor="middle" class="request-label ink">realtime requests</text>
  <rect x="94" y="354" width="160" height="50" rx="7" fill="#f6f1ff" stroke="#b9a9dc"/>
  <text x="174" y="384" text-anchor="middle" class="request-label ink">batch requests</text>

  <rect x="306" y="206" width="390" height="248" rx="10" fill="#f7f9fb" stroke="#cbd5df" stroke-width="1.5"/>
  <text x="501" y="238" text-anchor="middle" class="panel-label muted">BEFORE EVICTION</text>
  <text x="501" y="262" text-anchor="middle" class="panel-title ink">Batch traffic is</text>
  <text x="501" y="282" text-anchor="middle" class="panel-title ink">already running</text>
  <rect x="330" y="300" width="342" height="78" rx="8" fill="#eef2f6" stroke="#9dacba"/>
  <path d="M254 309C282 309 294 320 322 320" fill="none" stroke="#2f6fed" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M254 379C282 379 294 360 322 360" fill="none" stroke="#6f42c1" stroke-width="2" marker-end="url(#arrow-purple)"/>
  <text x="501" y="322" text-anchor="middle" class="pool-label muted">SHARED MODEL POOL</text>
  <g transform="translate(366 338)">
    <rect width="60" height="26" rx="4" fill="#2f6fed"/>
    <rect x="70" width="60" height="26" rx="4" fill="#2f6fed"/>
    <rect x="140" width="60" height="26" rx="4" fill="#6f42c1" stroke="#49248c" stroke-width="3"/>
    <rect x="210" width="60" height="26" rx="4" fill="#6f42c1"/>
  </g>
  <rect x="376" y="414" width="250" height="28" rx="5" fill="#eef4ff" stroke="#94b3ff"/>
  <circle cx="394" cy="428" r="6" fill="#2f6fed"/>
  <text x="410" y="432" class="status-label ink">realtime request waiting</text>

  <path d="M708 330H732" fill="none" stroke="#6a737d" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="720" y="312" text-anchor="middle" class="status-label muted">evict</text>

  <rect x="746" y="206" width="390" height="248" rx="10" fill="#f3f7ff" stroke="#9fb9ee" stroke-width="1.5"/>
  <text x="941" y="238" text-anchor="middle" class="panel-label" fill="#2f6fed">AFTER EVICTION</text>
  <text x="941" y="262" text-anchor="middle" class="panel-title ink">Freed capacity serves</text>
  <text x="941" y="282" text-anchor="middle" class="panel-title ink">higher-priority traffic</text>
  <rect x="770" y="300" width="342" height="78" rx="8" fill="#eef2f6" stroke="#9dacba"/>
  <text x="941" y="322" text-anchor="middle" class="pool-label muted">SHARED MODEL POOL</text>
  <g transform="translate(806 338)">
    <rect width="60" height="26" rx="4" fill="#2f6fed"/>
    <rect x="70" width="60" height="26" rx="4" fill="#2f6fed"/>
    <rect x="140" width="60" height="26" rx="4" fill="#2f6fed" stroke="#174ea6" stroke-width="3"/>
    <rect x="210" width="60" height="26" rx="4" fill="#6f42c1"/>
  </g>
  <rect x="816" y="414" width="250" height="28" rx="5" fill="#f6f1ff" stroke="#b9a9dc"/>
  <circle cx="834" cy="428" r="6" fill="#6f42c1"/>
  <text x="850" y="432" class="status-label ink">evicted batch request · retries later</text>
  <path d="M536 366C536 394 624 397 700 404C758 410 802 418 826 424" fill="none" stroke="#6f42c1" stroke-width="2.6" stroke-dasharray="8 6" stroke-linecap="round" marker-end="url(#arrow-purple)"/>

</svg>
