<svg xmlns="http://www.w3.org/2000/svg" width="720" height="260" viewBox="0 0 720 260" role="img" aria-label="Request-size calibration compares p95 first-token latency for request count, exact input tokens, and an input-plus-output estimate across short, medium, and long prompts."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="720" height="260" fill="#ffffff"/><rect x="14" y="14" width="692" height="232" rx="7" fill="#fbfcfd" stroke="#dde3ea"/><text x="34.0" y="50.0" fill="#5f6c7b" font-size="10" font-weight="750" text-anchor="start">Admission method</text><text x="372.0" y="50.0" fill="#15202b" font-size="10" font-weight="780" text-anchor="middle">Short</text><text x="502.0" y="50.0" fill="#15202b" font-size="10" font-weight="780" text-anchor="middle">Medium</text><text x="632.0" y="50.0" fill="#15202b" font-size="10" font-weight="780" text-anchor="middle">Long</text><text x="36.0" y="80.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Request count</text><text x="36.0" y="98.0" fill="#5f6c7b" font-size="9" font-weight="650" text-anchor="start">18.8 requests/s</text><rect x="318" y="66" width="108" height="36" rx="5" fill="rgb(234,232,218)"/><text x="372.0" y="89.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">8,419 ms</text><rect x="448" y="66" width="108" height="36" rx="5" fill="rgb(237,242,236)"/><text x="502.0" y="89.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">5,659 ms</text><rect x="578" y="66" width="108" height="36" rx="5" fill="rgb(239,248,246)"/><text x="632.0" y="89.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">4,163 ms</text><rect x="26" y="116" width="668" height="48" rx="6" fill="#eef8f6" stroke="#b9ded6"/><text x="36.0" y="136.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Input tokens</text><text x="36.0" y="154.0" fill="#5f6c7b" font-size="9" font-weight="650" text-anchor="start">21.4 requests/s</text><rect x="318" y="122" width="108" height="36" rx="5" fill="rgb(236,239,230)"/><text x="372.0" y="145.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">6,621 ms</text><rect x="448" y="122" width="108" height="36" rx="5" fill="rgb(238,244,239)"/><text x="502.0" y="145.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">5,213 ms</text><rect x="578" y="122" width="108" height="36" rx="5" fill="rgb(237,240,232)"/><text x="632.0" y="145.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">6,352 ms</text><text x="36.0" y="192.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Input + output estimate</text><text x="36.0" y="210.0" fill="#5f6c7b" font-size="9" font-weight="650" text-anchor="start">6.8 requests/s</text><text x="270.0" y="201.0" fill="#c56a00" font-size="8.5" font-weight="800" text-anchor="end">1-run screen</text><rect x="318" y="178" width="108" height="36" rx="5" fill="rgb(199,106,0)"/><text x="372.0" y="201.0" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">41,909 ms</text><rect x="448" y="178" width="108" height="36" rx="5" fill="rgb(214,159,91)"/><text x="502.0" y="201.0" fill="#ffffff" font-size="10" font-weight="800" text-anchor="middle">27,952 ms</text><rect x="578" y="178" width="108" height="36" rx="5" fill="rgb(229,211,182)"/><text x="632.0" y="201.0" fill="#15202b" font-size="10" font-weight="800" text-anchor="middle">13,962 ms</text><text x="34.0" y="232.0" fill="#5f6c7b" font-size="9" font-weight="700" text-anchor="start">p95 TTFT · lower is better</text></svg>
