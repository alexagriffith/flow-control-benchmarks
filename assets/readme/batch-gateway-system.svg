<svg id="batch-gateway-system" xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" role="img" aria-label="The logical llm-d Batch Gateway system has two separately runnable components connected through dependent shared data. File upload stores the input file. A later batch-creation call creates batch state and enqueues a deadline-ordered job. Batch Processor claims the queued job, reads the input file, expands it into individual inference requests, updates batch state, writes output and error files, and finalizes the job. These are separate API operations, not one three-way write. In sync mode Batch Processor calls Inference Gateway over HTTP. In async mode it publishes requests for llm-d Async Processor." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);"><rect width="900" height="430" fill="#ffffff"/><defs><marker id="batch-system-bronze" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="4.1" markerHeight="4.1" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c56a00"/></marker></defs><defs><marker id="batch-system-neutral" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="4.1" markerHeight="4.1" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a737d"/></marker></defs><rect x="18" y="118" width="126" height="58" rx="5" fill="#f8f9fa" stroke="#6a737d" stroke-width="1.35"/><text x="81" y="141" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="81" dy="0">Batch API client</tspan></text><text x="81" y="165" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="81" dy="0">file + job</tspan></text><rect x="756" y="118" width="126" height="58" rx="5" fill="#f8f9fa" stroke="#6a737d" stroke-width="1.35"/><text x="819" y="134" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="819" dy="0">Per-request</tspan><tspan x="819" dy="13.5">dispatch</tspan></text><text x="819" y="165" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="819" dy="0">sync or async</tspan></text><rect x="162" y="18" width="576" height="394" rx="7" fill="#fffbf3" stroke="#c56a00" stroke-width="1.35"/><text x="178" y="41" text-anchor="start" fill="#c56a00" font-size="10" font-weight="900"><tspan x="178" dy="0">LLM-D BATCH GATEWAY · SYSTEM VIEW</tspan></text><text x="722" y="41" text-anchor="end" fill="#62666b" font-size="9" font-weight="850"><tspan x="722" dy="0">TWO RUNNABLE COMPONENTS</tspan></text><rect x="178" y="66" width="160" height="150" rx="5" fill="#fffdf8" stroke="#c56a00" stroke-width="0.9" stroke-opacity="0.62"/><text x="258" y="80" text-anchor="middle" fill="#c56a00" font-size="8.2" font-weight="900" letter-spacing="0.45">BATCH API SERVER DEPLOYMENT</text><rect x="188" y="103" width="140" height="76" rx="5" fill="#ffffff" stroke="#c56a00" stroke-width="1.35"/><text x="258" y="135" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="258" dy="0">Batch API Server</tspan></text><text x="258" y="159" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="258" dy="0">validate + create job</tspan></text><rect x="358" y="56" width="180" height="334" rx="5" fill="#fafbfb" stroke="#6a737d" stroke-width="0.9" stroke-opacity="0.62"/><text x="448" y="70" text-anchor="middle" fill="#6a737d" font-size="8.2" font-weight="900" letter-spacing="0.45">DEPENDENT SHARED DATA</text><rect x="374" y="88" width="148" height="56" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="448" y="110" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="448" dy="0">Input file</tspan></text><text x="448" y="134" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="448" dy="0">store → read</tspan></text><rect x="374" y="166" width="148" height="56" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="448" y="188" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="448" dy="0">Batch database</tspan></text><text x="448" y="212" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="448" dy="0">create → update</tspan></text><rect x="374" y="244" width="148" height="56" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><rect x="384" y="264" width="12" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><rect x="384" y="270" width="10" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><rect x="384" y="276" width="8" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><text x="456" y="271" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="456" dy="0">Job priority queue</tspan></text><text x="456" y="290" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="456" dy="0">enqueue → claim</tspan></text><rect x="374" y="322" width="148" height="56" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="448" y="344" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="448" dy="0">Output / error files</tspan></text><text x="448" y="368" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="448" dy="0">write results</tspan></text><rect x="568" y="66" width="154" height="150" rx="5" fill="#fffdf8" stroke="#c56a00" stroke-width="0.9" stroke-opacity="0.62"/><text x="645" y="80" text-anchor="middle" fill="#c56a00" font-size="8.2" font-weight="900" letter-spacing="0.45">BATCH PROCESSOR DEPLOYMENT</text><rect x="578" y="103" width="134" height="76" rx="5" fill="#ffffff" stroke="#c56a00" stroke-width="1.35"/><text x="645" y="135" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="645" dy="0">Batch Processor</tspan></text><text x="645" y="159" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="645" dy="0">execute + finalize</tspan></text><path d="M144,147 L186,147" fill="none" stroke="#c56a00" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><g><rect x="137.52557373046875" y="123.78077697753906" width="54.948856353759766" height="16.27402400970459" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="165" y="135" text-anchor="middle" fill="#c56a00" font-size="8.2" font-weight="820"><tspan x="165" dy="0">file + batch</tspan></text></g><path d="M328,116 L372,116" fill="none" stroke="#c56a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><path d="M328,141 L348,141 L348,194 L372,194" fill="none" stroke="#c56a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><path d="M328,164 L342,164 L342,272 L372,272" fill="none" stroke="#c56a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><path d="M522,116 L576,116" fill="none" stroke="#c56a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><path d="M522,272 L542,272 L542,160 L576,160" fill="none" stroke="#c56a00" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><path d="M578,140 L558,140 L558,194 L524,194" fill="none" stroke="#6a737d" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-neutral)"/><path d="M578,170 L566,170 L566,350 L524,350" fill="none" stroke="#6a737d" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-neutral)"/><path d="M712,141 L754,141" fill="none" stroke="#c56a00" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#batch-system-bronze)"/><g><rect x="710.1167602539062" y="117.7807846069336" width="45.76644515991211" height="16.27402400970459" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="733" y="129" text-anchor="middle" fill="#c56a00" font-size="8.2" font-weight="820"><tspan x="733" dy="0">requests</tspan></text></g><path d="M756,163 L714,163" fill="none" stroke="#6a737d" stroke-width="1.4" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 3" marker-end="url(#batch-system-neutral)"/><g><rect x="709.596435546875" y="169.78077697753906" width="50.8071403503418" height="16.27402400970459" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="735" y="181" text-anchor="middle" fill="#6a737d" font-size="8.1" font-weight="800"><tspan x="735" dy="0">responses</tspan></text></g><text x="464" y="405" text-anchor="middle" fill="#62666b" font-size="9.4" font-weight="760"><tspan x="464" dy="0">Upload stores the input · batch creation stores state + enqueues work · Processor executes</tspan></text></svg>
