<svg id="service-boundaries" xmlns="http://www.w3.org/2000/svg" width="900" height="326" viewBox="0 0 900 326" role="img" aria-label="Workload convergence and inference routing boundaries: realtime HTTP, direct lower-priority HTTP, and expanded requests from Batch Processor or Async Processor all enter the same Inference Gateway and Envoy runtime. Gateway and Envoy send request headers and body chunks to the llm-d Endpoint Picker over ExtProc. Inside EPP the parsed request passes through request handling, flow classification, an in-memory policy queue, the dispatch gate, and endpoint selection. EPP returns an ExtProc response identifying the selected worker through a destination-header mutation and dynamic metadata. Gateway and Envoy apply that response and open the upstream request stream to the selected vLLM worker in the shared InferencePool. Each vLLM worker has its own waiting and running scheduler state. Batch API job submission is a separate llm-d Batch Gateway path." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);"><rect width="900" height="326" fill="#ffffff"/><defs><marker id="boundary-arrow" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a737d"/></marker></defs><defs><marker id="boundary-blue" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="5.2" markerHeight="5.2" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c78d8"/></marker></defs><defs><marker id="boundary-green" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f5b"/></marker></defs><defs><marker id="boundary-bronze" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c56a00"/></marker></defs><defs><marker id="boundary-purple" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="5.5" markerHeight="5.5" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f42c1"/></marker></defs><rect x="18" y="18" width="170" height="132" rx="5" fill="#fafbfb" stroke="#6a737d" stroke-width="0.9" stroke-opacity="0.62"/><text x="103" y="32" text-anchor="middle" fill="#6a737d" font-size="8.2" font-weight="900" letter-spacing="0.45">INFERENCE REQUEST PRODUCERS</text><rect x="30" y="42" width="146" height="30" rx="4" fill="#f1faf6" stroke="#087f5b" stroke-width="1.35"/><text x="103" y="57" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="103" dy="0">Realtime HTTP</tspan></text><rect x="30" y="78" width="146" height="30" rx="4" fill="#fff8ee" stroke="#c56a00" stroke-width="1.35"/><text x="103" y="93" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="103" dy="0">Lower-priority HTTP</tspan></text><rect x="30" y="108" width="146" height="40" rx="4" fill="#fcfaff" stroke="#6f42c1" stroke-width="1.35"/><text x="103" y="121" text-anchor="middle" fill="#151515" font-size="10.8" font-weight="820"><tspan x="103" dy="0">Batch / Async</tspan><tspan x="103" dy="13.5">Processor</tspan></text><rect x="350" y="42" width="200" height="74" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="450" y="66" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="450" dy="0">Inference Gateway</tspan><tspan x="450" dy="13.5">/ Envoy</tspan></text><text x="450" y="97" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="450" dy="0">routes request stream</tspan></text><rect x="180" y="160" width="540" height="140" rx="5" fill="#f4f8fd" stroke="#1c78d8" stroke-width="1.5"/><text x="196" y="182" text-anchor="start" fill="#1c78d8" font-size="10" font-weight="900"><tspan x="196" dy="0">LLM-D ENDPOINT PICKER · EXTPROC</tspan></text><rect x="194" y="205" width="84" height="70" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="236" y="227" text-anchor="middle" fill="#151515" font-size="9.6" font-weight="820"><tspan x="236" dy="0">Request</tspan><tspan x="236" dy="13.5">handling</tspan></text><text x="236" y="258" text-anchor="middle" fill="#62666b" font-size="8.1" font-weight="650"><tspan x="236" dy="0">parsed request</tspan></text><rect x="300" y="205" width="84" height="70" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="342" y="227" text-anchor="middle" fill="#151515" font-size="9.6" font-weight="820"><tspan x="342" dy="0">Flow</tspan><tspan x="342" dy="13.5">classification</tspan></text><text x="342" y="258" text-anchor="middle" fill="#62666b" font-size="8.1" font-weight="650"><tspan x="342" dy="0">priority + ID</tspan></text><rect x="406" y="205" width="84" height="70" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="448" y="227" text-anchor="middle" fill="#151515" font-size="9.6" font-weight="820"><tspan x="448" dy="0">Policy</tspan><tspan x="448" dy="13.5">queue</tspan></text><text x="448" y="258" text-anchor="middle" fill="#62666b" font-size="8.1" font-weight="650"><tspan x="448" dy="0">EPP memory</tspan></text><rect x="512" y="205" width="84" height="70" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="554" y="227" text-anchor="middle" fill="#151515" font-size="9.6" font-weight="820"><tspan x="554" dy="0">Dispatch</tspan><tspan x="554" dy="13.5">gate</tspan></text><text x="554" y="258" text-anchor="middle" fill="#62666b" font-size="8.1" font-weight="650"><tspan x="554" dy="0">band limit</tspan></text><rect x="618" y="205" width="84" height="70" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="660" y="227" text-anchor="middle" fill="#151515" font-size="9.6" font-weight="820"><tspan x="660" dy="0">Endpoint</tspan><tspan x="660" dy="13.5">selection</tspan></text><text x="660" y="258" text-anchor="middle" fill="#62666b" font-size="8.1" font-weight="650"><tspan x="660" dy="0">worker state</tspan></text><path d="M278,240 L300,240" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-blue)"/><path d="M384,240 L406,240" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-blue)"/><path d="M490,240 L512,240" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-blue)"/><path d="M596,240 L618,240" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-blue)"/><rect x="728" y="16" width="148" height="136" rx="5" fill="#f7f8f8" stroke="#6a737d" stroke-width="1.5"/><text x="740" y="36" text-anchor="start" fill="#6a737d" font-size="9.2" font-weight="900"><tspan x="740" dy="0">SHARED INFERENCE POOL</tspan></text><rect x="738" y="50" width="60" height="64" rx="4" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="768" y="75" text-anchor="middle" fill="#151515" font-size="10.2" font-weight="820"><tspan x="768" dy="0">vLLM</tspan><tspan x="768" dy="13.5">worker 1</tspan></text><rect x="806" y="50" width="60" height="64" rx="4" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="836" y="75" text-anchor="middle" fill="#151515" font-size="10.2" font-weight="820"><tspan x="836" dy="0">vLLM</tspan><tspan x="836" dy="13.5">worker 2</tspan></text><text x="802" y="132" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="730"><tspan x="802" dy="0">each: waiting → running</tspan></text><path d="M176,57 L260,57 L304,64 L348,64" fill="none" stroke="#087f5b" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-green)"/><path d="M176,93 L286,93 L320,80 L348,80" fill="none" stroke="#c56a00" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-bronze)"/><path d="M176,129 L260,129 L304,96 L348,96" fill="none" stroke="#6f42c1" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-purple)"/><path d="M550,80 L726,80" fill="none" stroke="#151515" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#boundary-arrow)"/><g><rect x="597.2728271484375" y="56.75313949584961" width="81.45447540283203" height="18.329147338867188" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="638" y="69" text-anchor="middle" fill="#151515" font-size="9.5" font-weight="750"><tspan x="638" dy="0">request stream</tspan></text></g><path d="M425,114 L425,158" fill="none" stroke="#1c78d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#boundary-blue)"/><g><rect x="428.4848327636719" y="123.75314331054688" width="81.03038787841797" height="18.329147338867188" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="469" y="136" text-anchor="middle" fill="#1c78d8" font-size="9.2" font-weight="820"><tspan x="469" dy="0">headers + body</tspan></text></g><path d="M505,158 L505,116" fill="none" stroke="#1c78d8" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 4" marker-end="url(#boundary-blue)"/><g><rect x="517.343017578125" y="138.75314331054688" width="89.31403350830078" height="18.329147338867188" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="562" y="151" text-anchor="middle" fill="#1c78d8" font-size="9.2" font-weight="820"><tspan x="562" dy="0">routing response</tspan></text></g></svg>
