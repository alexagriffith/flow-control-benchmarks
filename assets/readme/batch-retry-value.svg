<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Priority holdback protects realtime latency; eviction and retry recover batch completions</title>
  <desc id="desc">Two simple comparisons answer different questions. Priority holdback reduced median realtime p95 time to first token from 561 to 341 milliseconds, a 39 percent reduction. Holding reserved capacity constant, adding eviction and retry increased median batch completions in a 300-second run from 1,648 to 1,798, a gain of 150 or 9 percent. Blue bars are comparators and green bars are the better outcomes.</desc>
  <defs>
    <style>text{font-family:Inter,"Red Hat Text",system-ui,-apple-system,"Segoe UI",sans-serif}.ink{fill:#14202d}.muted{fill:#5b6877}.eyebrow{font-size:10px;font-weight:850;letter-spacing:.45px}.title{font-size:17px;font-weight:820}.axis{font-size:9.5px;font-weight:650}.value{font-size:12px;font-weight:850}.label{font-size:11px;font-weight:750}.badge{font-size:12px;font-weight:850}</style>
  </defs>
  <rect width="900" height="330" rx="10" fill="#fff"/>

  <rect x="24" y="20" width="416" height="286" rx="10" fill="#f8fafc" stroke="#cbd5df"/>
  <text x="48" y="49" class="eyebrow" fill="#2f6fed">WHY PRIORITY HOLDBACK?</text>
  <text x="48" y="76" class="title ink">Protect realtime latency</text>
  <text x="48" y="96" class="axis muted">Median realtime p95 TTFT</text>
  <line x1="94" y1="244" x2="414" y2="244" stroke="#9dacba"/>
  <line x1="94" y1="169" x2="414" y2="169" stroke="#d8dee4"/>
  <line x1="94" y1="94" x2="414" y2="94" stroke="#d8dee4" opacity="0"/>
  <text x="84" y="248" text-anchor="end" class="axis muted">0</text>
  <text x="84" y="173" text-anchor="end" class="axis muted">300</text>
  <text x="84" y="111" text-anchor="end" class="axis muted">600 ms</text>
  <rect x="150" y="103.8" width="78" height="140.2" rx="5" fill="#7fa4ef"/>
  <rect x="286" y="158.8" width="78" height="85.2" rx="5" fill="#14946b"/>
  <text x="325" y="178" text-anchor="middle" class="value" fill="#fff">−39%</text>
  <text x="189" y="268" text-anchor="middle" class="label ink">realtime + batch</text>
  <text x="189" y="286" text-anchor="middle" class="axis muted">no protection</text>
  <text x="325" y="268" text-anchor="middle" class="label ink">realtime + batch</text>
  <text x="325" y="286" text-anchor="middle" class="axis" fill="#087f5b">+ priority holdback</text>

  <rect x="460" y="20" width="416" height="286" rx="10" fill="#f8fafc" stroke="#cbd5df"/>
  <text x="484" y="49" class="eyebrow" fill="#087f5b">WHY EVICTION + RETRY?</text>
  <text x="484" y="76" class="title ink">Recover batch completions</text>
  <text x="484" y="96" class="axis muted">Median completions in 300 seconds</text>
  <line x1="530" y1="244" x2="850" y2="244" stroke="#9dacba"/>
  <line x1="530" y1="175" x2="850" y2="175" stroke="#d8dee4"/>
  <line x1="530" y1="94" x2="850" y2="94" stroke="#d8dee4" opacity="0"/>
  <text x="520" y="248" text-anchor="end" class="axis muted">1,000</text>
  <text x="520" y="179" text-anchor="end" class="axis muted">1,500</text>
  <text x="520" y="111" text-anchor="end" class="axis muted">2,000</text>
  <path d="M526 236l5 4-5 4 5 4" fill="none" stroke="#5b6877" stroke-width="1.5"/>
  <rect x="586" y="154.6" width="78" height="89.4" rx="5" fill="#7fa4ef"/>
  <rect x="722" y="133.9" width="78" height="110.1" rx="5" fill="#14946b"/>
  <text x="761" y="154" text-anchor="middle" class="value" fill="#fff">+9%</text>
  <text x="625" y="268" text-anchor="middle" class="label ink">reserved capacity</text>
  <text x="761" y="268" text-anchor="middle" class="label ink">reserved capacity</text>
  <text x="761" y="286" text-anchor="middle" class="axis" fill="#087f5b">+ eviction and retry</text>
</svg>
