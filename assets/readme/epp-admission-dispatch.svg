<svg id="control-levels" xmlns="http://www.w3.org/2000/svg" width="900" height="274" viewBox="0 0 900 274" role="img" aria-label="Gateway and Envoy send request headers and body chunks to the Endpoint Picker over ExtProc. Inside EPP, the parsed request moves through request handling, flow classification, an in-memory priority and fairness queue, and a saturation-based dispatch gate. If pool saturation is at or above the request's priority-band usage ceiling, the request remains queued. After admission, EPP locates candidates, runs the configured data and admission plugins, schedules a worker, and returns an ExtProc response identifying that worker to Gateway and Envoy. Gateway and Envoy then open the upstream request stream to the selected worker." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);"><rect width="900" height="274" fill="#ffffff"/><defs><marker id="lifecycle-blue" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c78d8"/></marker></defs><defs><marker id="lifecycle-green" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f5b"/></marker></defs><defs><marker id="lifecycle-bronze" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c56a00"/></marker></defs><rect x="18" y="104" width="110" height="76" rx="5" fill="#fafbfb" stroke="#6a737d" stroke-width="1.35"/><text x="73" y="129" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="73" dy="0">Gateway</tspan><tspan x="73" dy="13.5">/ Envoy</tspan></text><text x="73" y="160" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="73" dy="0">owns HTTP stream</tspan></text><rect x="150" y="22" width="726" height="230" rx="5" fill="#f7faff" stroke="#1c78d8" stroke-width="1.35"/><text x="166" y="45" text-anchor="start" fill="#1c78d8" font-size="10" font-weight="900"><tspan x="166" dy="0">LLM-D ENDPOINT PICKER · EXTPROC SERVICE</tspan></text><rect x="174" y="108" width="112" height="72" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="230" y="131" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="230" dy="0">Request</tspan><tspan x="230" dy="13.5">handling</tspan></text><text x="230" y="162" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="230" dy="0">parsed request</tspan></text><rect x="306" y="108" width="112" height="72" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="362" y="131" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="362" dy="0">Flow</tspan><tspan x="362" dy="13.5">classification</tspan></text><text x="362" y="162" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="362" dy="0">fairness + priority</tspan></text><rect x="438" y="108" width="112" height="72" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="494" y="131" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="494" dy="0">Policy</tspan><tspan x="494" dy="13.5">queue</tspan></text><text x="494" y="162" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="494" dy="0">in EPP memory</tspan></text><rect x="700" y="108" width="148" height="72" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="774" y="131" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="774" dy="0">Endpoint</tspan><tspan x="774" dy="13.5">selection</tspan></text><text x="774" y="162" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="774" dy="0">current worker state</tspan></text><path d="M128,144 L172,144" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#lifecycle-blue)"/><g><rect x="111.98611450195312" y="119.75322723388672" width="76.02777862548828" height="18.3290376663208" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="150" y="132" text-anchor="middle" fill="#1c78d8" font-size="8.8" font-weight="800"><tspan x="150" dy="0">headers + body</tspan></text></g><path d="M286,144 L304,144" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#lifecycle-blue)"/><path d="M418,144 L436,144" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#lifecycle-blue)"/><path d="M626,102 L680,144 L626,186 L572,144 Z" fill="#fff8ee" stroke="#c56a00" stroke-width="1.4"/><text x="626" y="132" text-anchor="middle" fill="#151515" font-size="8.7" font-weight="850"><tspan x="626" dy="0">pool saturation</tspan></text><text x="626" y="145" text-anchor="middle" fill="#151515" font-size="8.7" font-weight="850"><tspan x="626" dy="0">below band</tspan></text><text x="626" y="158" text-anchor="middle" fill="#151515" font-size="8.7" font-weight="850"><tspan x="626" dy="0">ceiling?</tspan></text><path d="M550,144 L570,144" fill="none" stroke="#1c78d8" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#lifecycle-blue)"/><path d="M680,144 L698,144" fill="none" stroke="#087f5b" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#lifecycle-green)"/><text x="689" y="130" text-anchor="middle" fill="#087f5b" font-size="9.4" font-weight="850"><tspan x="689" dy="0">yes</tspan></text><path d="M626,186 L626,220 L494,220 L494,182" fill="none" stroke="#c56a00" stroke-width="2.1" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="6 4" marker-end="url(#lifecycle-bronze)"/><text x="642" y="201" text-anchor="middle" fill="#c56a00" font-size="9.4" font-weight="850"><tspan x="642" dy="0">no</tspan></text><g><rect x="544.926513671875" y="198.72581481933594" width="30.14706039428711" height="19.356457710266113" rx="3" fill="#f7faff" fill-opacity="0.97"/><text x="560" y="212" text-anchor="middle" fill="#c56a00" font-size="9.6" font-weight="820"><tspan x="560" dy="0">wait</tspan></text></g><path d="M774,108 L774,72 L73,72 L73,102" fill="none" stroke="#1c78d8" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="4 4" marker-end="url(#lifecycle-blue)"/><g><rect x="442.34332275390625" y="52.75322341918945" width="87.31333923339844" height="18.3290376663208" rx="3" fill="#f7faff" fill-opacity="0.97"/><text x="486" y="65" text-anchor="middle" fill="#1c78d8" font-size="9.2" font-weight="820"><tspan x="486" dy="0">routing response</tspan></text></g></svg>
