<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Reserved capacity and headroom make different decisions using tracked in-flight request counts. Reserved capacity compares one pool-wide count with the gate for the incoming request's priority. In an explanatory state with 30 of 48 requests in flight, realtime and Standard dispatch while Batch waits. Headroom compares each candidate replica's count with one priority-blind filter. With a base limit of 128 and 10 percent headroom, the filter is 140 requests: a replica at 131 remains eligible while an example replica at 144 is filtered." style="font-family: Inter, 'Red Hat Text', system-ui, -apple-system, 'Segoe UI', sans-serif; background: #ffffff">
  <rect width="900" height="300" fill="#ffffff"/>

  <rect x="18" y="14" width="424" height="268" rx="9" fill="#f1faf6" stroke="#087f5b" stroke-width="1.2"/>
  <rect x="458" y="14" width="424" height="268" rx="9" fill="#f3f8fe" stroke="#1c78d8" stroke-width="1.2"/>

  <text x="34" y="42" text-anchor="start" fill="#151515" font-size="15" font-weight="900">Reserved capacity</text>
  <text x="426" y="42" text-anchor="end" fill="#087f5b" font-size="9.3" font-weight="850">Pool-wide · priority-aware</text>
  <text x="474" y="42" text-anchor="start" fill="#151515" font-size="15" font-weight="900">Headroom</text>
  <text x="866" y="42" text-anchor="end" fill="#1c78d8" font-size="9.3" font-weight="850">Per replica · priority-blind</text>

  <rect x="34" y="56" width="392" height="50" rx="7" fill="#ffffff" stroke="#087f5b" stroke-width="1.35"/>
  <text x="230" y="75" text-anchor="middle" fill="#151515" font-size="11.5" font-weight="900">Current pool count: 30 of 48</text>
  <text x="230" y="93" text-anchor="middle" fill="#62666b" font-size="9.3" font-weight="760">62.5% request-count saturation</text>

  <text x="80" y="125" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="850">Priority</text>
  <text x="225" y="125" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="850">Pool count vs gate</text>
  <text x="375" y="125" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="850">Decision</text>

  <rect x="35" y="138" width="90" height="34" rx="5" fill="#ffffff" stroke="#087f5b" stroke-width="1.35"/>
  <rect x="135" y="138" width="180" height="34" rx="5" fill="#ffffff" stroke="#087f5b" stroke-width="1.35"/>
  <rect x="325" y="138" width="100" height="34" rx="5" fill="#f2faf6" stroke="#087f5b" stroke-width="1.35"/>
  <text x="80" y="159" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="850">Realtime</text>
  <text x="225" y="159" text-anchor="middle" fill="#087f5b" font-size="8.7" font-weight="900">30 &lt; 48 (100% priority gate)</text>
  <text x="375" y="159" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="900">DISPATCH</text>

  <rect x="35" y="180" width="90" height="34" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/>
  <rect x="135" y="180" width="180" height="34" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/>
  <rect x="325" y="180" width="100" height="34" rx="5" fill="#f2faf6" stroke="#1c78d8" stroke-width="1.35"/>
  <text x="80" y="201" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="850">Standard</text>
  <text x="225" y="201" text-anchor="middle" fill="#1c78d8" font-size="8.7" font-weight="900">30 &lt; 36 (75% priority gate)</text>
  <text x="375" y="201" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="900">DISPATCH</text>

  <rect x="35" y="222" width="90" height="34" rx="5" fill="#ffffff" stroke="#c56a00" stroke-width="1.35"/>
  <rect x="135" y="222" width="180" height="34" rx="5" fill="#ffffff" stroke="#c56a00" stroke-width="1.35"/>
  <rect x="325" y="222" width="100" height="34" rx="5" fill="#fff8ef" stroke="#c56a00" stroke-width="1.35"/>
  <text x="80" y="243" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="850">Batch</text>
  <text x="225" y="243" text-anchor="middle" fill="#c56a00" font-size="8.7" font-weight="900">30 ≥ 24 (50% priority gate)</text>
  <text x="375" y="243" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="900">WAIT</text>
  <text x="230" y="273" text-anchor="middle" fill="#087f5b" font-size="9.1" font-weight="850">Pool-wide count · priority-specific gate</text>

  <rect x="474" y="56" width="392" height="50" rx="7" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/>
  <text x="670" y="75" text-anchor="middle" fill="#151515" font-size="11.5" font-weight="900">Filter: int(128 × 1.10) = 140</text>
  <text x="670" y="93" text-anchor="middle" fill="#62666b" font-size="9.3" font-weight="760">Tracked in-flight requests on one candidate replica</text>

  <text x="520" y="125" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="850">Replica</text>
  <text x="665" y="125" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="850">Replica count vs filter</text>
  <text x="815" y="125" text-anchor="middle" fill="#62666b" font-size="8.2" font-weight="850">Decision</text>

  <rect x="475" y="138" width="90" height="40" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/>
  <rect x="575" y="138" width="180" height="40" rx="5" fill="#ffffff" stroke="#087f5b" stroke-width="1.35"/>
  <rect x="765" y="138" width="100" height="40" rx="5" fill="#f2faf6" stroke="#087f5b" stroke-width="1.35"/>
  <text x="520" y="162" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="850">Replica 1</text>
  <text x="665" y="162" text-anchor="middle" fill="#087f5b" font-size="10" font-weight="900">131 &lt; 140</text>
  <text x="815" y="162" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="900">ELIGIBLE</text>

  <rect x="475" y="188" width="90" height="40" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/>
  <rect x="575" y="188" width="180" height="40" rx="5" fill="#ffffff" stroke="#c9190b" stroke-width="1.35"/>
  <rect x="765" y="188" width="100" height="40" rx="5" fill="#fff4f3" stroke="#c9190b" stroke-width="1.35"/>
  <text x="520" y="212" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="850">Replica 2</text>
  <text x="665" y="212" text-anchor="middle" fill="#c9190b" font-size="10" font-weight="900">144 ≥ 140</text>
  <text x="815" y="212" text-anchor="middle" fill="#151515" font-size="9.3" font-weight="900">FILTERED</text>
  <text x="670" y="273" text-anchor="middle" fill="#1c78d8" font-size="9.1" font-weight="850">Per-replica count · one priority-blind filter</text>
</svg>
