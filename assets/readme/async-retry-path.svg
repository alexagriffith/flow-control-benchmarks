<svg id="async-retry-path" xmlns="http://www.w3.org/2000/svg" width="700" height="236" viewBox="0 0 700 236" role="img" aria-label="Version-neutral async retry path. Envoy returns the Endpoint Picker's HTTP 429 to Async Processor because Async Processor initiated the inference request. Async Processor classifies the response as retryable and retains the same internal request for backoff. The request later re-enters the configured async request queue. Async Processor consumes it and starts a new HTTP attempt through the same Inference Gateway. No Batch API Server, Batch job queue, or input-file lookup is needed. The benchmark did not record enough Async Processor image provenance to attribute a specific retry-storage implementation to the tested run." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);"><rect width="700" height="236" fill="#ffffff"/><defs><marker id="retry-purple" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f42c1"/></marker></defs><defs><marker id="retry-neutral" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6a737d"/></marker></defs><rect x="18" y="20" width="190" height="196" rx="5" fill="#f8fbff" stroke="#1c78d8" stroke-width="0.9" stroke-opacity="0.62"/><text x="113" y="34" text-anchor="middle" fill="#1c78d8" font-size="8.2" font-weight="900" letter-spacing="0.45">INFERENCE GATEWAY</text><rect x="226" y="20" width="210" height="196" rx="5" fill="#fcfaff" stroke="#6f42c1" stroke-width="0.9" stroke-opacity="0.62"/><text x="331" y="34" text-anchor="middle" fill="#6f42c1" font-size="8.2" font-weight="900" letter-spacing="0.45">ASYNC PROCESSOR</text><rect x="454" y="20" width="228" height="196" rx="5" fill="#fafbfb" stroke="#6a737d" stroke-width="0.9" stroke-opacity="0.62"/><text x="568" y="34" text-anchor="middle" fill="#6a737d" font-size="8.2" font-weight="900" letter-spacing="0.45">CONFIGURED ASYNC BACKEND</text><rect x="32" y="56" width="162" height="58" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="113" y="72" text-anchor="middle" fill="#151515" font-size="11.2" font-weight="820"><tspan x="113" dy="0">Envoy returns</tspan><tspan x="113" dy="13.5">EPP 429</tspan></text><text x="113" y="103" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="650"><tspan x="113" dy="0">to Async Processor</tspan></text><rect x="242" y="56" width="178" height="58" rx="5" fill="#ffffff" stroke="#6f42c1" stroke-width="1.35"/><text x="331" y="79" text-anchor="middle" fill="#151515" font-size="11.2" font-weight="820"><tspan x="331" dy="0">Classify response</tspan></text><text x="331" y="103" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="650"><tspan x="331" dy="0">429 → retry</tspan></text><rect x="470" y="56" width="196" height="58" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><rect x="480" y="77" width="12" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><rect x="480" y="83" width="10" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><rect x="480" y="89" width="8" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><text x="576" y="83" text-anchor="middle" fill="#151515" font-size="11.2" font-weight="820"><tspan x="576" dy="0">Retain for backoff</tspan></text><text x="576" y="103" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="650"><tspan x="576" dy="0">same internal request</tspan></text><rect x="32" y="146" width="162" height="58" rx="5" fill="#ffffff" stroke="#1c78d8" stroke-width="1.35"/><text x="113" y="169" text-anchor="middle" fill="#151515" font-size="11.2" font-weight="820"><tspan x="113" dy="0">Receive retry request</tspan></text><text x="113" y="193" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="650"><tspan x="113" dy="0">normal Gateway path</tspan></text><rect x="242" y="146" width="178" height="58" rx="5" fill="#ffffff" stroke="#6f42c1" stroke-width="1.35"/><text x="331" y="169" text-anchor="middle" fill="#151515" font-size="11.2" font-weight="820"><tspan x="331" dy="0">Start new attempt</tspan></text><text x="331" y="193" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="650"><tspan x="331" dy="0">same inference request</tspan></text><rect x="470" y="146" width="196" height="58" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><rect x="480" y="167" width="12" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><rect x="480" y="173" width="10" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><rect x="480" y="179" width="8" height="2.5" rx="1.25" fill="#6a737d" opacity="0.72"/><text x="576" y="173" text-anchor="middle" fill="#151515" font-size="11.2" font-weight="820"><tspan x="576" dy="0">Async request queue</tspan></text><text x="576" y="193" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="650"><tspan x="576" dy="0">configured queue</tspan></text><path d="M194,85 L240,85" fill="none" stroke="#6f42c1" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry-purple)"/><path d="M420,85 L468,85" fill="none" stroke="#6f42c1" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry-purple)"/><path d="M568,114 L568,144" fill="none" stroke="#6a737d" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry-neutral)"/><path d="M470,175 L422,175" fill="none" stroke="#6f42c1" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry-purple)"/><path d="M242,175 L196,175" fill="none" stroke="#6f42c1" stroke-width="1.65" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#retry-purple)"/><g><rect x="191.672607421875" y="63.008888244628906" width="50.654781341552734" height="16.38844585418701" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="217" y="74" text-anchor="middle" fill="#6f42c1" font-size="8.2" font-weight="820"><tspan x="217" dy="0">HTTP 429</tspan></text></g><g><rect x="410.2882080078125" y="63.008888244628906" width="67.42362976074219" height="16.38844585418701" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="444" y="74" text-anchor="middle" fill="#6f42c1" font-size="8.2" font-weight="820"><tspan x="444" dy="0">retain request</tspan></text></g><g><rect x="588.0237426757812" y="125.00889587402344" width="63.952491760253906" height="16.38844585418701" rx="3" fill="#ffffff" fill-opacity="0.97"/><text x="620" y="136" text-anchor="middle" fill="#6a737d" font-size="8.2" font-weight="800"><tspan x="620" dy="0">after backoff</tspan></text></g></svg>
