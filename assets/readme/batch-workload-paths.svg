<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" id="workload-paths" width="900" height="626" viewBox="0 0 900 626" role="img" aria-label="A Batch API client first uploads a file and later creates a job through the separately deployed llm-d Batch API Server. The API Server stores the input and job state and enqueues the job in shared data outside the two Batch Gateway processes. Batch Processor later claims the job and expands it into inference requests. In sync mode, Batch Processor initiates HTTP to the Inference Gateway and receives each response. In async mode, Batch Processor publishes each request to the audited Redis or Valkey request queue; llm-d Async Processor consumes it and initiates HTTP to the same Gateway. Async Processor publishes terminal results to the result queue consumed by Batch Processor. Both modes use the same separate Inference Gateway, Endpoint Picker, and vLLM components. Gateway responses return to whichever processor initiated the HTTP request; Gateway does not invoke Async Processor." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);">
  <rect width="900" height="626" fill="#ffffff"/>
  <defs>
    <marker id="paths-bronze" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c56a00"/>
    </marker>
  </defs>
  <defs>
    <marker id="paths-purple" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
