ze="8.2" font-weight="900" letter-spacing="0.45">LLM-D BATCH GATEWAY</text><rect x="98" y="230" width="144" height="68" rx="5" fill="#ffffff" stroke="#c56a00" stroke-width="1.35"/><text x="170" y="251" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="170" dy="0">Batch</tspan><tspan x="170" dy="13.5">Processor</tspan></text><text x="170" y="282" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="170" dy="0">HTTP client</tspan></text><rect x="360" y="208" width="174" height="104" rx="5" fill="#fafbfb" stroke="#6a737d" stroke-width="0.9" stroke-opacity="0.62"/><text x="447" y="222" text-anchor="middle" fill="#6a737d" font-size="8.2" font-weight="900" letter-spacing="0.45">INFERENCE GATEWAY</text><rect x="368" y="230" width="158" height="68" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="447" y="251" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="447" dy="0">Gateway</tspan><tspan x="447" dy="13.5">/ Envoy</tspan></text><text x="447" y="282" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="447" dy="0">routes HTTP</tspan></text><rect x="360" y="326" width="174" height="54" rx="5" fill="#f4f8fd" stroke="#1c78d8" stroke-width="1.25"/><text x="447" y="348" text-anchor="middle" fill="#151515" font-size="10.8" font-weight="850"><tspan x="447" dy="0">llm-d Endpoint Picker</tspan></text><text x="447" y="365" text-anchor="middle" fill="#62666b" font-size="8.8" font-weight="680"><tspan x="447" dy="0">ExtProc · admit + select</tspan></text><rect x="650" y="208" width="126" height="104" rx="5" fill="#fafbfb" stroke="#6a737d" stroke-width="0.9" stroke-opacity="0.62"/><text x="713" y="222" text-anchor="middle" fill="#6a737d" font-size="8.2" font-weight="900" letter-spacing="0.45">VLLM</text><rect x="658" y="230" width="110" height="68" rx="5" fill="#f7f8f8" stroke="#6a737d" stroke-width="1.35"/><text x="713" y="251" text-anchor="middle" fi