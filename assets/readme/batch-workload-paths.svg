      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6a737d"/>
    </marker>
  </defs>
  <defs>
    <marker id="paths-blue" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1c78d8"/>
    </marker>
  </defs>
  <text x="18" y="16" text-anchor="start" fill="#c56a00" font-size="9.5" font-weight="900">
    <tspan x="18" dy="0">BATCH JOB SUBMISSION</tspan>
  </text>
