<?xml version="1.0"?>
<svg xmlns="http://www.w3.org/2000/svg" id="batch-eviction-mechanism" width="900" height="636" viewBox="0 0 900 636" role="img" aria-label="Architecture-backed sequence for the benchmark's eviction and retry path. The external request queue feeds batch work to the Async Processor, which is the HTTP caller. The Async Processor sends batch through the Inference Gateway Envoy proxy and Endpoint Picker to vLLM. A separate request stream carries realtime traffic. The Endpoint Picker returns an ImmediateResponse with status 429 on the selected batch stream. Envoy returns that batch response to the Async Processor and resets the upstream batch stream in vLLM. Once capacity is observed available, queued realtime traffic can be admitted. The configured async backend retains the failed batch request for retry with backoff and returns it to the request queue for the next attempt. The diagram intentionally does not claim a particular retry-storage implementation because the benchmark package did not record the Async Processor revision." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);">
