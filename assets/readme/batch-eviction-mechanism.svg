<svg id="batch-eviction-mechanism" xmlns="http://www.w3.org/2000/svg" width="900" height="636" viewBox="0 0 900 636" role="img" aria-label="Architecture-backed sequence for the tested eviction and retry path. The external request queue feeds Batch work to the Async Processor, which is the HTTP caller. The Async Processor sends Batch through the logical llm-d Router, made of the Inference Gateway Envoy proxy and EPP, to vLLM. Realtime arrives on a separate request stream. EPP returns an ImmediateResponse with status 429 on the selected Batch stream. Envoy returns that Batch response to the Async Processor, resets the upstream Batch stream in vLLM, and forwards admitted Realtime into the released capacity. The Async Processor writes the failed Batch request to a retry schedule. After backoff, the tested Redis or Valkey retry mover returns it to the original request queue. The Async Processor consumes it again and starts the next routed attempt." style="font-family: Inter, &quot;Red Hat Text&quot;, system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif; background: rgb(255, 255, 255);"><rect width="900" height="636" fill="#ffffff"/><defs><marker id="mechanism-green" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#087f5b"/></marker></defs><defs><marker id="mechanism-bronze" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#c56a00"/></marker></defs><defs><marker id="mechanism-purple" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6f42c1"/></marker></defs><defs><marker id="mechanism-blue" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1c78d8"/></marker></defs><rect x="475" y="8" width="260" height="620" rx="7" fill="#f7faff" fill-opacity="0.55" stroke="#1c78d8" stroke-width="1.15"/><text x="487" y="22" text-anchor="start" fill="#1c78d8" font-size="9.3" font-weight="900"><tspan x="487" dy="0">LLM-D ROUTER · LOGICAL SYSTEM</tspan></text><rect x="755" y="8" width="137" height="620" rx="7" fill="#fafafa" stroke="#6a737d" stroke-width="1.05"/><text x="767" y="22" text-anchor="start" fill="#6a737d" font-size="9.3" font-weight="900"><tspan x="767" dy="0">INFERENCEPOOL</tspan></text><rect x="12" y="96" width="876" height="210" rx="5" fill="#f8fafb" fill-opacity="0.72"/><rect x="12" y="312" width="876" height="124" rx="5" fill="#fbf8ff" fill-opacity="0.72"/><rect x="12" y="442" width="876" height="186" rx="5" fill="#fcfcfc" fill-opacity="0.72"/><rect x="475" y="8" width="260" height="620" rx="7" fill="none" stroke="#1c78d8" stroke-width="1.15"/><rect x="755" y="8" width="137" height="620" rx="7" fill="none" stroke="#6a737d" stroke-width="1.05"/><rect x="10" y="34" width="84" height="52" rx="5" fill="#eef9f4" stroke="#087f5b" stroke-width="1.35"/><text x="52" y="53" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="52" dy="0">Realtime</tspan><tspan x="52" dy="13.5">client</tspan></text><line x1="52" x2="52" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><rect x="108" y="34" width="104" height="52" rx="5" fill="#fbf8ff" stroke="#6f42c1" stroke-width="1.35"/><text x="160" y="54" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="160" dy="0">Request queue</tspan></text><text x="160" y="78" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="160" dy="0">message transport</tspan></text><line x1="160" x2="160" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><rect x="229" y="34" width="112" height="52" rx="5" fill="#fbf8ff" stroke="#6f42c1" stroke-width="1.35"/><text x="285" y="47" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="285" dy="0">Async</tspan><tspan x="285" dy="13.5">Processor</tspan></text><text x="285" y="78" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="285" dy="0">Batch HTTP caller</tspan></text><line x1="285" x2="285" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><rect x="353" y="34" width="104" height="52" rx="5" fill="#fbf8ff" stroke="#6f42c1" stroke-width="1.35"/><text x="405" y="54" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="405" dy="0">Retry schedule</tspan></text><text x="405" y="78" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="405" dy="0">backoff timer</tspan></text><line x1="405" x2="405" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><rect x="481" y="34" width="118" height="52" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="540" y="47" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="540" dy="0">Inference</tspan><tspan x="540" dy="13.5">Gateway</tspan></text><text x="540" y="78" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="540" dy="0">Envoy proxy</tspan></text><line x1="540" x2="540" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><rect x="631" y="34" width="88" height="52" rx="5" fill="#f4f8fd" stroke="#1c78d8" stroke-width="1.35"/><text x="675" y="54" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="675" dy="0">EPP</tspan></text><text x="675" y="78" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="675" dy="0">endpoint picker</tspan></text><line x1="675" x2="675" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><rect x="798" y="34" width="84" height="52" rx="5" fill="#ffffff" stroke="#6a737d" stroke-width="1.35"/><text x="840" y="54" text-anchor="middle" fill="#151515" font-size="11.8" font-weight="820"><tspan x="840" dy="0">vLLM</tspan></text><text x="840" y="78" text-anchor="middle" fill="#62666b" font-size="9.8" font-weight="650"><tspan x="840" dy="0">model server</tspan></text><line x1="840" x2="840" y1="86" y2="628" stroke="#dedede" stroke-width="1" stroke-dasharray="4 4"/><circle cx="28" cy="110" r="10" fill="#6a737d" stroke="#ffffff" stroke-width="2"/><text x="28" y="114" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="900"><tspan x="28" dy="0">1</tspan></text><text x="45" y="114" text-anchor="start" fill="#6a737d" font-size="10.2" font-weight="900"><tspan x="45" dy="0">INITIAL DISPATCH</tspan></text><circle cx="28" cy="326" r="10" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/><text x="28" y="330" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="900"><tspan x="28" dy="0">2</tspan></text><text x="45" y="330" text-anchor="start" fill="#6f42c1" font-size="10.2" font-weight="900"><tspan x="45" dy="0">EVICT + RELEASE</tspan></text><circle cx="28" cy="456" r="10" fill="#6f42c1" stroke="#ffffff" stroke-width="2"/><text x="28" y="460" text-anchor="middle" fill="#ffffff" font-size="10.5" font-weight="900"><tspan x="28" dy="0">3</tspan></text><text x="45" y="460" text-anchor="start" fill="#6f42c1" font-size="10.2" font-weight="900"><tspan x="45" dy="0">RETRY BATCH</tspan></text><path d="M160,132 L285,132" fill="none" stroke="#6f42c1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-purple)"/><text x="222.5" y="125" text-anchor="middle" fill="#6f42c1" font-size="9.7" font-weight="850"><tspan x="222.5" dy="0">queued Batch</tspan></text><path d="M285,158 L540,158" fill="none" stroke="#c56a00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-bronze)"/><text x="412.5" y="151" text-anchor="middle" fill="#c56a00" font-size="9.7" font-weight="850"><tspan x="412.5" dy="0">Batch request</tspan></text><path d="M540,184 L675,184" fill="none" stroke="#1c78d8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#mechanism-blue)"/><text x="607.5" y="177" text-anchor="middle" fill="#1c78d8" font-size="9.7" font-weight="850"><tspan x="607.5" dy="0">ExtProc · Batch</tspan></text><path d="M675,210 L540,210" fill="none" stroke="#1c78d8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#mechanism-blue)"/><text x="607.5" y="203" text-anchor="middle" fill="#1c78d8" font-size="9.7" font-weight="850"><tspan x="607.5" dy="0">selected endpoint</tspan></text><path d="M540,236 L834,236" fill="none" stroke="#c56a00" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-bronze)"/><text x="687" y="229" text-anchor="middle" fill="#c56a00" font-size="9.7" font-weight="850"><tspan x="687" dy="0">Batch stream</tspan></text><rect x="835" y="230" width="10" height="170" rx="4" fill="#c56a00"/><path d="M52,262 L540,262" fill="none" stroke="#087f5b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-green)"/><text x="296" y="255" text-anchor="middle" fill="#087f5b" font-size="9.7" font-weight="850"><tspan x="296" dy="0">Realtime request</tspan></text><path d="M540,288 L675,288" fill="none" stroke="#1c78d8" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#mechanism-blue)"/><text x="607.5" y="281" text-anchor="middle" fill="#1c78d8" font-size="9.7" font-weight="850"><tspan x="607.5" dy="0">ExtProc · Realtime</tspan></text><path d="M675,342 L540,342" fill="none" stroke="#6f42c1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#mechanism-purple)"/><text x="607.5" y="335" text-anchor="middle" fill="#6f42c1" font-size="9.7" font-weight="850"><tspan x="607.5" dy="0">ImmediateResponse 429 · Batch</tspan></text><path d="M540,368 L285,368" fill="none" stroke="#6f42c1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-purple)"/><text x="412.5" y="361" text-anchor="middle" fill="#6f42c1" font-size="9.7" font-weight="850"><tspan x="412.5" dy="0">Batch response · HTTP 429</tspan></text><path d="M540,394 L834,394" fill="none" stroke="#6f42c1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-purple)"/><text x="687" y="387" text-anchor="middle" fill="#6f42c1" font-size="9.7" font-weight="850"><tspan x="687" dy="0">reset Batch</tspan></text><path d="M833,387 L847,401 M847,387 L833,401" stroke="#6f42c1" stroke-width="2.2" stroke-linecap="round"/><path d="M675,420 L540,420" fill="none" stroke="#087f5b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" stroke-dasharray="5 3" marker-end="url(#mechanism-green)"/><text x="607.5" y="413" text-anchor="middle" fill="#087f5b" font-size="9.7" font-weight="850"><tspan x="607.5" dy="0">admit Realtime</tspan></text><path d="M540,420 L834,420" fill="none" stroke="#087f5b" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-green)"/><text x="687" y="433" text-anchor="middle" fill="#087f5b" font-size="9.7" font-weight="850"><tspan x="687" dy="0">Realtime stream</tspan></text><rect x="835" y="414" width="10" height="22" rx="4" fill="#087f5b"/><path d="M285,474 L405,474" fill="none" stroke="#6f42c1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-purple)"/><text x="345" y="467" text-anchor="middle" fill="#6f42c1" font-size="9.7" font-weight="850"><tspan x="345" dy="0">schedule backoff</tspan></text><path d="M405,500 L160,500" fill="none" stroke="#6f42c1" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" marker-end="url(#mechanism-purple)"/><text x="282.5" y="493" text-anchor="middle" fill="#6f42c1" font-size="9.7" font-weigh