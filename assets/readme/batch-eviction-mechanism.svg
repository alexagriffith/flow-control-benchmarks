      <path d="M 0 0 L 10 5 L 0 10 z" fill="#087f5b"/>
    </marker>
  </defs>
  <defs>
    <marker id="mechanism-bronze" viewBox="0 0 10 10" refX="8.3" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse" overflow="visible">
