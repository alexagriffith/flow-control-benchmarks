<svg xmlns="http://www.w3.org/2000/svg" width="960" height="568" viewBox="0 0 960 568" role="img" aria-labelledby="title desc"><title id="title">Batch eviction: 1 model replica benchmark results</title><desc id="desc">One pool. Protected latency. Completed batch. Median realtime p95 TTFT across four matched scenarios with reliable batch recovery.</desc><style>text{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;letter-spacing:0}</style><rect width="960" height="568" fill="#ffffff"/><text x="40.0" y="42.0" fill="#087f73" font-size="11" font-weight="800" text-anchor="start">BATCH EVICTION · 1 MODEL REPLICA</text><text x="40.0" y="84.0" fill="#15202b" font-size="34" font-weight="800" text-anchor="start">One pool.</text><text x="40.0" y="122.0" fill="#15202b" font-size="34" font-weight="800" text-anchor="start">Protected latency.</text><text x="40.0" y="160.0" fill="#087f73" font-size="34" font-weight="800" text-anchor="start">Completed batch.</text><text x="40.0" y="186.0" fill="#5f6c7b" font-size="14" font-weight="500"><tspan x="40.0" dy="0.0">Consolidate chat and batch on shared GPUs without choosing cost or user experience.</tspan></text><text x="40.0" y="232.0" fill="#5f6c7b" font-size="13" font-weight="650" text-anchor="start">Median realtime p95 TTFT across three matched 300-second repeats</text><text x="40.0" y="258.0" fill="#15202b" font-size="15" font-weight="750" text-anchor="start">Realtime only</text><text x="920.0" y="258.0" fill="#15202b" font-size="16" font-weight="800" text-anchor="end">342 ms</text><rect x="220" y="266" width="660" height="26" rx="4" fill="#eef1f4"/><rect x="220" y="266" width="373.2" height="26" rx="4" fill="#2f6fed"/><line x1="593.2" y1="266" x2="593.2" y2="292" stroke="#2f6fed" stroke-width="2" opacity="0.65"/><text x="40.0" y="306.0" fill="#5f6c7b" font-size="12" font-weight="500" text-anchor="start">Matches realtime-only reference</text><text x="40.0" y="320.0" fill="#15202b" font-size="15" font-weight="750" text-anchor="start">Realtime + batch, no protection</text><text x="920.0" y="320.0" fill="#15202b" font-size="16" font-weight="800" text-anchor="end">561 ms</text><rect x="220" y="328" width="660" height="26" rx="4" fill="#eef1f4"/><rect x="220" y="328" width="611.1" height="26" rx="4" fill="#b83232"/><text x="40.0" y="368.0" fill="#5f6c7b" font-size="12" font-weight="500" text-anchor="start">+218 ms versus realtime only</text><text x="40.0" y="382.0" fill="#15202b" font-size="15" font-weight="750" text-anchor="start">Realtime + batch, reserved capacity</text><text x="920.0" y="382.0" fill="#15202b" font-size="16" font-weight="800" text-anchor="end">341 ms</text><rect x="220" y="390" width="660" height="26" rx="4" fill="#eef1f4"/><rect x="220" y="390" width="372.0" height="26" rx="4" fill="#087f73"/><text x="40.0" y="430.0" fill="#5f6c7b" font-size="12" font-weight="500" text-anchor="start">-1 ms versus realtime only</text><text x="40.0" y="444.0" fill="#15202b" font-size="15" font-weight="750" text-anchor="start">Realtime + batch, eviction and retry</text><text x="920.0" y="444.0" fill="#15202b" font-size="16" font-weight="800" text-anchor="end">348 ms</text><rect x="220" y="452" width="660" height="26" rx="4" fill="#eef1f4"/><rect x="220" y="452" width="379.3" height="26" rx="4" fill="#6650a4"/><text x="40.0" y="492.0" fill="#5f6c7b" font-size="12" font-weight="500" text-anchor="start">+6 ms versus realtime only</text><rect x="40" y="512" width="880" height="40" rx="6" fill="#15202b"/><text x="60.0" y="538.0" fill="#ffffff" font-size="13" font-weight="700" text-anchor="start">561 ms → 341 ms with reserved capacity · 38 evicted → 38 retried → 38 final results · zero duplicates</text><text x="40.0" y="552.0" fill="#5f6c7b" font-size="11" font-weight="500" text-anchor="start">Values are generated from the package summary data. Median p95 TTFT in milliseconds.</text></svg>
