<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-label="Realtime p95 time to first token was 342 milliseconds with realtime only, 561 milliseconds with unprotected batch, 341 milliseconds with reserved capacity, and 348 milliseconds with batch eviction and retry. All 38 evicted requests were retried and completed with zero duplicate results.">
  <rect width="1200" height="520" fill="#ffffff"/>
  <text x="24" y="40" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="22" font-weight="800" fill="#151515" letter-spacing="0">Realtime p95 time to first token under batch load</text>
  <text x="24" y="66" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" fill="#60656b" letter-spacing="0">Median of each run's p95 across three matched 300-second repeats</text>

  <line x1="340" y1="92" x2="340" y2="356" stroke="#d5d8dc" stroke-width="1"/>
  <line x1="540" y1="92" x2="540" y2="356" stroke="#eceef0" stroke-width="1"/>
  <line x1="740" y1="92" x2="740" y2="356" stroke="#eceef0" stroke-width="1"/>
  <line x1="940" y1="92" x2="940" y2="356" stroke="#eceef0" stroke-width="1"/>
  <line x1="1140" y1="92" x2="1140" y2="356" stroke="#eceef0" stroke-width="1"/>

  <text x="24" y="129" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#20252b" letter-spacing="0">Realtime only</text>
  <text x="24" y="148" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#60656b" letter-spacing="0">Latency reference</text>
  <rect x="340" y="112" width="421" height="42" rx="4" fill="#2b6cb0"/>
  <text x="777" y="140" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#20252b" letter-spacing="0">342 ms</text>

  <text x="24" y="197" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#20252b" letter-spacing="0">Realtime + batch</text>
  <text x="24" y="216" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#60656b" letter-spacing="0">No protection</text>
  <rect x="340" y="180" width="691" height="42" rx="4" fill="#c53030"/>
  <text x="1047" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#20252b" letter-spacing="0">561 ms</text>

  <text x="24" y="265" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#20252b" letter-spacing="0">Realtime + batch</text>
  <text x="24" y="284" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#60656b" letter-spacing="0">Reserved capacity</text>
  <rect x="340" y="248" width="420" height="42" rx="4" fill="#14866d"/>
  <text x="776" y="276" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#20252b" letter-spacing="0">341 ms</text>

  <text x="24" y="333" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="15" font-weight="700" fill="#20252b" letter-spacing="0">Realtime + batch</text>
  <text x="24" y="352" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" fill="#60656b" letter-spacing="0">Eviction and retry; 324-472 ms range</text>
  <rect x="340" y="316" width="428" height="42" rx="4" fill="#6b4c9a"/>
  <text x="784" y="344" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="17" font-weight="800" fill="#20252b" letter-spacing="0">348 ms</text>

  <text x="340" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#72777d" text-anchor="middle" letter-spacing="0">0</text>
  <text x="540" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#72777d" text-anchor="middle" letter-spacing="0">162</text>
  <text x="740" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#72777d" text-anchor="middle" letter-spacing="0">325</text>
  <text x="940" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#72777d" text-anchor="middle" letter-spacing="0">487</text>
  <text x="1140" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" fill="#72777d" text-anchor="middle" letter-spacing="0">650 ms</text>

  <line x1="24" y1="412" x2="1176" y2="412" stroke="#d5d8dc" stroke-width="1"/>
  <text x="24" y="448" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" letter-spacing="0">Safe recovery</text>
  <text x="24" y="474" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#454b51" letter-spacing="0">All 38 evicted batch requests were retried and completed.</text>
  <text x="650" y="448" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" letter-spacing="0">No duplicate results</text>
  <text x="650" y="474" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" fill="#454b51" letter-spacing="0">5,376 batch jobs completed with zero duplicate results.</text>
</svg>
