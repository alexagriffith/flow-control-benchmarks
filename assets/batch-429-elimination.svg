<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" role="img" aria-label="Rejected requests under a batch flood, 48,224 with the gate off and 0 with it on"><rect width="1200" height="400" fill="#ffffff"/><text x="20" y="34" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="20" font-weight="800" fill="#151515" text-anchor="start" letter-spacing="-0.5">Batch overload queued instead of rejected</text><text x="20" y="56" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="500" fill="#6b6b6b" text-anchor="start">HTTP 429 responses under the same offered load</text><rect x="90.0" y="110.0" width="420.0" height="190.0" rx="10" fill="#ee0000"/><text x="300.0" y="96" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#ee0000" text-anchor="middle" letter-spacing="-1">48,224</text><text x="300.0" y="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#151515" text-anchor="middle" letter-spacing="1.5">GATE OFF</text><text x="300.0" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="middle">requests rejected with 429</text><text x="880.0" y="284" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#1f8a5f" text-anchor="middle" letter-spacing="-1">0</text><text x="880.0" y="330" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#151515" text-anchor="middle" letter-spacing="1.5">GATE ON</text><text x="880.0" y="350" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="400" fill="#6b6b6b" text-anchor="middle">requests rejected</text><line x1="534" y1="280" x2="646" y2="280" stroke="#c9c8c2" stroke-width="2"/><path d="M 646 280 l -12 -6 v 12 z" fill="#c9c8c2"/><text x="590.0" y="266" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#4a4a4a" text-anchor="middle">the gate</text><text x="20" y="380" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="600" fill="#383838" text-anchor="start">Same offered load, same GPU. Gate on keeps excess batch work queued at the Endpoint Picker.</text></svg>