<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Matched pair: moving the bursting tenant to a lower band left peer latency unchanged"><rect width="1200" height="560" fill="#ffffff"/><text x="20" y="30" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="18" font-weight="800" fill="#151515" text-anchor="start">Ordering is not occupancy</text><text x="20" y="52" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Identical traffic, run twice. The only change is which priority band the bursting tenant sits in. Three counted 300 s repeats each, seed 42, one GPU.</text><rect x="20" y="72" width="560" height="330" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><text x="40" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515" text-anchor="start">Run 1, one band</text><text x="40" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">All three tenants at priority 100</text><text x="40" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">queue depth threshold 4 &#183; max_num_seqs 128 &#183; output 64</text><rect x="620" y="72" width="560" height="330" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><text x="640" y="98" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515" text-anchor="start">Run 2, two bands</text><text x="640" y="116" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Bursting tenant demoted to priority 0</text><text x="640" y="134" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">queue depth threshold 4 &#183; max_num_seqs 128 &#183; output 64</text><text x="40" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">p95 time to first token during the burst</text><text x="40" y="189" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant A</text><text x="40" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">the burster, 67 requests/s</text><rect x="180" y="177" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="180" y="177" width="276" height="16" rx="8" fill="#1c78d8"/><text x="502" y="190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">534 ms</text><text x="40" y="233" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant B</text><text x="40" y="247" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">6 requests/s</text><rect x="180" y="221" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="180" y="221" width="261" height="16" rx="8" fill="#1f8a5f"/><text x="502" y="234" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">506 ms</text><text x="40" y="277" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant C</text><text x="40" y="291" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">6 requests/s</text><rect x="180" y="265" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="180" y="265" width="251" height="16" rx="8" fill="#d59a00"/><text x="502" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">485 ms</text><text x="40" y="314" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">Mean queue duration</text><text x="40" y="345" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant A</text><rect x="180" y="333" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="180" y="333" width="275" height="16" rx="8" fill="#1c78d8"/><text x="502" y="346" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">39.9 ms</text><text x="40" y="377" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant B</text><rect x="180" y="365" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="180" y="365" width="76" height="16" rx="8" fill="#1f8a5f"/><text x="502" y="378" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">11.1 ms</text><text x="40" y="409" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant C</text><rect x="180" y="397" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="180" y="397" width="72" height="16" rx="8" fill="#d59a00"/><text x="502" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">10.4 ms</text><text x="640" y="158" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">p95 time to first token during the burst</text><text x="640" y="189" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant A</text><text x="640" y="203" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">the burster, 67 requests/s</text><rect x="780" y="177" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="780" y="177" width="291" height="16" rx="8" fill="#1c78d8"/><text x="1102" y="190" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">564 ms</text><text x="640" y="233" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant B</text><text x="640" y="247" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">6 requests/s</text><rect x="780" y="221" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="780" y="221" width="250" height="16" rx="8" fill="#1f8a5f"/><text x="1102" y="234" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">483 ms</text><text x="640" y="277" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant C</text><text x="640" y="291" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">6 requests/s</text><rect x="780" y="265" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="780" y="265" width="249" height="16" rx="8" fill="#d59a00"/><text x="1102" y="278" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">482 ms</text><text x="640" y="314" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">Mean queue duration</text><text x="640" y="345" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant A</text><rect x="780" y="333" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="780" y="333" width="287" height="16" rx="8" fill="#1c78d8"/><text x="1102" y="346" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">41.6 ms</text><text x="640" y="377" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant B</text><rect x="780" y="365" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="780" y="365" width="90" height="16" rx="8" fill="#1f8a5f"/><text x="1102" y="378" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">13.1 ms</text><text x="640" y="409" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tenant C</text><rect x="780" y="397" width="310" height="16" rx="8" fill="#eeeeee"/><rect x="780" y="397" width="82" height="16" rx="8" fill="#d59a00"/><text x="1102" y="410" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">11.9 ms</text><line x1="20" y1="418" x2="1180" y2="418" stroke="#e6e6e6"/><text x="20" y="444" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="start">What moved</text><text x="20" y="466" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">The queue duration split held in both runs. The bursting tenant carried roughly three and a half times the queue of its peers whether it shared their band or sat below them.</text><text x="20" y="486" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Peer p95 time to first token barely moved: 506 and 485 ms in one band, 483 and 482 ms in two. Demoting the burster reordered the dispatch queue and did not change who was holding the engine.</text><text x="20" y="514" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="700" fill="#151515" text-anchor="start">Priority and fairness both order the queue in front of vLLM. Neither one caps how much of the running batch a tenant may occupy, so at this load the batch stayed full of the burster either way.</text><text x="20" y="540" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Run 1 and Run 2, 2026-07-28, endpoint gpt-oss-20b-fc. vLLM running p95 128 and waiting p95 22 and 26. Zero non-200 in both runs.</text></svg>