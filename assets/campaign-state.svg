<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-label="Campaign state: the five beat story, what is proven, what is running, and what is open"><rect width="1200" height="750" fill="#ffffff"/><text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#151515" text-anchor="start">Where the campaign stands</text><text x="20" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">One GPU per endpoint, GPT-OSS 20B behind the llm-d inference gateway. Updated 2026-07-28.</text><text x="20" y="92" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">THE STORY WE CAN TELL TODAY</text><rect x="20.0" y="104" width="220.8" height="132" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><circle cx="42.0" cy="128" r="11" fill="#1f8a5f"/><text x="42.0" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">1</text><text x="60.0" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Size the pool</text><text x="34.0" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">A sweep finds the knee and the</text><text x="34.0" y="169" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">cost of sitting on it.</text><text x="34.0" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Concurrency is not load.</text><text x="34.0" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#1f8a5f" text-anchor="start">569 ms to 6.0 s</text><text x="243.8" y="170" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c8c8c8" text-anchor="start">&#8594;</text><rect x="254.8" y="104" width="220.8" height="132" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><circle cx="276.8" cy="128" r="11" fill="#1f8a5f"/><text x="276.8" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">2</text><text x="294.8" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Consolidate</text><text x="268.8" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Interactive tenants share one</text><text x="268.8" y="169" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">GPU and hold the objective as</text><text x="268.8" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">more arrive.</text><text x="268.8" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#1f8a5f" text-anchor="start">45 to 69 ms</text><text x="478.6" y="170" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c8c8c8" text-anchor="start">&#8594;</text><rect x="489.6" y="104" width="220.8" height="132" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><circle cx="511.6" cy="128" r="11" fill="#1f8a5f"/><text x="511.6" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">3</text><text x="529.6" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Protect the tier</text><text x="503.6" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">When the pool saturates,</text><text x="503.6" y="169" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">priority decides who waits.</text><text x="503.6" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#1f8a5f" text-anchor="start">41 vs 379 ms</text><text x="713.4000000000001" y="170" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c8c8c8" text-anchor="start">&#8594;</text><rect x="724.4000000000001" y="104" width="220.8" height="132" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><circle cx="746.4000000000001" cy="128" r="11" fill="#1f8a5f"/><text x="746.4000000000001" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">4</text><text x="764.4000000000001" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">Absorb the batch</text><text x="738.4000000000001" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Batch traffic carries its own</text><text x="738.4000000000001" y="169" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">waiting instead of displacing</text><text x="738.4000000000001" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">interactive work.</text><text x="738.4000000000001" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#1f8a5f" text-anchor="start">202 vs 64 ms</text><text x="948.2" y="170" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="400" fill="#c8c8c8" text-anchor="start">&#8594;</text><rect x="959.2" y="104" width="220.8" height="132" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><circle cx="981.2" cy="128" r="11" fill="#d59a00"/><text x="981.2" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">5</text><text x="999.2" y="132" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">State the limit</text><text x="973.2" y="154" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Ordering the queue does not</text><text x="973.2" y="169" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">cap occupancy, so the tail</text><text x="973.2" y="184" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#4a4a4a" text-anchor="start">stays shared.</text><text x="973.2" y="222" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" fill="#d59a00" text-anchor="start">506 to 483 ms</text><text x="20" y="258" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="700" fill="#8a8a8a" text-anchor="start">WHAT IS DONE, WHAT IS MOVING, WHAT IS NOT ANSWERED</text><rect x="20.0" y="272" width="376.0" height="366" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20.0" y="272" width="376.0" height="4" rx="2" fill="#1f8a5f"/><text x="36.0" y="302" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Proven and publishable</text><circle cx="40.0" cy="328" r="4" fill="#1f8a5f"/><text x="52.0" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Capacity envelope</text><text x="52.0" y="347" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">5 shapes, 9 steps</text><text x="52.0" y="360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">sweep summaries</text><circle cx="40.0" cy="374" r="4" fill="#1f8a5f"/><text x="52.0" y="378" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Consolidation, three phase</text><text x="52.0" y="393" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">3 repeats, 42,162 requests</text><text x="52.0" y="406" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">zero non-200, artifact fixed</text><circle cx="40.0" cy="420" r="4" fill="#1f8a5f"/><text x="52.0" y="424" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Service tiers</text><text x="52.0" y="439" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">3 repeats, 53,399 requests</text><text x="52.0" y="452" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">saturated, 2 non-200</text><circle cx="40.0" cy="466" r="4" fill="#1f8a5f"/><text x="52.0" y="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Batch isolation</text><text x="52.0" y="485" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">3 repeats, 53,954 requests</text><text x="52.0" y="498" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">saturated, 2 non-200</text><circle cx="40.0" cy="512" r="4" fill="#1f8a5f"/><text x="52.0" y="516" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Overload probe</text><text x="52.0" y="531" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">4 load steps</text><text x="52.0" y="544" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">named drop reasons</text><circle cx="40.0" cy="558" r="4" fill="#1f8a5f"/><text x="52.0" y="562" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Same-band fairness</text><text x="52.0" y="577" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">3 repeats, matched pair</text><text x="52.0" y="590" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">burster carries 3.6x the queue</text><circle cx="40.0" cy="604" r="4" fill="#1f8a5f"/><text x="52.0" y="608" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Ordering is not occupancy</text><text x="52.0" y="623" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">3 repeats, same traffic</text><text x="52.0" y="636" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">band change left the tail flat</text><rect x="412.0" y="272" width="376.0" height="366" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="412.0" y="272" width="376.0" height="4" rx="2" fill="#1c78d8"/><text x="428.0" y="302" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Running now</text><circle cx="432.0" cy="328" r="4" fill="#1c78d8"/><text x="444.0" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Flow control off baselines</text><text x="444.0" y="347" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">agent A, three arms</text><text x="444.0" y="360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">on against off, same endpoint</text><circle cx="432.0" cy="374" r="4" fill="#1c78d8"/><text x="444.0" y="378" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Upstream detector experiment</text><text x="444.0" y="393" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">agent B, schema spike first</text><text x="444.0" y="406" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">one scenario, three arms</text><rect x="804.0" y="272" width="376.0" height="366" rx="10" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="804.0" y="272" width="376.0" height="4" rx="2" fill="#d59a00"/><text x="820.0" y="302" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="700" fill="#151515" text-anchor="start">Open, and named as open</text><circle cx="824.0" cy="328" r="4" fill="#d59a00"/><text x="836.0" y="332" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">What an occupancy limit does</text><text x="836.0" y="347" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">plugins absent from tested build</text><text x="836.0" y="360" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">the upstream track answers it</text><circle cx="824.0" cy="374" r="4" fill="#d59a00"/><text x="836.0" y="378" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Tail separation inside an objective</text><text x="836.0" y="393" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">not achieved at this capacity</text><text x="836.0" y="406" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">stated as a boundary</text><circle cx="824.0" cy="420" r="4" fill="#d59a00"/><text x="836.0" y="424" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">maxRequests behavior</text><text x="836.0" y="439" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">never exercised</text><text x="836.0" y="452" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">no run hit a band queue cap</text><circle cx="824.0" cy="466" r="4" fill="#d59a00"/><text x="836.0" y="470" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">KV term</text><text x="836.0" y="485" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">likely inert at this token shape</text><text x="836.0" y="498" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">confirmable from existing samples</text><circle cx="824.0" cy="512" r="4" fill="#d59a00"/><text x="836.0" y="516" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="600" fill="#383838" text-anchor="start">Multi-pod behavior</text><text x="836.0" y="531" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#8a8a8a" text-anchor="start">one pod per endpoint</text><text x="836.0" y="544" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10" font-weight="400" fill="#9a9a9a" text-anchor="start">averaging across pods untested</text><line x1="20" y1="664" x2="1180" y2="664" stroke="#e6e6e6"/><text x="20" y="688" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#151515" text-anchor="start">The honest one-sentence version</text><text x="20" y="708" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Flow control lets one GPU carry workloads that would otherwise need several, and under saturation it decides who waits rather than removing the wait.</text><text x="20" y="726" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Queue duration separates strongly, median separates moderately, and the tail stays shared, because ordering a queue is not the same as limiting how much of the engine a tenant holds.</text></svg>