<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 822" role="img" aria-label="Decision map from question to mechanism, with the limit of each mechanism"><rect width="1200" height="822" fill="#ffffff"/><text x="20" y="32" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="19" font-weight="800" fill="#151515" text-anchor="start">Which knob answers which question</text><text x="20" y="54" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="400" fill="#6b6b6b" text-anchor="start">Start at the top. Each question has one mechanism that answers it, and the others will not, however far you turn them.</text><rect x="20" y="84" width="1160" height="56" rx="9" fill="#f4f7fb" stroke="#1c78d8"/><text x="40" y="108" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13.5" font-weight="700" fill="#151515" text-anchor="start">Does the pool ever reach its active batch limit under real traffic?</text><text x="40" y="127" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" font-weight="400" fill="#4a4a4a" text-anchor="start">Run the capacity sweep first. If vLLM never queues a request, flow control is inert and no setting below changes anything you can measure.</text><text x="600" y="160" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="600" fill="#8a8a8a" text-anchor="middle">&#8595; it does</text><rect x="20" y="182" width="1160" height="94" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20" y="182" width="4" height="94" rx="2" fill="#1f8a5f"/><text x="40" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">You want to hold a latency objective while load stays inside capacity</text><text x="40" y="232" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f8a5f" text-anchor="start">Active batch limit</text><text x="183.6" y="232" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">max_num_seqs</text><text x="40" y="252" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Pick it from the sweep, at the concurrency where p95 still meets the objective. Here that was near 64,</text><text x="40" y="267" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">against the 128 these runs used.</text><text x="640" y="208" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Limit: Lower means better latency and less throughput. It stops helping once offered load exceeds what the</text><text x="640" y="223" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">pool can clear.</text><rect x="20" y="286" width="1160" height="94" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20" y="286" width="4" height="94" rx="2" fill="#1f8a5f"/><text x="40" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">You want one tenant to stop taking more than its share of a tier</text><text x="40" y="336" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1f8a5f" text-anchor="start">Fairness policy</text><text x="162.0" y="336" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">round-robin, one flow per tenant</text><text x="40" y="356" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Splits dispatch turns across the tenants in a band that have work queued. The burster carried about 3.6</text><text x="40" y="371" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">times its peers’ queue duration.</text><text x="640" y="312" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Limit: It bounds hogging, and it cannot reserve capacity. An empty queue forfeits its turn, so a quiet</text><text x="640" y="327" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">tenant does not hold a share it is not asking for.</text><rect x="20" y="390" width="1160" height="94" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20" y="390" width="4" height="94" rx="2" fill="#d59a00"/><text x="40" y="416" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">You want one tier protected from another tier’s load</text><text x="40" y="440" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#d59a00" text-anchor="start">Priority bands</text><text x="154.8" y="440" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">priority 100 / 0 / -10</text><text x="40" y="460" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Serves a higher band before a lower one, and holds the lower band first when the gate closes.</text><text x="640" y="416" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Limit: It reorders only when the protected band has work queued at that moment. It does not evict work</text><text x="640" y="431" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">already running in the engine.</text><rect x="20" y="494" width="1160" height="94" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20" y="494" width="4" height="94" rx="2" fill="#d59a00"/><text x="40" y="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">You want to choose where the waiting happens</text><text x="40" y="544" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#d59a00" text-anchor="start">Saturation detector</text><text x="190.8" y="544" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">queueDepthThreshold</text><text x="40" y="564" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Sets when the gate closes. At 1 the gate trips on the first queued request, at 4 it tolerates four. It</text><text x="40" y="579" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">rejects nothing.</text><text x="640" y="520" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Limit: Tighter moves waiting upstream where policy applies and costs peak throughput. It did not by itself</text><text x="640" y="535" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">separate the latency tail.</text><rect x="20" y="598" width="1160" height="94" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20" y="598" width="4" height="94" rx="2" fill="#1c78d8"/><text x="40" y="624" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">You want to bound how large a burst can grow, and for how long</text><text x="40" y="648" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1c78d8" text-anchor="start">Queue limits</text><text x="140.4" y="648" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">maxRequests, maxBytes, defaultRequestTTL</text><text x="40" y="668" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Capacity returns 429 with rejected-saturated. Time to live returns 503 with rejected-ttl-expired.</text><text x="640" y="624" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Limit: Independent of the gate, so a tight threshold with a generous capacity engages policy early and still</text><text x="640" y="639" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">absorbs a large burst.</text><rect x="20" y="702" width="1160" height="94" rx="9" fill="#fbfbfb" stroke="#e6e6e6"/><rect x="20" y="702" width="4" height="94" rx="2" fill="#1c78d8"/><text x="40" y="728" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12.5" font-weight="700" fill="#151515" text-anchor="start">You want absolute latency held while offered load exceeds capacity</text><text x="40" y="752" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="12" font-weight="700" fill="#1c78d8" text-anchor="start">Replicas</text><text x="111.6" y="752" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">more pods, or a smaller request shape</text><text x="40" y="772" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11" font-weight="400" fill="#4a4a4a" text-anchor="start">Nothing in the policy layer adds headroom. Every setting above decides who waits, not whether anyone does.</text><text x="640" y="728" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">Limit: This is the only answer to the question. Treat a policy change proposed here as a sign the pool is</text><text x="640" y="743" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="10.5" font-weight="400" fill="#8a8a8a" text-anchor="start">undersized.</text></svg>