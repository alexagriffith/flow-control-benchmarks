<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="The configuration process first finds GPU capacity, then sets vLLM limits, chooses when requests wait, accounts for request shape, and links every sweep to its evidence."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="214" fill="#ffffff"/><rect x="10" y="10" width="860" height="194" rx="7" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="ladder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b96a3"/></marker></defs><rect x="28" y="50" width="146" height="112" rx="7" fill="#fbfcfd" stroke="#087f72" stroke-width="1.5"/><circle cx="50" cy="72" r="12" fill="#087f72"/><text x="50.0" y="76.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">1</text><text x="44.0" y="105.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">GPU capacity</text><text x="44.0" y="130.0" fill="#087f72" font-size="8.5" font-weight="700" text-anchor="start">128 requests</text><path d="M174 106.0 H190" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="198" y="50" width="146" height="112" rx="7" fill="#fbfcfd" stroke="#2d6cdf" stroke-width="1.5"/><circle cx="220" cy="72" r="12" fill="#2d6cdf"/><text x="220.0" y="76.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">2</text><text x="214.0" y="105.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">vLLM limits</text><text x="214.0" y="130.0" fill="#2d6cdf" font-size="8.5" font-weight="700" text-anchor="start">128 seq · 8,192 tokens</text><path d="M344 106.0 H360" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="368" y="50" width="146" height="112" rx="7" fill="#fbfcfd" stroke="#087f72" stroke-width="1.5"/><circle cx="390" cy="72" r="12" fill="#087f72"/><text x="390.0" y="76.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">3</text><text x="384.0" y="105.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Wait signal</text><text x="384.0" y="130.0" fill="#087f72" font-size="8.5" font-weight="700" text-anchor="start">request count</text><path d="M514 106.0 H530" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="538" y="50" width="146" height="112" rx="7" fill="#fbfcfd" stroke="#c56a00" stroke-width="1.5"/><circle cx="560" cy="72" r="12" fill="#c56a00"/><text x="560.0" y="76.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">4</text><text x="554.0" y="105.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Request shape</text><text x="554.0" y="130.0" fill="#c56a00" font-size="8.5" font-weight="700" text-anchor="start">input tokens when sizes vary</text><path d="M684 106.0 H700" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="708" y="50" width="146" height="112" rx="7" fill="#fbfcfd" stroke="#697684" stroke-width="1.5"/><circle cx="730" cy="72" r="12" fill="#697684"/><text x="730.0" y="76.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">5</text><text x="724.0" y="105.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="start">Evidence</text><text x="724.0" y="130.0" fill="#697684" font-size="8.5" font-weight="700" text-anchor="start">link every sweep</text></svg>
