<svg xmlns="http://www.w3.org/2000/svg" width="880" height="214" viewBox="0 0 880 214" role="img" aria-label="The configuration process first finds GPU capacity, then sets vLLM limits, chooses when requests wait, accounts for request shape, and links every sweep to its evidence."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="214" fill="#ffffff"/><rect x="10" y="10" width="860" height="194" rx="7" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="ladder-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8b96a3"/></marker></defs><rect x="20" y="48" width="152" height="116" rx="7" fill="#fbfcfd" stroke="#087f72" stroke-width="1.5"/><circle cx="42" cy="70" r="12" fill="#087f72"/><text x="42.0" y="74.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">1</text><text x="96.0" y="106.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="middle">GPU capacity</text><text x="96.0" y="132.0" fill="#087f72" font-size="8.5" font-weight="700" text-anchor="middle">128 requests</text><path d="M172 106.0 H184" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="192" y="48" width="152" height="116" rx="7" fill="#fbfcfd" stroke="#2d6cdf" stroke-width="1.5"/><circle cx="214" cy="70" r="12" fill="#2d6cdf"/><text x="214.0" y="74.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">2</text><text x="268.0" y="106.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="middle">vLLM limits</text><text x="268.0" y="126.0" fill="#2d6cdf" font-size="8.5" font-weight="700" text-anchor="middle">128 sequences</text><text x="268.0" y="141.0" fill="#2d6cdf" font-size="8.5" font-weight="700" text-anchor="middle">8,192 tokens</text><path d="M344 106.0 H356" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="364" y="48" width="152" height="116" rx="7" fill="#fbfcfd" stroke="#087f72" stroke-width="1.5"/><circle cx="386" cy="70" r="12" fill="#087f72"/><text x="386.0" y="74.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">3</text><text x="440.0" y="106.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="middle">Wait signal</text><text x="440.0" y="132.0" fill="#087f72" font-size="8.5" font-weight="700" text-anchor="middle">request count</text><path d="M516 106.0 H528" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="536" y="48" width="152" height="116" rx="7" fill="#fbfcfd" stroke="#c56a00" stroke-width="1.5"/><circle cx="558" cy="70" r="12" fill="#c56a00"/><text x="558.0" y="74.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">4</text><text x="612.0" y="106.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="middle">Request shape</text><text x="612.0" y="132.0" fill="#c56a00" font-size="8.5" font-weight="700" text-anchor="middle">input-token count</text><path d="M688 106.0 H700" stroke="#8b96a3" stroke-width="2" marker-end="url(#ladder-arrow)"/><rect x="708" y="48" width="152" height="116" rx="7" fill="#fbfcfd" stroke="#697684" stroke-width="1.5"/><circle cx="730" cy="70" r="12" fill="#697684"/><text x="730.0" y="74.0" fill="#ffffff" font-size="9" font-weight="800" text-anchor="middle">5</text><text x="784.0" y="106.0" fill="#15202b" font-size="11" font-weight="800" text-anchor="middle">Evidence</text><text x="784.0" y="132.0" fill="#697684" font-size="8.5" font-weight="700" text-anchor="middle">link every sweep</text></svg>
