<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" role="img" aria-label="The story in five beats, from capacity sweep to batch utilization"><rect width="1200" height="150" fill="#ffffff"/><rect x="20.0" y="24" width="220.8" height="102" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="50.0" cy="75.0" r="14" fill="#ee0000"/><text x="50.0" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">1</text><text x="74.0" y="71.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515">Sweep the envelope</text><text x="74.0" y="91.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">know the knee before you commit</text><path d="M 242.8 69.0 l 9 6 l -9 6" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="254.8" y="24" width="220.8" height="102" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="284.8" cy="75.0" r="14" fill="#ee0000"/><text x="284.8" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">2</text><text x="308.8" y="71.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515">Consolidate below it</text><text x="308.8" y="91.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">fewer GPUs, target upheld</text><path d="M 477.6 69.0 l 9 6 l -9 6" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="489.6" y="24" width="220.8" height="102" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="519.6" cy="75.0" r="14" fill="#ee0000"/><text x="519.6" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">3</text><text x="543.6" y="71.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515">Tiers past the knee</text><text x="543.6" y="91.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">premium stays fast in a surge</text><path d="M 712.4000000000001 69.0 l 9 6 l -9 6" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="724.4000000000001" y="24" width="220.8" height="102" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="754.4000000000001" cy="75.0" r="14" fill="#ee0000"/><text x="754.4000000000001" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">4</text><text x="778.4000000000001" y="71.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515">Fairness in a tier</text><text x="778.4000000000001" y="91.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">no per-team babysitting</text><path d="M 947.2 69.0 l 9 6 l -9 6" fill="none" stroke="#9a9a9a" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><rect x="959.2" y="24" width="220.8" height="102" rx="12" fill="#fbfbfb" stroke="#d7d7d7"/><circle cx="989.2" cy="75.0" r="14" fill="#ee0000"/><text x="989.2" y="80.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="13" font-weight="800" fill="#ffffff" text-anchor="middle">5</text><text x="1013.2" y="71.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="14" font-weight="700" fill="#151515">Batch fills the gaps</text><text x="1013.2" y="91.0" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif" font-size="11.5" fill="#6b6b6b">utilization without risk</text></svg>