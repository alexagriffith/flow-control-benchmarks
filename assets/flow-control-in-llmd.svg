<svg xmlns="http://www.w3.org/2000/svg" width="880" height="230" viewBox="0 0 880 230" role="img" aria-label="Requests pass through the llm-d Gateway. Inside the Endpoint Picker, flow-control admission runs first. Filters remove candidates, scorers rank them, and the picker selects a vLLM replica."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="230" fill="#ffffff"/><rect x="10" y="10" width="860" height="210" rx="6" fill="none" stroke="#dde3ea"/><defs><marker id="arch-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#7f8a98"/></marker><marker id="queue-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="5" markerHeight="5" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#c56a00"/></marker></defs><rect x="24" y="66" width="104" height="98" rx="7" fill="#fbfcfd" stroke="#dde3ea"/><text x="76.0" y="89.0" fill="#15202b" font-size="10.5" font-weight="780" text-anchor="middle">Requests</text><rect x="38" y="105" width="76" height="20" rx="4" fill="#ffffff" stroke="#dde3ea"/><text x="76.0" y="119.0" fill="#5f6c7b" font-size="8.5" font-weight="700" text-anchor="middle">tenant</text><rect x="38" y="132" width="76" height="20" rx="4" fill="#ffffff" stroke="#dde3ea"/><text x="76.0" y="146.0" fill="#5f6c7b" font-size="8.5" font-weight="700" text-anchor="middle">priority</text><rect x="152" y="66" width="124" height="98" rx="7" fill="#fbfcfd" stroke="#dde3ea"/><text x="214.0" y="104.0" fill="#15202b" font-size="10.5" font-weight="780" text-anchor="middle">llm-d Gateway</text><text x="214.0" y="125.0" fill="#5f6c7b" font-size="8.5" font-weight="650" text-anchor="middle">routes request</text><rect x="302" y="28" width="430" height="174" rx="8" fill="#f8fcfb" stroke="#087f72" stroke-width="2"/><text x="517.0" y="54.0" fill="#15202b" font-size="11" font-weight="780" text-anchor="middle">Endpoint Picker</text><rect x="318" y="78" width="96" height="58" rx="6" fill="#ffffff" stroke="#087f72" stroke-width="1.5"/><text x="366.0" y="99.0" fill="#15202b" font-size="9" font-weight="760" text-anchor="middle">Flow control</text><text x="366.0" y="117.0" fill="#087f72" font-size="8" font-weight="650" text-anchor="middle">admit or queue</text><rect x="318" y="154" width="96" height="25" rx="5" fill="#fffaf5" stroke="#c56a00"/><text x="366.0" y="171.0" fill="#c56a00" font-size="8" font-weight="720" text-anchor="middle">policy queue</text><rect x="432" y="78" width="76" height="58" rx="6" fill="#ffffff" stroke="#2d6cdf"/><text x="470.0" y="101.0" fill="#15202b" font-size="9" font-weight="760" text-anchor="middle">Filters</text><text x="470.0" y="120.0" fill="#5f6c7b" font-size="8" font-weight="650" text-anchor="middle">eligible</text><rect x="526" y="78" width="82" height="58" rx="6" fill="#ffffff" stroke="#2d6cdf"/><text x="567.0" y="101.0" fill="#15202b" font-size="9" font-weight="760" text-anchor="middle">Scorers</text><text x="567.0" y="120.0" fill="#5f6c7b" font-size="8" font-weight="650" text-anchor="middle">rank</text><rect x="626" y="78" width="82" height="58" rx="6" fill="#ffffff" stroke="#2d6cdf"/><text x="667.0" y="101.0" fill="#15202b" font-size="9" font-weight="760" text-anchor="middle">Picker</text><text x="667.0" y="120.0" fill="#5f6c7b" font-size="8" font-weight="650" text-anchor="middle">select</text><path d="M128 115 H145" stroke="#7f8a98" stroke-width="1.7" marker-end="url(#arch-arrow)"/><path d="M276 115 H295" stroke="#7f8a98" stroke-width="1.7" marker-end="url(#arch-arrow)"/><path d="M414 107 H425" stroke="#7f8a98" stroke-width="1.7" marker-end="url(#arch-arrow)"/><path d="M508 107 H519" stroke="#7f8a98" stroke-width="1.7" marker-end="url(#arch-arrow)"/><path d="M608 107 H619" stroke="#7f8a98" stroke-width="1.7" marker-end="url(#arch-arrow)"/><path d="M366 136 V147" stroke="#c56a00" stroke-width="1.6" marker-end="url(#queue-arrow)"/><path d="M708 107 H749" stroke="#7f8a98" stroke-width="1.7" marker-end="url(#arch-arrow)"