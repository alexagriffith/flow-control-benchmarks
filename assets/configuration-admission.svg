<svg xmlns="http://www.w3.org/2000/svg" width="880" height="318" viewBox="0 0 880 318" role="img" aria-label="Request count is measured in the Endpoint Picker before dispatch. Queue depth is measured in the vLLM waiting queue and KV pressure in the vLLM KV cache after dispatch. Both pressure signals return to the Endpoint Picker admission gate."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="318" fill="#ffffff"/><rect x="10" y="10" width="860" height="298" rx="7" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="admit-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667180"/></marker><marker id="queue-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2d6cdf"/></marker><marker id="kv-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#c56a00"/></marker></defs><rect x="36" y="116" width="120" height="62" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="96.0" y="151.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">New requests</text><rect x="216" y="48" width="286" height="222" rx="8" fill="#f4fbf9" stroke="#087f72" stroke-width="2"/><text x="359.0" y="73.0" fill="#15202b" font-size="12" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="244" y="96" width="230" height="48" rx="6" fill="#ffffff" stroke="#087f72" stroke-width="1.5"/><text x="359.0" y="124.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Request counter · 128 in flight</text><rect x="244" y="186" width="230" height="48" rx="6" fill="#ffffff" stroke="#087f72" stroke-width="1.5"/><text x="359.0" y="214.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Admission gate</text><path d="M156 147 H244" fill="none" stroke="#667180" stroke-width="2"