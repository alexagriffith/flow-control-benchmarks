<svg xmlns="http://www.w3.org/2000/svg" width="720" height="330" viewBox="0 0 720 330" role="img" aria-label="Request count is measured in the Endpoint Picker before dispatch. Queue depth and KV-cache pressure are measured inside vLLM and signal pressure after dispatch."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="720" height="330" fill="#ffffff"/><defs><marker id="signal-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#667180"/></marker></defs><rect x="14" y="18" width="692" height="90" rx="7" fill="#fbfcfd" stroke="#dde3ea"/><text x="32.0" y="46.0" fill="#087f72" font-size="13" font-weight="800" text-anchor="start">Request count</text><text x="32.0" y="68.0" fill="#15202b" font-size="10" font-weight="750" text-anchor="start">128 in-flight requests</text><text x="32.0" y="86.0" fill="#5f6c7b" font-size="9" font-weight="650" text-anchor="start">before dispatch</text><rect x="196" y="38" width="170" height="50" rx="6" fill="#f1fbf8" stroke="#087f72"/><text x="281.0" y="67.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Endpoint Picker · counts admitted work</text><path d="M366 63 H430" stroke="#667180" stroke-width="2" marker-end="url(#signal-arrow)"/><rect x="440" y="38" width="128" height="50" rx="6" fill="#ffffff" stroke="#dde3ea"/><text x="504.0" y="67.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">vLLM</text><text x="640.0" y="68.0" fill="#087f72" font-size="9" font-weight="760" text-anchor="middle">new work waits</text><rect x="14" y="120" width="692" height="90" rx="7" fill="#fbfcfd" stroke="#dde3ea"/><text x="32.0" y="148.0" fill="#2d6cdf" font-size="13" font-weight="800" text-anchor="start">Queue depth</text><text x="32.0" y="170.0" fill="#15202b" font-size="10" font-weight="750" text-anchor="start">8 waiting requests</text><text x="32.0" y="188.0" fill="#5f6c7b" font-size="9" font-weight="650" text-anchor="start">inside vLLM</text><rect x="196" y="140" width="128" height="50" rx="6" fill="#ffffff" stroke="#2d6cdf"/><text x="260.0" y="169.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">vLLM</text><path d="M324 165 H388" stroke="#2d6cdf" stroke-width="2" marker-end="url(#signal-arrow)"/><rect x="398" y="140" width="170" height="50" rx="6" fill="#f1fbf8" stroke="#087f72"/><text x="483.0" y="169.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Endpoint Picker · receives pressure</text><text x="640.0" y="170.0" fill="#2d6cdf" font-size="9" font-weight="760" text-anchor="middle">new work waits</text><rect x="14" y="222" width="692" height="90" rx="7" fill="#fbfcfd" stroke="#dde3ea"/><text x="32.0" y="250.0" fill="#c56a00" font-size="13" font-weight="800" text-anchor="start">KV pressure</text><text x="32.0" y="272.0" fill="#15202b" font-size="10" font-weight="750" text-anchor="start">0.8 guardrail</text><text x="32.0" y="290.0" fill="#5f6c7b" font-size="9" font-weight="650" text-anchor="start">inside vLLM</text><rect x="196" y="242" width="128" height="50" rx="6" fill="#ffffff" stroke="#c56a00"/><text x="260.0" y="271.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">vLLM</text><path d="M324 267 H388" stroke="#c56a00" stroke-width="2" marker-end="url(#signal-arrow)"/><rect x="398" y="242" width="170" height="50" rx="6" fill="#f1fbf8" stroke="#087f72"/><text x="483.0" y="271.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Endpoint Picker · receives pressure</text><text x="640.0" y="272.0" fill="#c56a00" font-size="9" font-weight="760" text-anchor="middle">new work waits</text></svg>
