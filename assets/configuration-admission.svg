<svg xmlns="http://www.w3.org/2000/svg" width="880" height="330" viewBox="0 0 880 330" role="img" aria-label="Request count is measured in the Endpoint Picker before dispatch. Queue depth is measured in the vLLM waiting queue and KV pressure in the vLLM KV cache after dispatch. Both pressure signals return to the Endpoint Picker admission gate."><style>text{font-family:system-ui,-apple-system,sans-serif}</style><rect width="880" height="330" fill="#ffffff"/><rect x="10" y="10" width="860" height="310" rx="7" fill="#ffffff" stroke="#dde3ea"/><defs><marker id="admit-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#667180"/></marker><marker id="queue-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#2d6cdf"/></marker><marker id="kv-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="4" markerHeight="4" orient="auto"><path d="M0 1L8 5L0 9Z" fill="#c56a00"/></marker></defs><rect x="24" y="112" width="108" height="48" rx="6" fill="#fbfcfd" stroke="#dde3ea" stroke-width="1.5"/><text x="78.0" y="140.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">New requests</text><rect x="158" y="34" width="388" height="264" rx="8" fill="#f4fbf9" stroke="#087f72" stroke-width="2"/><text x="352.0" y="60.0" fill="#15202b" font-size="12" font-weight="800" text-anchor="middle">Endpoint Picker</text><rect x="184" y="108" width="142" height="56" rx="6" fill="#ffffff" stroke="#087f72" stroke-width="1.5"/><text x="255.0" y="131.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Request count</text><text x="255.0" y="148.0" fill="#5f6c7b" font-size="8" font-weight="700" text-anchor="middle">128 in-flight</text><rect x="370" y="92" width="150" height="88" rx="6" fill="#ffffff" stroke="#087f72" stroke-width="1.5"/><text x="445.0" y="140.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Admission gate</text><rect x="370" y="224" width="150" height="50" rx="6" fill="#fffaf5" stroke="#c56a00" stroke-width="1.5"/><text x="445.0" y="245.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Policy queue</text><text x="445.0" y="262.0" fill="#5f6c7b" font-size="8" font-weight="700" text-anchor="middle">new work waits</text><path d="M132 136 H184" fill="none" stroke="#667180" stroke-width="2" marker-end="url(#admit-arrow)"/><path d="M326 136 H370" fill="none" stroke="#087f72" stroke-width="2" marker-end="url(#admit-arrow)"/><path d="M445 180 V224" fill="none" stroke="#c56a00" stroke-width="2" marker-end="url(#kv-arrow)"/><rect x="584" y="34" width="270" height="264" rx="8" fill="#f7faff" stroke="#2d6cdf" stroke-width="2"/><text x="719.0" y="60.0" fill="#15202b" font-size="12" font-weight="800" text-anchor="middle">vLLM</text><rect x="614" y="90" width="210" height="48" rx="6" fill="#ffffff" stroke="#dde3ea" stroke-width="1.5"/><text x="719.0" y="118.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Running requests</text><rect x="614" y="170" width="210" height="44" rx="6" fill="#ffffff" stroke="#2d6cdf" stroke-width="1.5"/><text x="719.0" y="196.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">Waiting queue · depth</text><rect x="614" y="240" width="210" height="44" rx="6" fill="#ffffff" stroke="#c56a00" stroke-width="1.5"/><text x="719.0" y="266.0" fill="#15202b" font-size="9" font-weight="780" text-anchor="middle">KV cache · pressure</text><path d="M520 118 H614" fill="none" stroke="#667180" stroke-width="2" marker-end="url(#admit-arrow)"/><path d="M614 192 H556 L520 152" fill="none" stroke="#2d6cdf" stroke-width="2" marker-end="url(#queue-arrow)"/><path d="M614 262 H566 L520 166" fill="none" stroke="#c56a00" stroke-width="2" marker-end="url(#kv-arrow)"/></svg>
